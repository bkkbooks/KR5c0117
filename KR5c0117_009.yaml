body:
  text: 抱一子陳顯微述九藥篇藥者雜治也凡三十一章關尹子曰勿輕小事小隙沉舟勿輕小物小蟲毒身勿輕小人小人賊國能周小事然後能成大事能積小物然後能成大物能善小人然後能契大人天既無可必者人人又無能必者事惟去事離人則我在我惟可即可未有當繁簡可當戒忍可當勤惰可勤惰一作動靜抱一子曰此一篇皆藥石之言所以謂之雜治也蓋人之處世未能去事離人則應事接物之際一動一止有吉凶悔吝存焉聖人欲人避凶就吉免悔吝之虞故垂藥石之訓使人服膺而對治之非大聖大智其孰能如是哉且夫天既無可必者人人又無能必者事其敢輕小人輕小物輕小事哉孔子曰人心險於山川難於知天天猶有春秋冬夏旦暮之期人者厚貌深情其就義若渴者其去義若熱豈可測哉世之輕小人易小物忽小事而至於敗國亡家喪身失命者多矣故聖人謂能善小人然後能契大人能積小物然後能成大物能周小事然後能成大事無非自小以至大自微以至著而不敢以其小人小物小事而輕忽之也聖人之待小者且加之謹況其大者乎天下之理未有當繁之事以簡能了者亦未有當戒之事可以强忍爲之者亦未有當勤之事可以慵情成之者故聖人於世惟可則可惟不可則不可故於事無可無不可初何固必哉是知聖人雖日應事物而不著事不著物而我在我矣關尹子曰智之極者知智果不足以周物故愚辯之極者知辯果不足以喻物故訥勇之極者知勇果不足以勝物故怯抱一子曰天下之理爭之則不足遜之則不餘聖人之大智若愚大辯若訥大勇若怯者豈姑爲是偽行哉蓋知夫智果不足以周物故愚辯果不足以喻物故訥勇果不足以勝物故怯耳傳曰其愚不可及則智不如愚十信九中不如一默則辯不如訥柔能制剛弱能勝强則勇不如怯關尹子曰天地萬物無有一物是吾之物物非我物不得不應我非我我不得不養雖應物未嘗有物雖養我未嘗有我勿曰外物然後外我勿曰外形然後外心道一而已不可序進抱一子曰善應物者無物善養我者無我有物則不能應物有我則不能養我何則物非我物我非我我纔外物便是外我纔外我便是外心若作内觀其心外觀其形遠觀其物則分心我物爲三未免序進也道一而已直下便見不勞分别一空總空何必序進哉關尹子曰諦毫末者不見天地之大審小音者不聞雷霆之聲見大者亦不見小見邇者亦不見遠聞大者亦不聞小聞邇者亦不聞遠聖人無所見故能無不見無所聞故能無不聞抱一子曰人有所見則有所不見有所聞則有所不聞非神有所限而精有所量也用吾精神不得其道耳殊不知凡天地萬物之妙者皆吾之神凡天地萬物之有者皆吾之精夫如是則聖人無所見乃能無所不見無所聞乃能無所不聞學者知之乎關尹子曰目之所見不知其幾何或愛金或愛玉是執一色爲目也耳之所聞不知其幾何或愛鍾或愛鼓者是執一聲爲耳也惟聖人不慕之不拒之不處之抱一子曰是章又釋前章之㫖聖人慮學者不知無所見無所聞爲大也姑以所見所聞喻之如目之所見不知其幾何色而視其物者執某色以拘其見耳之所聞不知其幾何聲而聽某響者執其聲以拘其聞惟聖人則不慕彼之聲色亦不拒彼之形響惟不處吾之見聞則吾之見聞大矣關尹子曰善今者可以行古善末者可以立本抱一子曰學者欲行古道必善今俗欲反本源須知末務苟生於今之世而違今之俗則害生矣只知有本源而不知有末務則難立矣故聖人和光同塵以善今泛應曲當以善末者乃所以爲行古道立本源之地也歟關尹子曰狡勝賊能捕賊勇勝虎能捕虎能克己乃能成己能勝物乃能利物能忘道乃能有道抱一子曰賊以狡勝虎以勇勝固矣然則己以何克哉己者我身也克者能勝也知我身本何物則知所以克之之道矣學者當觀我本無己因七情六欲縁合而生欲克我身先克情欲前章不云乎能制一情者可以成德能忘一情者可以契道此聖人成己之學也既能成己矣然後能利物苟有一物存乎吾前則爲物勝矣焉能利物哉既能成己又能利物可以造道矣然則道可忘乎道未能忘焉能有道關尹子曰函堅則物必毁之剛則折矣刀利則物必摧之銳則挫矣威鳳以難見爲神是以聖人以深爲根走麝以遺香不捕是以聖人以約爲紀抱一子曰堅則毁矣銳則挫矣以深爲根以約爲紀皆老子之言也關尹子復以函刀鳳麝以發明老子之㫖使學者盡守柔取虚韜光無藏之理以曲全免咎而已豈非藥石之言乎關尹子曰瓶有二竅水實之倒瀉閉一則水不下蓋不昇則不降井雖千仞汲之水上蓋不降則不昇是以聖人不先物抱一子曰聖人不敢爲天下先者乃所以爲天地萬物之先也何則天下之理不昇則不降不後則不先不下則不高故老子爲天下谿爲天下谷皆此意也以管取水按上竅則水下留以瓶吸水中置火則水逆上皆不昇則不降之理與閉竅汲井同一理然則可昇可降者水也所以閉之汲之火之按之者人也人之所以能使水之昇降留逆者氣也雖然天道好還持而盈之不如其已況敢先物乎是尤聖人所大戒也關尹子曰人之有失雖己受害於已失之後乆之竊議於未失之前惟其不恃己聰明而兼人之聰明自然無我而兼天下之我終身行之可以不失抱一子曰使睿智聰明如虞舜猶不自恃其聰明而捨己從人況餘人乎殊不知不恃己聰明而兼人之聰明易而能察人之情偽而擇其爲交際難噫知人知言之說堯舜其猶病諸關尹子曰古今之俗不同東西南北之俗又不同至於一家一身之善又不同吾豈執一豫格後世哉惟隨時同俗先機後事捐忿塞欲簡物恕人權其輕重而爲之自然合神不測契道無方抱一子曰隨時同俗先機後事捐忿塞欲簡物恕人是數者與孔子翼易隨時同人知幾成務懲忿窒欲易簡恕忠之言略同而學者不知謂道家之學獨尚無爲是則將謂聖人執一豫格後世聖人何心哉古今四方一家一身俗尚雖各不同而聖人權其輕重而爲之制可從先進則先進可拜下則拜下惟其無可無不可所以合神不測契道無方也孔子不云乎竊比於我老彭然則孔老之道其可以異觀哉關尹子曰有道交者有德交者有事交者道交者父子也出於是非賢愚之外者故乆德交則有賢愚是非矣故或合或離事交者合則離抱一子曰子華子與孔子相遇於途傾蓋終日歡如平生孔子顧弟子取束帛以贈先生而子路疑之蓋子華子者老子之弟子程本也孔子一見傾蓋如故此道交也二子邂逅相遇目擊道存豈若世俗之德交利交有賢愚是非利害之分哉宜乎子路之不識也噫安得如程子華孔仲尼邂逅傾蓋相忘於形骸之外哉關尹子曰勿以拙陋曰道之質當樂敏捷勿以愚暗曰道之晦當樂輕明勿以傲易曰道之高當樂和同勿以汗漫曰道之廣當樂要急勿以幽憂曰道之寂當樂悅豫古人之言學之多弊不可不救抱一子曰古人之言教不止一端在當時有禽滑釐宋餅尹文彭蒙田餅愼到墨翟諸家之學今其言不傳至盂子之時止有楊墨二家之言則知禽宋尹彭田愼之言至關尹仲尼之時已拒絶之矣敏捷者如今之襌學問答所以尚口捷給也輕明者如今之騰身踴躍習觀之類也和同者如西域教之六羣和合也要急者如今之參一句話頭以求頓悟也悦豫者如今之放逸曠達逍遥自在也是數者雖非當時古人之教而其事大率相類學之多弊亦不可不救也關尹子曰不可非世是己不可卑人尊己不可以輕忽道己不可以訕謗德己不可以鄙猥才己抱一子曰非世者世亦非之禍也卑人者人亦卑之辱也遇輕忽而能忍自以爲己有道淺也遇訕謗而不辯自以爲己有德驕也至於逢鄙猥之人自以爲己有才繆也是五者皆學者之病也宜自藥之關尹子曰困天下之智者不在智而在愚窮天下之辯者不在辯而在訥抱一子曰人之多智多辯者病也人之能愚能訥者藥也智不能困天下之智辯不能窮天下之辯以智攻智以辯敵辯如以火止火以水止水耳奚益哉昔南唐選博學辯給之使使本朝我太祖選不識字至愚至訥武夫對之使辯博之使拔無所施即此道也關尹子曰天不能冬蓮春菊是以聖人不違時地不能洛橘汶貉是以聖不違俗聖人不能使手步足握是以聖人不違我所長聖人不能使魚飛禽馳是以聖人不違人所長夫如是者可動可止可晦可明惟不可拘所以爲道抱一子曰天下道術或尚晦或尚明或尚動或尚止皆自然之理也聖人觀天之道以時吾神之晦明察地之利以宜吾形之動止近取諸身如此則遠示之人亦莫不然是則神宜明則明之神宜晦則晦之形宜動則動之形宜靜則止之耳吾之手不能歩足不能握猶魚不能飛禽不能馳也天猶不可使冬蓮春菊地猶不可使洛橘汶貉而況違我所長乎而況違人所長乎苟違其形神之所長而强爲之斯害也已道安在哉關尹子曰少言者不爲人所忌少行者不爲人所短少智者不爲人所勞少能者不爲人所役抱一子曰多言則爲人所忌多行則爲人所短多智則爲人所勞多能則爲人所役皆悔吝也可不謹哉關尹子曰操之以誠行之以簡待之以恕應之以默吾道不窮抱一子曰應事接物不可不誠不誠喪德故於誠則操而存之不可不簡不簡則勞神故於簡則行而宜之不可不恕不恕則忿不懲不可不默不默則機不密盡是四者吾道何窮哉關尹子曰謀之于事斷之于理作之于人成之于天事師于今理師于古事同于人道獨于己抱一子曰謀今之事當以今之事爲師如善弓者師弓不師羿善舟者師舟不師奡其則不遠也斷事之理當以古人爲師古之聖人揆理曲盡非今人所及也事作於人不得不與人同其好惡也既謂之事矣作之於人成之於天在我何敢固必哉若夫道則在我獨行之而已矣關尹子曰金玉難捐土石易捨學道之士遇微言妙行愼勿執之是可爲而不可執若執之者腹心之疾無藥可療抱一子曰學者得一善言聞一善行則拳拳服膺而勿失可謂好學矣殊不知此可以成德不可以入道道則靈臺皎潔一物不留庶可晞覬若遇微言妙行執之於心是爲腹心之疾無藥可療何則土石易捨金玉難捐微言妙行入人心府終身不忘昔人謂一句合道語萬劫繫驢椿信哉關尹子曰人不明於急務而從事於多務他務奇務者窮困灾厄及之殊不知道無不在不可捨此就彼抱一子曰世之學者信異而不信常好奇而不好正故多從事於奇務他務多務而荒其本業廢其常産失其生計道未見而窮困灾厄先及之矣殊不知日用常行道無不在故曰人當明於急務所謂急務者爲人子以事親爲急爲人父以教子爲急爲人下以事上爲急爲人上以安下爲急至於爲士以行業爲急爲農以耕桑爲急爲工以材器爲急爲啇以貨通爲急之類皆急務也豈可捨此就彼哉此之急務了辦不志於道則已苟有餘力而志於道則道在其中矣關尹子曰天下之理捨親就疏捨本就末捨賢就愚捨近就遠可暫而已乆則害生抱一子曰此章又重發明上章之㫖謂學者亦有捨親就疏捨本就末捨賢就愚捨近就遠而於道有所得者可暫而已乆則害生關尹子曰昔之論道者或曰凝寂或曰邃深或曰澄徹或曰空同或曰晦㝠愼勿遇此而生怖退天下至理竟非言意苟知非言非意在彼微言妙意之上乃契吾說抱一子曰自古聖賢立言垂訓所上不同同歸於道有言凝然寂默者有言澄湛虚徹者有言空無大同者有言晦㝠息滅者學者遇此勿生退怖道不在言意言意豈能盡道耶在彼微言妙意之上乃契聖人之說關尹子曰聖人大言金玉小言桔梗芣苢也用之當桔梗芣苢生之不當金玉斃之抱一子曰聖人之言精者如金如玉粗者如梗如苢昔人謂細語及麤言皆歸無上道有因麤言而悟道者有研細語而不悟者如用藥之當服草木生之用之不當服金玉斃之安取乎藥之貴賤哉惟其當而已矣關尹子曰言某事者甲言利乙言害丙言或利或害丁言俱利俱害必居一于此矣喻道者不言抱一子曰道與事不同事則有利有害故言事則有某言中利某言中害之理至於言道則終無某言中道某言不中道之理故善喻道者不言關尹子曰事有在事言有理道無在道言無理知言無理則言言皆道不知言無理雖執至言爲梗爲翳抱一子曰道與事相及如水火晝夜之不侔也學者言道如言事則誤矣言事則事有所在故事之言有理也言道則無在無不在則道之言安有所謂理哉若知夫道無理可言則言言皆道不然則雖執至言爲梗爲翳而已關尹子曰不信愚人易不信賢人難不信賢人易不信聖人難不信一聖人易不信千聖人難夫不信千聖人者外不見人内不見我上不見道下不見事抱一子曰學道自信門入信苟不篤道無由而入矣然而信聖賢易信狂愚難信至狂愚則吾之信可謂篤矣然吾之所謂信者非世人之所謂信也世人之所謂信者信之信也吾之所謂信者不信之信也若夫不信狂愚之人則世人皆能信吾之不信也至於不信賢人則世人未必信吾之不信也況乎至於不信聖人則豈世人信其不信者乎又況乎至於不信千萬聖人此則世人尤所難信之法也惟能信吾不信千萬聖人者其信可謂眞信矣是人也其亦外不見人内不見我上不見道下不見事者哉關尹子曰聖人言蒙蒙所以使人聾聖人言㝠㝠所以使人盲聖人言沉沉所以使人瘖惟聾則不聞聲惟盲則不見色惟瘖則不音言不聞聲者不聞道不聞事不聞我不見色者不見道不見事不見我不音言者不言道不言事不言我抱一子曰昔有學者問於其師曰有一人負盲聾瘖三者之病來見於師師何以發藥師曰汝近前來學者近前而立師以掌示之曰此何物曰掌師叱出曰汝非三種病人矣噫是人聞師語而近前則不聾矣能見掌則不盲矣曰掌則不瘖矣然其人始發問端似知此理及乎被師一勘則本情露矣參同契曰耳目口三寳固塞勿發通陰符經曰九竅之邪在乎三要可以動靜與此同㫖嗚呼安得不聞聲不見色不音言者與之意會哉關尹子曰人徒知僞得之中有眞失殊不知眞得之中有眞失徒知僞是之中有眞非殊不知眞是之中有眞非抱一子曰天下學者皆知偽得之中有眞失偽是之中有眞非故求眞得以爲得眞是以爲是也殊不知道無得失無是非纔有得失有是非則是事也非道也若人學道而忽遇異物異景而横執以爲眞得眞是者往往多遭魔攝而不悟其爲眞失眞非矣關尹子曰言道者如言夢夫言夢者曰如此金玉如此器皿如此禽獸言者能言之不能取而與之聽者能聞之不能受而得之惟善聽者不泥不辨抱一子曰此一喻最善與人說道誠如說夢說者曰吾夢極富貴聽者曰吾且不見吾且不知說者曰吾眞有是夢不可不信聽者曰吾既不見不知何以生信說者不能取而示之則曰聽者不智聽者不能得而見之則曰說者不實如是則䛦者言之不如不言聽者聽之不如不辨昔人謂知道易不言難聞道易默會難故善聽者不於言下求道惟默會其言外之㫖可也苟泥其言而辨其實烏足以爲善聽善學者哉關尹子特於篇末垂此章爲訓者蓋欲學者觀此玄言不泥不辨惟領悟其言外之㫖而已矣關尹子曰圓爾道方爾德平爾行銳爾事抱一子曰道不圓則不神德不方則不正行不平則不常事不銳則不利關尹子迷微言妙義既終又慮學者或志道而忘德或立德而遺行或積行而廢事是則知務本而不知務末未有不因末而害本者也世固有因事之失而虧行者亦有因行之虧而損德者亦有因德之損而妨道者學者豈可只知從事於道而不資德行以相扶助哉又豈可只知積德累行而遇事不加之謹哉世亦有志于道而闡提德行與夫失業廢事者安知聖人立言垂訓體用畢備本末具陳如此詳盡耶噫關尹大聖人慈愍後世之心至矣盡矣不可思議失文始經言外㫖卷之九葛仙翁後序丹陽葛稚川曰洪體存蒿艾之資偶好喬松之壽知道之士雖微賤必親也雖夷狄必貴也後遇鄭君鄭君多玉笈瓊笥之書服餌開我以至道之良藥呼吸洗我以紫清之上味後屬洪以關尹子洪每愛之誦之藏之拜之宇者道也柱者建天地也極者尊聖人也符者精神魂魄也鑑者心也匕者食也釜者化也籌者物也藥者雜治也洪每味之泠泠然若躡飛葉而游乎天地之混㝠沉沉乎若履橫杖而浮乎大海之渺漠超若處金碧琳琅之居森若握鬼魅神姦之印倏若飄鸞鶴拏亦作怒若鬥虎兕清若浴碧慘若夢紅擒縱大道渾淪至理方士不能到先儒未嘗言可仰而不可攀可玩而不可執可鑑而不可思可符而不可言其忘物遺人者之所言乎其絶迹去智者之所言乎其同陰陽而㝠彼此者之所言乎何如此之尊高何如此之廣大又何如此之簡易也洪也幸親受之咸和二年五月朔丹陽葛洪炷薰敬序列子尅一列子姓列名禦寇鄭人也居鄭圃四十年人無識者初事壺丘子後師老商氏友伯高子進二子之道九年而後能御風而行弟子嚴恢問曰所爲問道者爲富乎列子曰桀紂唯輕道而重利是以亡其書凡八篇列子蓋有道之士而莊子亟稱之今汴梁鄭州圃田列子觀即其故隱唐開元封沖虛至德眞君書爲沖虛至德眞經右新書定著八章護左都水使者光禄大夫臣向言新校中書列子五篇臣向謹與長社尉臣參校讎太常書三篇太史書四篇臣向書六篇臣參書二篇内外書凡二十篇以校除複重十二篇定著八篇中書多外書少章亂布在諸篇中或字誤以盡爲進以賢爲形如此者衆及在新書有殘校讎從中書以定皆以殺青書可繕寫列子者鄭人也與鄭繆公同時蓋有道者也其學本於黃帝老子號曰道家道家者秉要執本清虚無爲及其治身接物務崇不競合於六經而穆王湯問二篇迂誕恢詭非君子之言也至於力命篇一推分命楊子之篇唯貴放逸二義乖背不似一家之書然各有所明亦有可觀者孝景皇帝時貴黃老術此書頗行於世及後遺落散在民間未有傳者且多寓言與莊周相類故太史公司馬遷不爲列傳謹第録臣向昧死上護左都水使者光禄大夫臣向所校列子書録永始三年八月壬寅上
