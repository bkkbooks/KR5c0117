front:
  text: 文始真經言外旨卷之二賢七
  hash: sha256:b9e83e43a477297877bf41ff247ae2b4c09bbc58c03d9a5537a6ddbc0b4227c5
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0117_HFL_002-001a, image: hfl/0453/0453-130.png}
body:
  text: 抱一子陳顯微述二柱篇柱者建天地也凡十二章關尹子曰若碗若盂若瓶若壺若甕若盎皆能建天地兆龜數蓍破瓦文石皆能告吉凶是知天地萬物成理一物包焉物物皆包之各不相借以我之精合彼之精兩精相薄而神應之一雌一雄卵生一牝一牡胎生形者彼之精理者彼之神愛者我之精觀者我之神愛為水觀為火愛執而觀因之為木觀存而愛攝之為金先想乎一元之氣具乎一物執愛之以合彼之形冥觀之以合彼之理則象存矣一運之象周乎太空自中而升為天自中而降為地無有升而不降無有降而不升升者為火降者為水欲升而不能升者為木欲降而不能降者為金木之為物鑽之得火絞之得水金之為物擊之得火鎔之得水金木者水火之交也水為精為天火為神為地木為魂為人金為魄為物運而不已者為時包而有在者為方惟土終始之有解之者有示之者抱一子曰天地者萬物父母也萬物生於天地而各具天地之體而微也具是體則具是理雖碗盂瓶盎皆有天地龜蓍瓦石皆存吉凶物之無情者尚爾況血氣有情者乎況人為萬物之靈者乎精神薄應形理愛觀執存因攝而生生不窮矣非天下至達其孰能與於此人徒知神為天而精為地而不知神火自地升精水自天降欲升不升者為木為人欲降不降者為金為物金木者水火之交也故各具水火之性運而不已四時生焉包而有在四方立焉四時既生四方既立則大中成焉大中成則土為尊矣故始之終之解而分之示而顯之皆中土之功也自夫大中之氣周乎太空則天自中而升地自中而降而天地之形分矣無有升而不降無有降而不升自上下下自上上下之精神也故人之髮根在首而四肢垂下魂神自天而降也草木之根茹在下而枝莖向上精魄自地而升也禽獸橫生則根在尾矣故雖具血氣之情而雜金木之性五行交雜則蠡動蟲蟲異稟異根有不可勝窮者矣關尹子曰天下之人蓋不可以億兆計人人之夢各異夜夜之夢各異有天有地有人有物皆思成之蓋不可以塵計安知今之天地非有思者乎抱一子曰夢中天地人物與覺時天地人物有以異乎無以異乎皆思成之乎非思成之乎嬰兒未解思念之時彼見天地人物亦不知其為天地人物也謂之天地人物者係乎識爾嬰兒未識之時能夢天地人物否乎彼初見之亦未識之久而後凝心水印之夢斯著矣猶如玉石鱗角之中有山川星月凝而結秀則形狀具存也然則鱗角有思乎玉石有思乎知鱗角玉石之思則知天地之思也關尹子曰心應棗肝應榆我通天地將陰夢水將晴夢火天地通我我與天地似契似離純純合歸抱一子曰天地形之大者也人身形之小者自形觀之則有小大之辨自神觀之則無離契之分天之日月明暗即人之精神盛衰豈特陰夢水晴夢火哉地之五味藥食即人之五臟好惡豈特心應棗肝應榆哉我與天地一乎二乎同歸乎各歸乎關尹子曰天地雖大有色有形有數有方吾有非色非形非數非方而天天地地者存抱一子曰生生者未嘗生死死者未嘗死是則天天者非天地地者非地也人徒見有形色數方者謂之天而不知非形色數方者能天天能地地能生生能死死也學者識認得真體會得實然後知不可以名言不可以形似昔人謂非心非物離性離相寒山子謂之天中之天亦強名也何可云謂哉關尹子曰死胎中者死卵中者亦人亦物天地雖大彼固不知計天地者皆我區識譬如手不觸刃刃不傷手抱一子曰識識易去識難稚年一見皓首不忘識之粘縛於人如此可畏哉彼死胎中死卵中者不見天地固矣然在胎在卵之時有識性乎無識性乎苟無識性則胡為而在胎在卵然則在胎在卵之中果有天地乎果無天地乎釋氏以識為五音之最微者以其難忘也使無識則不生矣不生則不中胎卵化濕之陰矣今日計有天地者皆我區識自計之天地何嘗期人之識哉故曰我不觸刃刃不傷人關尹子曰夢中鑑中水中皆有天地存焉欲去夢天地者寢不寐欲去鑑天地者形不照欲去水天地者盎不汲彼之有無在此不在彼是以聖人不去天地去識抱一子曰天地有大恩於人亦有大盜於人知其盜則不為其所盜矣天地本不盜人而人自盜之何則胸中之天地萬物始如夢見中如鑑照終凝於神水至死不能忘其為盜豈勝言哉然夢因寐鑑因照水因汲汲者取也夢生於視視生於取取生於識故曰不去天地去識言天地則萬物在其中矣關尹子曰天非自天有為天者地非自地有為地者譬如室宇舟車待人而成彼不自成知彼有待知此無待上不見天下不見地內不見我外不見人抱一子曰天不自天所以天長地不自地所以地久使人不自人我不自我則可以同天地之長久矣天地果待人而成乎待人而成者成夫人之胸中之天地爾待固在彼成不成在我故不為天地者上不見天下不見地內不見我外不見人關尹子曰有時者氣彼非氣者未嘗有晝夜有方者形彼非形者未嘗有南北何謂非氣氣之所自生者如搖箑得風彼未搖時非風之氣彼已搖時即名為氣何謂非形形之所自生者如鑽木得火彼未鑽時非火之形彼已鑽時即名為形抱一子曰氣不能生氣生氣者非氣也形不能生形生形者非形也或曰氣不能生氣則不問敢問形不能生形則人與萬物以形生形非乎曰枯木死尸亦形也能生形乎今人與萬物以形生形者蓋有非形者存乎其中雖金石草木莫不皆然故聖人獨以火而喻之以明形之最精者猶若是況形之粗者哉非氣者搖動則生氣非形者鑽磨則生形氣者天也有時也有晝夜也形者地也有方也有南北也世有尅時日擇方嚮以求生氣生形者焉知時在天地未判之先方乃自然南嚮之位也哉關尹子曰寒暑溫涼之變如瓦石之類置之火即熱置之水即寒呵之則溫吸之則涼特因外物有去有來而彼瓦石無去無來譬如水中之影有去有來而所謂水者實無去來抱一子曰愚解參同契嘗曰天地不能晝夜也以曰月往來而為晝夜天地不能寒暑也以日月遠近而為寒暑也此言寒暑之常也若夫盛夏寒風三冬暴鬱此不正之氣非時之風倏往忽來非天地有為也客氣往來爾故曰如水中之影有去有來而所謂水者實無去來關尹子曰衣搖空得風氣噓物得水水注水即鳴石擊石即光知此説者風雨雷電皆可為之蓋風雨雷電皆緣氣而生而氣緣心生猶如內想大火久之覺熱內想大水久之覺寒知此説者天地之德皆可同之抱一子曰人知精神魂魄猶天之風雨雷電風雨雷電出於天而人且能為之而自己之精神魂魄豈不能自生自養自保自鍊乎知搖空得風則鼓吾橐籥可以生氣知噓物得水則胎吾之氣可以化精知注水則鳴則鍊吾之精可以制魄知擊石即光則鍛吾之魄可以益神是則觀天之道執天之行而陰符之制在氣而氣之制在心想火則熱想水則寒潛天而天潛地而地千變萬化無不可為矣德同天地信哉關尹子曰五雲之變可以卜當年之豐歉八風之朝可以卜當時之吉凶是知休咎災祥一氣之運耳渾人我同天地而彼私智認而已之抱一子曰五雲八風有災有祥皆一氣之運而預見休咎于天地者也氣之為氣神矣哉靈矣哉而昧者不知也一人感之而五雲為之變八風為之遷蓋有至靈至神者存乎其中如是則曰人曰我曰天曰地莫不貫通而私智認為已有安知虛徹靈通大同之道哉關尹子曰天地寓萬物寓我寓道寓苟離於寓道亦不立抱一子曰寓者在已無居之謂也昔人謂人生天地之間若白駒之過隙忽然而已非寓而何我寓則天地寓天地非自成待我天天地地而成也故我寓則天地寓天地寓則萬物寓我與天地萬物皆寓矣而道獨不寓而長存焉則我與道為二矣道何立哉其人存則其道存其人亡則其道息故苟離於寓道亦不立文始真經言外旨卷之二
