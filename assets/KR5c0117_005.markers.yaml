  - {type: variant, offset: 4073, length: 2, content: 大大, CK-KZ: 物則物物足以役心而五行賊之隨類死物非死於物也死於心也惟聖人能神神而}
  - {type: variant, offset: 4073, length: 0, content: '', CK-KZ-jye: 物則物物足以役心而五行賊之隨類死物非死於物也死於心也惟聖人能神神而不神於神是以日應萬物其心寂然易曰寂然不動感而遂通謂惟寂而後能應也茲何以隨應而隨寂哉以能一心應之二而不寂以能虛心應之實而不寂以能靜心應之動而不寂夫寂者心體也卽物體也凡有應而不能寂者非心也非物也識也有彼我識而是非利害之意生有聖凡識而師羿師奡之意生有常變識而無中示有有中示無往來起滅之意生識生意意復生識如水之流舟如牛之運車又如犀牛之意在月而月形之入角者不能除故曰欲去千年之識者亦去其俄頃之意而已矣意去而識自去識空而心自空不識也不知也無時也無方也此時情漠漠然心渾渾然物浮浮然總而冥之于性夫性吾心之}
