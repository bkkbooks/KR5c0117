  - {type: variant, offset: 4057, length: 1, content: 七, CK-KZ: 器也夫旣謂之物矣曷爲乎化也以同乎物者化之旣同乎物矣烏能化之以異乎物者化之旣異乎物矣烏能化物乎且又烏知夫化物者之不與物俱化乎自其化者而觀之爪之生也髮之長也是或化爲非而恩或化爲仇也不化于形則化於情者也如是卽謂之不化可也聖人知其然是以不逆化而存不順化而變二幼不相識化于壯也而吾之不與壯俱化者不變二壯不相識化于老也而吾之不與老俱化者不變而不見夫情情}
  - {type: variant, offset: 4057, length: 0, content: '', CK-KZ-jye: 器也夫旣謂之物矣曷爲乎化也以同乎物者化之旣同乎物矣烏能化之以異乎物者化之旣異乎物矣烏能化物乎且又烏知夫化物者之不與物俱化乎自其化者而觀之爪之生也髮之長也是或化爲非而恩或化爲仇也不化于形則化於情者也如是卽謂之不化可也聖人知其然是以不逆化而存不順化而變二幼不相識化于壯也而吾之不與壯俱化者不變二壯不相識化于老也而吾之不與老俱化者不變而不見夫情情不停者乎而不見夫一呼一吸日行四十萬里者乎如輕風掣雲倐忽萬狀而太虛不動也如客有去來郵常自若也故曰聖人任化所以不化不化者何知一而不化也一者何性也性一者無人無我無死無生化而有未嘗化者也易曰知變化之道者其知神之所爲乎神莫神於化而不化之釜矣箋}
