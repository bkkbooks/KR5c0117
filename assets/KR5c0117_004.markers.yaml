  - {type: variant, offset: 175, length: 224, content: 精本無人故當忘其是非忘其得失以全吾之精神本無我故當時其晦明時其强弱以抱吾之神精一也水可分可合一也耳屬腎雖蔽之前後皆可聞一也水爲智智崇崇則自尊一也冬物歸根一也黑不可變一也北方主壽有我一也米去㲉則精存一也一數奇獨也故皆曰無人也神二也火因膏因薪二也舌屬心即唇齒而能言二也火爲禮禮卑則尊人二也夏物榮華二也赤色可變二也南主夭無我二也鬼憑物則神見二也二數耦兩也故皆曰無我也無人則在此者非彼無我則在彼者非此知乎此則知所以忘其是非得失與夫時其晦明强弱之理矣關尹子曰, CK-KZ: ''}
