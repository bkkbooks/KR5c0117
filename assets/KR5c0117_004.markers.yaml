  - {type: variant, offset: 4552, length: 2, content: 文始, CK-KZ: 朱象先曰符者何合也以吾之精神魂魄合天地萬物之金木水火則五行皆爲吾用而不復有相生相滅之機此永不輪迴不受生之妙用也然欲合天地萬物之金木水火須先合吾之精神魂魄精者水也神者火也魂者木也魄者金也金生水故魄能藏精而不能制精木生火故能魂藏神而不能鍊神金木間隔則坎離不交而生物之功廢故五行四象全藉三五一擒之五者何土也意也}
