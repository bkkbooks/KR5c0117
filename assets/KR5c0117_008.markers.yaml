  - {type: variant, offset: 1576, length: 1, content: 八, CK-KZ: 觸類而長之而萬物之差數覩矣故無以觀其妙不可喻也不可思也渾渾爾淪淪爾有以觀其徼則凡五色五聲五臭五氣五味其變不可勝計而不見夫呦呦旬旬逃逃者乎而不見夫茁茁停停蕭蕭者乎而不見夫嬰兒咤女金樓絳宫青蛟白虎寶鼎紅鑪者乎不執之皆道也在彼不在此也執之皆賊也金丹卽毒藥也聖人知其然是以去識而合其天不必見}
