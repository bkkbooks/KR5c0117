  - {type: variant, offset: 5535, length: 0, content: '', CK-KZ: 而亡也緣世亡其書道}
  - {type: variant, offset: 5535, length: 0, content: '', CK-KZ-jye: 而亡也緣世亡其書道}
  - {type: variant, offset: 5535, length: 0, content: '', YP-C: 而亡也緣世亡其書道}
  - {type: variant, offset: 5536, length: 0, content: '', CK-KZ: 失載故斯億度也徽皇御極大弘玄教政和中雕鏤藏經凡兩詔天下蒐訪道門隱書甚至督責郡縣入進者加以賞所獲雖眾而此書竟不出金源大定初重陽祖師自秦抵海倡起全眞追三代}
  - {type: variant, offset: 5536, length: 0, content: '', CK-KZ-jye: 失載故斯億度也徽皇御極大弘玄教政和中雕鏤藏經凡兩詔天下蒐訪道門隱書甚至督責郡縣入進者加以賞所獲雖眾而此書竟不出金源大定初重陽祖師自秦抵海倡起全眞追三代}
  - {type: variant, offset: 5536, length: 0, content: '', YP-C: 失載故斯億度也徽皇御極大弘玄教政和中雕鏤藏經凡兩詔天下蒐訪道門隱書甚至督責郡縣入進者加以賞所獲雖眾而此書竟不出金源大定初重陽祖師自秦抵海倡起全眞追三代}
  - {type: variant, offset: 5537, length: 0, content: '', CK-KZ: 湻風續無爲之古教長春嗣教詔赴龍庭陳先王之道德慈儉好生之諫切切而進妙沃聖心大加開納繇是淸淨之化雷動風行化洽華夷玄門大啟長春上仙之後清和典教名師高德輔玄翼德者珠聯玉耀於一時通都大邑宫觀相望星弁肩摩霞裾武接以至深山巖谷十百爲居草衣木食怡然有巢許之風雖髽童樵汲者亦皆進德業談道性無妄語一時教風之盛自三代而下未有如此時也𡻕癸巳有羽客張仲才南游回詣寶玄堂求見於宗師炷禮畢笈出一書將獻之眾師目之題籖曰關尹子書眾猶率然不爲意取讀之義奥文古詞徑閟澀猶車行螘蛭觸途皆硋乃相與鉤索漸得所指類推不已義大昭彰意至聖而言至希輕輕然冷冷然使人如登虛無之景遊廣漠之世不知心迹之俱超也眾師驚喜曰然則古有是書何絶世無聞今何從而出詰之則曰遊之楚得於采山之人蓋如李筌行陰符於石室也眾乃}
  - {type: page-break, offset: 5537, content: '', id: KR5c0117_CK-KZ_06p052b, image: JY134/CK-KZ_JY134_06p052b.png}
