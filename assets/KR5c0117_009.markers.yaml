  - {type: variant, offset: 5440, length: 0, content: '', CK-KZ: 智愚勇怯之數執之皆病不執之皆藥也是以下藥藥物中藥藥我上藥藥心何以明其然也執一聲爲耳病不在耳也執一色爲目病不在目也是舍本而就末者也聖人於是乎有不先物之藥藥今而以古也藥同而以獨也藥人而以天也若是足以明我乎未也微言非言也妙意非意也泥微言妙行而眞得之眞是之猶執夢中之言而器皿之禽獸之也故曰雖應物未嘗有物雖養我未嘗有我夫旣外不見物内不見我矣方圓與平銳均也庸愚與聖賢等也金玉與芣苢一也何也執之皆病不執之皆藥也古人曰藥藥元無藥知無藥之藥則知無物之物矣卽不言治可矣箋九藥出世紀道行乎教非}
  - {type: page-break, offset: 5440, content: '', id: KR5c0117_CK-KZ_06p050b, image: JY134/CK-KZ_JY134_06p050b.png}
