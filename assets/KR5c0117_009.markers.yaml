  - {type: variant, offset: 5448, length: 4, content: 九葛仙翁, CK-KZ: 蓋當時潛德不耀而教不大行今以莊列二書攷之列子則見而師之故多請問之辭莊子則聞風悅之遂稱之爲古之博大眞人以二子之高致而推尊如是其道蓋可知矣逮秦漢之交有蓋公者方異之人曹參嘗師事之事見於史以是書授參參旣用其道及薨與書俱葬孝武復得於方士又爲劉安匿之吁玄聖之書何鬱多而通鮮邪豈得之者懼夫漏神洩道寶秘而爲獨善之計邪自劉向表進之}
