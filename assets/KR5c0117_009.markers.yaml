  - {type: variant, offset: 5441, length: 1, content: 始, CK-KZ: 不宣蓋將以詔眾而傳遠也故教託文顯道因教明三者相須而不可偏廢也然文有隱見教實與焉所以關乎道之興替也孔子著六}
  - {type: variant, offset: 5441, length: 1, content: 始, CK-KZ-jye: 不宣蓋將以詔眾而傳遠也故教託文顯道因教明三者相須而不可偏廢也然文有隱見教實與焉所以關乎道之興替也孔子著六}
  - {type: variant, offset: 5441, length: 1, content: 始, YP-C: 不宣蓋將以詔眾而傳遠也故教託文顯道因教明三者相須而不可偏廢也然文有隱見教實與焉所以關乎道之興替也孔子著六}
  - {type: variant, offset: 5443, length: 0, content: '', CK-KZ: 以鳴道天下宗之教已行矣秦皇出而儒書焚文旣隱而教遂熄漢出屋壁而列之文旣彰而道乃行是知文之隱見卽道之晦明也故夫子有斯文未喪之嘆一皆推之於天信非人之智力所能及也我玄元道祖當周室之衰將有事乎西征而關令尹望雲氣知天眞至於是預期齋戒以俟應兆旣至乃延而師之受道德五千之}
  - {type: variant, offset: 5443, length: 0, content: '', CK-KZ-jye: 以鳴道天下宗之教已行矣秦皇出而儒書焚文旣隱而教遂熄漢出屋壁而列之文旣彰而道乃行是知文之隱見卽道之晦明也故夫子有斯文未喪之嘆一皆推之於天信非人之智力所能及也我玄元道祖當周室之衰將有事乎西征而關令尹望雲氣知天眞至於是預期齋戒以俟應兆旣至乃延而師之受道德五千之}
