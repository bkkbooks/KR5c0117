  - {type: variant, offset: 5459, length: 0, content: '', CK-KZ: 之序自茲以後是書遂秘由晉而來修文輔教如陶寇王尹李吳馬杜諸大師德所著子集見於藏室者不啻千餘卷終未有一言及於是書有宋碧虛先生教法中博贍者也其註老莊引證百家無所不至爲道德纂微序乃}
