  - {type: substitution, offset: 6181, original: 爲, replacement: 為, reason: scribal-variant-collapsed, mapping: {identifier: 'bkk:mapping/variant-fold-v1', hash: 'sha256:366e8ec95655b72d3205b878dc416602f82ff8a6b5dd240168f5ee5a7c65a61e', entry: vf-3592}}
  - {type: variant, offset: 6182, length: 1, content: 列, CK-KZ: 正經文字所束鼓舞變化指妙意於詞章之外而不失本旨故曰言外經旨所謂四者之道皆盡之矣其跌宕超詣出神入天亦足以起關尹於千載之下是註也惟曉於上智非訓詁之設也夫是經大教中不可闕者也抱一之註又是經中不可闕者也經旨旣明則使玄聖之旨昭昭乎如天日在上有眼目者俱得瞻依所謂教託文顯道因教明豈不信歟終南山樓觀宗聖宫卽眞人受經結草樓之地也人世雖更山川良是象先來瞻靈境心醉聖風游之詠之不知在數千年之外也因結夏是宫就出抱一之註札而}
