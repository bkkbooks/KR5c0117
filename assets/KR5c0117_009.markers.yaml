  - {type: variant, offset: 5557, length: 0, content: '', CK-KZ: 蓋有三全眞之教千百世間然一出也此經秘絶亦千年矣今眞教方隆秘經隨出不先不後同時相值是一異也清和典教蓋三傳矣不出於前師如有所俟正清和典教之年翻然而出是二異也旣出張君卽得之自楚之燕踰二千里都無迂墜直獻于師如有所使者是三異也噫以千載之前之尹書付千載之後之尹氏惠然自至如芥投針以三斯者而驗焉蒼蒼之意不遠矣昔者河出圖洛出書六經出於壞壁故先王之道明聖門恃之爲龜鑑今聖書出於道隆之世其萬世玄門之龜鑑乎繼而披雲天師刋鏤藏經卽補入藏室稱爲文始眞經遵太上之命號也眞常眞人開置玄學才俊聚焉朝講夕演多及是經然其詞旨敻異自成一家略無莊列寓言駕辯乘風夢蝶傲世等語自宇至藥分次篇目極有奥旨章章義異皆不失篇題自有書契以來未有如此書之淵奥也通玄而致命知天而盡神剖五常百行之}
