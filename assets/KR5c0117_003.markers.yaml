  - {type: variant, offset: 716, length: 189, content: 仁義無我則權天下之事以爲義禮無我則戒天下之心以爲禮智無我則照天下之識以爲智信無我則守天下之言以爲信此其所以不可跂及歟關尹子曰聖人之道或以仁爲仁或以義爲仁或以禮以智以信爲仁仁義禮智信各兼五者聖人一之不膠天下名之不得抱一子曰以仁爲仁天下之人能與知而與行至於以義以禮以智以信爲仁則非天下至聖其孰能與此何則舉一常而五常備五换循環各兼五者視賢智之士厚於仁而薄於義智有餘而信不足者大有徑庭也, CK-KZ: 物}
