  - {type: variant, offset: 4408, length: 1, content: 三, CK-KZ: 神感而遂通應物而現非物感之則寂無所向故所見人同蓋神無我也詳而推之近身遠物莫不皆然耳屬腎雖蔽之前後皆可聞一也智於五常應水智崇一也冬於時應水冬凋秋物而歸根一也黑於色應水黑不可變一也北於方應水北夀一也一數奇獨也故皆曰無人水之象也精者水故曰皆精曰可聞曰崇曰奇曰凋曰不可變曰夀又皆無人有我也舌屬心卽唇齒而成言二也禮於五常應火禮卑二也夏於時應火夏因春物而榮華二也赤於色應火赤可}
