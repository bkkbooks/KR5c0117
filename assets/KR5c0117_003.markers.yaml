  - {type: variant, offset: 4404, length: 0, content: '', CK-KZ: 有爲有思而聖人同之萬物有賢愚有好醜有利害是非而聖人因之其所以能因且同者何也無我也無我故其動若水其靜若鏡未嘗先人而嘗隨人時金時玉時糞時土時翔時逐時山時淵時明時愚時巧時拙如神龍出沒於太虛之表而變化不窮故天下不歸功於聖人而歸功於自然箋三極四符篇符者精神魂魄也凡十七章水可析可合精無人也火因膏因薪神無我也故耳蔽前後皆可聞無人智崇無人一奇無人冬凋秋物無人黑不可變無人北夀無人皆精舌卽齒牙成言無我禮卑無我二偶無我夏因春物無我赤可變無我南夭無我皆神以精無人故米去殼則精存以神無我故鬼憑物則神見全精者忘是非忘得失在此者非彼抱神者時晦明時强弱在彼者非此一水析之置於金器石器瓦器至於萬器皆可也萬器之水復合爲一水亦可也其水或在器析而爲萬或離器合而爲一其内景之德灼然無殊故我之精散於事物猶水之在眾器收視反聽猶合眾水而爲一靈明絶待窅然長存故所見我獨蓋精無人也火因膏薪而後顯非膏薪則}
