  - {type: variant, offset: 100, length: 529, content: 得以累之故本之以謙天下之物無得以外之故含之以虛天下之物無得以難之故行之以易天下之物無得以窒之故變之以權以此中天下可以制禮以此和天下可以作樂以此公天下可以理財以此周天下可以禦侮以此因天下可以立法以此觀天下可以制器聖人不以一己治天下而以天下治天下天下歸功於聖人聖人任功於天下所以堯舜禹湯之治天下天下皆曰自然抱一子曰天無爲而萬化成聖人無爲而天下治聖人何心哉人徒見夫制禮作樂理財禦侮立法制器周濟曲成而不遺將謂聖人物物思之事事計之而以一已之智力當天下之事物也殊不知聖人本之以謙含之以虚行之以易變之以權因人之賢而賢之因之愚而愚之因是是之因非非之不以古今而先後其心不以内外而輕重其事而以天下治天下也天下歸功於聖人聖人不自以爲功而任功於天下是道也堯舜禹湯得之故皆曰自然關尹子曰天無不覆有生有殺而天無愛惡日無不照有妍有醜而日無厚薄抱一子曰聖人猶天也物有生殺天無愛惡聖人猶日也物有妍醜而日無厚薄是蓋聖人無爲無心之治也關尹子曰聖人之道天命非聖人能自道聖人之德時符非聖人能自德聖人之事人爲非聖人能自事是以聖人不有道不有德不有事抱一子曰聖人無我故道以天命不自有道也德以時符不自有德也事以人爲不自有事也彼執有道有德有事者庸人爾焉能忘我哉關尹子曰聖人知我無我故同之以仁知事無我故權之以義知, CK-KZ: ''}
