  - {type: variant, offset: 906, length: 387, content: 曰仁者見之謂之仁智者見之謂之智然則聖人之道混混淪淪何可得而名狀哉故曰聖人一之不膠天下名之不得關尹子曰勿以行觀聖人道無蹟勿以言觀聖人道無言勿以能觀聖人道無爲勿以貌觀聖人道無形抱一子曰道無形無蹟無言無爲學者何從而求之哉不已則求諸聖人聖人者道之體也然果可求之於聖人乎求之於聖人者不過言貌行能而已愈失之矣捨言貌行能之外何從而觀聖人哉善觀聖人者觀其心而不觀其迹然則聖人之心果可觀乎果不可觀乎界異於吾心乎果不異於吾心乎前章有言曰不借道於聖此之謂也關尹子曰行雖至卓不離高下言雖至工不離是非能雖至神不離巧拙貌雖至殊不離妍醜聖人假此以示天下天下㝠此乃見聖人抱一子曰聖人本無言貌行能不得已而假此以示天下人徒見聖人言之工貌之殊行之卓能之神而謂道在夫四者之間而有是非妍醜高下巧拙之辯愈不足以識聖人矣學者㝠此而於四者之外觀之斯善學矣關尹子曰聖人師蜂立君臣師踟蛛立網罟師拱鼠制禮師戰螘置兵一作制兵衆人師, CK-KZ: ''}
