  - {type: variant, offset: 2939, length: 3, content: 關尹子, CK-KZ: 枯龜無我能見大知磁石無我能見大力鐘鼓無我能見天音舟車無我能見遠行故我一身雖有智有力有行有音未嘗有我枯龜磁石鐘鼓舟車皆物也焉能有爲乎所以見大知大力大音大行者物感之故也人於事物未行之時無思無爲寂然何有一旦物感而動事激而發則智力言行見矣智力言行雖見實事物也於我何有哉故}
  - {type: page-break, offset: 2939, content: '', id: KR5c0117_CK-KZ_06p019a, image: JY134/CK-KZ_JY134_06p019a.png}
  - {type: variant, offset: 2939, length: 3, content: 關尹子, CK-KZ-jye: 枯龜無我能見大知磁石無我能見大力鐘鼓無我能見天音舟車無我能見遠行故我一身雖有智有力有行有音未嘗有我枯龜磁石鐘鼓舟車皆物也焉能有爲乎所以見大知大力大音大行者物感之故也人於事物未行之時無思無爲寂然何有一旦物感而動事激而發則智力言行見矣智力言行雖見實事物也於我何有哉故}
  - {type: variant, offset: 2939, length: 3, content: 關尹子, YP-C: 枯龜無我能見大知磁石無我能見大力鐘鼓無我能見天音舟車無我能見遠行故我一身雖有智有力有行有音未嘗有我枯龜磁石鐘鼓舟車皆物也焉能有爲乎所以見大知大力大音大行者物感之故也人於事物未行之時無思無爲寂然何有一旦物感而動事激而發則智力言行見矣智力言行雖見實事物也於我何有哉故}
  - {type: page-break, offset: 2939, content: '', id: KR5c0117_YP-C_10nueji-01-0067a, image: JY134/10nueji-01-0067a.png}
  - {type: variant, offset: 2943, length: 0, content: '', CK-KZ: 未嘗有我蜮射影能斃我知夫無知者亦我則溥天之下我無不在通天地之間一氣爾豈有無虛實能間之哉世人執六尺之軀以痒疴覺觸者爲我之有且爪與髮我之實有也何割之而不痛影非我之實有也何蜮射之而斃我世人見之於著不見之於微知乎此則知無知者亦我也故曰溥天之下我無不在}
