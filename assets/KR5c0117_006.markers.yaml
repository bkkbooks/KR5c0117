  - {type: variant, offset: 3322, length: 1, content: 六, CK-KZ: 炁卽無一物非吾之形也然則形果一乎非也我思異彼思我痛異彼痛彼之不可爲我猶夢之不可爲覺也然則形果歧乎亦非也異地而同夢千里而一揆孰爲我孰爲人不惟是也習牛則獷習馬則健萬物一我也瘕則魚之瘻則鼠之我一萬物也夫我與萬物則必有分矣而不免與物俱化者何也知我之我而不知無我之我也且所謂無我之我者又非不目而觀不耳而聽不舌而嚐不心而揆之謂也執我爲我猶揚灰而求金執無我爲我亦因噎而廢食也惟聖人能卽我而忘我卽我而忘我故不以見見我并不以不見見我雖謂耳目手臂之我非我而蛇首人身鬼形禽翼之我是我可也雖謂智力行音之我非我而枯}
  - {type: page-break, offset: 3322, content: '', id: KR5c0117_CK-KZ_06p020b, image: JY134/CK-KZ_JY134_06p020b.png}
  - {type: variant, offset: 3322, length: 0, content: '', CK-KZ-jye: 炁卽無一物非吾之形也然則形果一乎非也我思異彼思我痛異彼痛彼之不可爲我猶夢之不可爲覺也然則形果歧乎亦非也異地而同夢千里而一揆孰爲我孰爲人不惟是也習牛則獷習馬則健萬物一我也瘕則魚之瘻則鼠之我一萬物也夫我與萬物則必有分矣而不免與物俱化者何也知我之我而不知無我之我也且所謂無我之我者又非不目而觀不耳而聽不舌而嚐不心而揆之謂也執我爲我猶揚灰而求金執無我爲我亦因噎而廢食也惟聖人能卽我而忘我卽我而忘我故不以見見我并不以不見見我雖謂耳目手臂之我非我而蛇首人身鬼形禽翼之我是我可也雖謂智力行音之我非我而枯龜磁石鐘鼓舟車之我是我可也不我而我故無物非我我而不我故無物是我故曰我與物不異夢與覺不殊箋}
