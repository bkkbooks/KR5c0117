  - {type: variant, offset: 430, length: 275, content: 道傳五千言之後乃述是書以曉天下後世而露五千言之所未述之㫖然是道也不可名言之道也而是書也所述無言之言也則其言豈可以百家窺哉宜乎莊子聞其風而悅之自以其學出於關尹而稱之爲古之博大眞人也列禦寇亦師之以傳其道焉嗚呼至人不常生至言不常聞而關尹之書自昔以來祕傳於世少有知者雖聖明之朝以莊列二書名之爲經而是書不傳不得上達使莊列二子有知豈不有愧於地下乎莊子不云乎不離於宗謂之天人不離於精謂之神人不離於眞謂之至人以天爲宗以德爲本以道爲門兆於變化謂之聖人今觀是書則知關尹子咸備四者之道宜其稱之爲博大眞人矣自清濁兆分以來未有立言垂訓顯道神德至精至微至玄至妙如此書者也葛稚川謂, CK-KZ: 印倏若飄鸞鶴怒若鬬虎兕淸若浴碧慘若夢紅}
  - {type: variant, offset: 430, length: 275, content: 道傳五千言之後乃述是書以曉天下後世而露五千言之所未述之㫖然是道也不可名言之道也而是書也所述無言之言也則其言豈可以百家窺哉宜乎莊子聞其風而悅之自以其學出於關尹而稱之爲古之博大眞人也列禦寇亦師之以傳其道焉嗚呼至人不常生至言不常聞而關尹之書自昔以來祕傳於世少有知者雖聖明之朝以莊列二書名之爲經而是書不傳不得上達使莊列二子有知豈不有愧於地下乎莊子不云乎不離於宗謂之天人不離於精謂之神人不離於眞謂之至人以天爲宗以德爲本以道爲門兆於變化謂之聖人今觀是書則知關尹子咸備四者之道宜其稱之爲博大眞人矣自清濁兆分以來未有立言垂訓顯道神德至精至微至玄至妙如此書者也葛稚川謂, CK-KZ-jye: 印倏若飄鸞鶴怒若鬬虎兕淸若浴碧慘若夢紅}
