  - {type: variant, offset: 0, length: 617, content: 文始眞經言外㫖序賢六愚聞三教鼎立於天地間如三光在天相須爲明不可偏廢也三家經文充府滿藏其間各有精微極至之書吾儒六經皆法言而最精微者易也釋氏大藏累千萬軸最精微者楞伽也道家大藏亦千萬卷最精微者關尹子書也三書之在三教如三光之在三才然三光雖明人無眼目無由見其明三書雖妙世無慧哲無由知其妙故三書雖存㫖昧乆矣傳曰苟非其人道不虛行信哉嗚呼儒更三聖之後易變而爲象數卜筮之書釋傳四燈之後楞伽變而爲象教之文道歷秦漢而來關尹子書付淮南方術家矣況乎道隱小成言隱浮僞至人不常生至言不常行宜乎關尹子書祕而不傳於世矣雖然天地至靈之氣發而爲文載道之言陰有神護終不可泯行之有時爾易自孔子之後數千年至陳希夷始傳心法楞伽自瞿曇涅槃數千年至達麽始傳于中國今關尹子書自老子西征出關亦數千年矣抱一先生始發明此書玄奥然此書句讀且難況通其義耶先生證悟道眞慈愍後學乃探老關骨髓述成言外經㫖或因言而悉㫖或轉語以明經或設喻以彰玄或反辭而顯奥或句下隱義或言外漏機或指意於言前或顯微於意外大率多關尹子言外之㫖故總其多者目之曰言外經㫖是書也眞所謂剖大化之祕藏增日月之光明泄大易未露之機述楞伽祕密之藴即伏羲之本心盡姬文之神思探仲尼之精微究諸佛之命脉窮諸祖之骨髓顯黄帝之機緘露老聃之肺腑也學者得見此書誠爲不世之遇豈可不知其幸耶愚蒙師親授得悟道眞無以報稱師恩敬鋟于梓傳之無窮使天下後世志道君子得遇此書言下打發了悟道眞皆吾師抱一先生無窮之德施也是書在處當過於佛乗之經陰有神天護持豈可輕慢耶學者當蕆拜莊誦如, CK-KZ: ''}
