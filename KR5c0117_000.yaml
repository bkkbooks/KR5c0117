body:
  text: 漢劉向進關尹子書右新書著定關尹子九篇護左都水使者光祿大夫臣劉向言所校中祕書關尹子九篇臣向校讎太常存七篇巨向本九篇臣向輒除錯不可考增缺斷續者九篇成皆殺青可繕寫關尹子名喜號關尹子或曰關令子隱德行人易之常請老子著道德經上下二篇列禦寇莊周皆稱道家書篇皆寓名有章章皆首關尹子曰四字篇篇序異章章義異其㫖同辭與老列莊異其歸同渾質崖戾汪洋大肆然有式則使人泠泠輕輕不使人狂蓋公授曹相國參曹相國薨書葬至孝武皇帝時有方士來以七篇上上以仙處之淮南王安好道聚書有此不出巨向父德因治淮南王事得之巨向幼好焉寂士清人能重愛黃老清淨不可闕巨向昧死上永始二年八月庚子護左都水使者光祿大夫巨劉向所枝關尹子書謹進上文始真經言外㫖序夫道本無名老子曰有物混成先天地生吾不知其名强名曰道既曰無名而不知其名矣則不可以言言也如是則聖人於道惟當不立言不立文字然聖人欲曉天下後世苟不强立其名以述其實則所謂道者將絶學而無傳矣關令尹望雲氣以候老子出關邀而留之師其道而請立言以惠天下後世則聖人慈愍後學之心至矣及乎得老子之道傳五千言之後乃述是書以曉天下後世而露五千言之所未述之㫖然是道也不可名言之道也而是書也所述無言之言也則其言豈可以百家窺哉宜乎莊子聞其風而悅之自以其學出於關尹而稱之為古之博大真人也列禦寇亦師之以傳其道焉嗚呼至人不常生至言不常聞而關尹之書自昔以來祕傳於世少有知者雖聖明之朝以莊列二書名之為經而是書不傳不得上達使莊列二子有知豈不有愧於地下乎莊子不云乎不離於宗謂之天人不離於精謂之神人不離於真謂之至人以天為宗以德為本以道為門兆於變化謂之聖人今觀是書則知關尹子咸備四者之道宜其稱之為博大真人矣自清濁兆分以來未有立言垂訓顯道神德至精至微至玄至妙如此書者也葛稚川謂擒縱大道渾淪至理先儒未嘗言方士不能到惟其尊高也故淺近者不能窺惟其廣大也故孤陋者不能造惟其簡易也故該博者不能測學者望之不及研之不得契之不可咀之無味捫擷無門探索無路甚至指為僞書以為出於漢儒之口噫是書也莊列不能言文程不能道而謂漢儒能述之乎自漢明帝時西域之教始流入中國而其書最精微者楞嚴楞伽金剛法華也其所言之神通妙義變化正魔以至無我無人之說悉先述於是書矣然其言簡其義詳又非重譯之書所可比擬也關尹聖人生周末之世與孔子同時二聖人皆親見老子故其言間有一二與孔子同者如朝聞道夕死可矣之類豈所聞所見亦有同得者乎今觀是書首篇之言似發明五千言之㫖而為道德經作傳也學者當與道德經參觀之庶幾心釋神悟於是書矣若夫因是書感悟之後而復隨世俗一曲之士輕生誣謗不生恭敬侮聖人之言則其人本以心之神靈者悟是書之㫖必復為心之不神不靈者昧其性天而隨失其悟矣是書之靈必至如是讀是書者可不若葛稚川愛之誦之蕆之拜之哉今欲於强名之下强字表德故述言外經㫖有宋寶祐二年歲在甲寅重陽日抱一子陳顯微再拜炷香敬序抱一子曰宇者盡四方上下之稱也故以一宇冠篇首謂無是宇則無安身立命之地道則遍四方上下無不在焉無是道則天地造化或幾乎廢矣故一宇者道也宇既立不可無柱故以二柱次之柱者建天地也天地定位聖人居中聖人者道之體也聖人建中立極故以三極次之三才既立四象位焉故以四符次之符者契神之物也故為精神魂魄五居數之中心居人之中故以五鑑居中以明真心能照也然無形則心無所寓故以六匕次之匕者食也食以養形故形食一體形久則化故以七釜次之釜者變化萬物之器也釜中不可無物故以八籌次之籌者物也物物可為藥藥可以雜治故以九藥終之九者究也盡也物至於為藥功用極矣然藥之功復能活人有復生之理以明萬物皆具是氣是性可以生物不逐形盡也故以藥終焉今將九篇分為三卷以見自一生三自三成九之義至九則復變為一而無窮矣原上中下三卷今離為九卷
