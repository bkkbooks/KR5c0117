front:
  text: 文始經言外㫖卷之四賢九
  hash: sha256:5fd6d68b3888be81f7914770d42bf9cec71145220d61f798f3d3633d81a08a23
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0117_HFL_004-001a, image: hfl/0454/0454-004.png}
body:
  text: 抱一子陳顯微述四符篇符者精神䰟魄也凡十七章關尹子曰水可析可合精無人也火因膏因薪神無我也故耳蔽前後皆可聞無人知崇無人一奇無人冬彫秋物無人黑不可變無人北壽無人皆精舌即齒牙成言無我禮卑無我二偶無我夏因春物無我赤可變無我南夭無我皆神以精無人故米去㲉則精存以神無我故鬼憑物則神見全精者忘是非忘得失在此者非彼抱神者時晦明時强弱在彼者非此抱一子曰此言全精抱神之道也精本無人故當忘其是非忘其得失以全吾之精神本無我故當時其晦明時其强弱以抱吾之神精一也水可分可合一也耳屬腎雖蔽之前後皆可聞一也水爲智智崇崇則自尊一也冬物歸根一也黑不可變一也北方主壽有我一也米去㲉則精存一也一數奇獨也故皆曰無人也神二也火因膏因薪二也舌屬心即唇齒而能言二也火爲禮禮卑則尊人二也夏物榮華二也赤色可變二也南主夭無我二也鬼憑物則神見二也二數耦兩也故皆曰無我也無人則在此者非彼無我則在彼者非此知乎此則知所以忘其是非得失與夫時其晦明强弱之理矣關尹子曰精神水火也五行互生滅之其來無首其往無尾則吾之精一滴無存亡耳吾之神一欻無起滅耳惟無我無人無首無尾所以與天地㝠抱一子曰精神水火也自水生木木生火火生土土生金金復生水則互生也自火尅金金尅木木尅土土尅水水復尅火則互滅也其來無首其往無尾滅已復生生已復滅則知精未嘗有一滴存亡神未嘗有一欻起滅惟無我無人無首無尾與天地㝠契則精神長存矣關尹子曰精者水魄者金神者火魂者木精主水魄主金金生水故精者魄藏之神主火魂主木木生火故神者魂藏之惟火之爲物能鎔金而消之能燔木而燒之所以㝠魂魄惟精在天爲寒在地爲水在人爲精神在天爲熱在地爲火在人爲神魄在天爲燥在地爲金在人爲魄魂在天爲風在地爲木在人爲魂惟以我之精合天地萬物之精譬如萬水可合爲一水以我之神合天地萬物之神譬如萬火可合爲一火以我之魄合天地萬物之魄譬如金之爲物可合異金而鎔之爲一金以我之魂合天地萬物之魂譬如木之爲物可接異木而生之爲一木則天地萬物皆吾精吾神吾魄吾魂何者死何者生抱一子曰精水一合魄金四爲五神火二合魂木三爲五精藏魄而神藏魂是則四物雖居兩處可以一五擒之然魂木爲龍魄金爲虎使魂藏於神魄藏於精則二物分於二所終不能相制惟火能鎔金燔木故神可以制魂魄殊不知神寓於魂如火附於木而火二木三之五運於西北制精鍊魄使四象五行俱歸於土實資神火之功也故丹法始終全資火候者火之功用大矣哉至於合天地萬物之水火金木皆爲吾之精神魂魄譬如萬水可合爲一水萬火可合爲一火異金可鎔爲一金異木可接爲一木此則山河大地皆吾法身之妙用也安有所謂生安有所謂死哉關尹子曰五行之運因精有魂因魂有神因神有意因意有魄因魄有精五者回環不已所以我之僞心流轉造化幾億萬歲未有窮極然核芽相生不知其幾萬株天地雖大不能芽空中之核雌卵相生不知其幾萬禽陰陽雖妙不能卵無雄之雌惟其來干我者皆攝之以一息則變物爲我無物非我所謂五行者孰能變之抱一子曰精神魂魄意五者回環相生不已則人之偽心輪迴四生六道經幾億萬年未有窮極何則有此偽心則有此偽意有意則有魄有魄則有精有精則有魂有䰟則有神有神則又有意矣彼空中之核與無雄之雌胡爲而不芽不卵耶蓋精不存也物則自清而入濁故始因精而終成魄神則自微而入妙故始因意而終成神蓋意土數五而五與人俱生故首與四肢及手足之指皆五也使終能至神而不復生意則遇物對境當以一息攝之則變物爲我矣無物非我則五行皆爲吾用而不復有相生相滅之機孰能變之哉此永不輪迴不受生之妙用也學者欲知之乎關尹子曰衆人以魄攝魂者金有餘則木不足也聖人以魂運魄者木有餘則金不足也蓋魄之藏魂俱之魂之游魄因之魂晝寓目魄夜舍肝寓目能見舍肝能夢見者魂無分别析之者分别析之曰天地者魂狃習也夢者魄無分别析之者分别析之曰彼我者魄狃習也土生金故意生魄神之所動不名神名意意之所動不名意名魄惟聖人知我無我知物無物皆因思慮計之而有是以萬物之來我皆對之以性而不對之以心性者心未萌也無心則無意矣盖無火則無土無意則無魄矣盖無土則無金一者不存五者皆廢既能渾天地萬物以爲魂斯能渾天地萬物以爲魄凡造化所妙皆吾魂凡造化所有皆吾魄則無有一物可役我者抱一子曰愚解前章謂物之自精至魄從清入濁而魄盛則死矣故曰金有餘則木不足若夫聖人自意生身至於成神則木有餘而金不足魂有餘者多覺魄有餘者多夢覺之與夢皆能分别者非魂魄能自析之也皆有眞性存乎其中而狃習既乆而能生此分别識也惟聖人知我無我知物無物皆因心意計之故對境忘識無意而對之以性性者心未萌也無心則無意矣一意不存五行皆廢斯能渾天地造化之所妙者皆爲吾魂渾天地造化之所有者皆爲吾魄是則萬物皆爲吾役而不役於物矣關尹子曰鬼云爲魂鬼白爲魄於文則然鬼者人死所變云者風風者木白者氣氣者金風散故輕清輕清者上天金堅故重濁重濁者入地輕清者魄從魂昇重濁者魂從魄降有以仁昇者爲木星佐有以義昇者爲金星佐有以禮昇者爲火星佐有以智昇者爲水星佐有以信昇者爲土星佐有以不仁沉者木賊之不義沉者金賊之不禮沉者火賊之不智沉者水賊之不信沉者土賊之魂魄半之則在人間升魂爲貴降魄爲賤靈魂爲賢厲魄爲愚輕魂爲明重魄爲暗揚魂爲羽鈍魄爲毛明魂爲神幽魄爲鬼其形其居其識其好一本作名皆以五行契之惟五行之數參差不一所以萬物之多盈天地間猶未已也以五事歸五行以五行作五蟲可勝言哉譬猶兆龜數蓍至誠自契五行應之誠苟不至兆之數之無一應者聖人假物以游世五行不得不對抱一子曰云白今之楷字也楷字出於秦之程邈變篆爲隸而後有也在當時字體與今不同字古之云字𦣺字古之白字是則鬼爲䰟𦣺鬼爲魄於古文則然則從虚輕清故爲風古風字𦣺則從身重濁故爲氣𤽍古氣字然則古人製字亦或有道焉風屬木氣屬金木主升金主降以五常而升者爲五星之佐反五常而沉者爲五行所賊楞嚴所述升沉之報與此同義魂魄相半則在人間然常人止有三魂七魄故魂多者爲貴爲賢爲明爲羽爲神魄多者爲賤爲愚爲暗爲毛爲鬼而其識其好皆契五行惟五行參差不一故胎卵濕化有色無色有想無想等類衆生盈天地間生生不已也然聖人本無我不假於物則不能游世如火不附木則無所託形然物之在世豈能堅乆哉聖人必以五行對之然後生生不窮如水火相尅却成既濟金木相尅却成夫婦皆對法也是道也如兆龜數蓍至誠自契誠若不至則五行無一應者矣關尹子曰三者具有魂魂者識曰者精色者神見之者爲魂耳口鼻心之類在此生者愛爲精爲彼生父本觀爲神爲彼生母本愛觀雖異識生彼生生本在彼生者一爲父故受氣於父氣爲水二爲母故受血於母血爲火有父有母彼生生矣惟其愛之無識如鎖之交觀之無識如燈之照吾識不萌吾生何有抱一子曰目耳鼻口心謂之五根聲色香味事謂之五塵觀聽嗅嘗思謂之五識五根主於精精有我無人之物也五塵主於神神無我即物而見也五識主於魂故曰魂識盖根塵識三者具而後有魂也父以精愛母以神觀愛爲水觀爲火水爲氣火爲血父精母血交而識存乎中此降本流末生生不窮之理也若夫愛無識而如鎻之交觀無識而如燈之照則吾識未嘗萌吾生何嘗有哉關尹子曰如桴叩鼓鼓之形者我之有也鼓之聲者我之感也桴已往矣餘聲尚在終亦不存而已矣鼓之形如我之精鼓之聲如我之神其餘聲者猶之魂魄知夫倏往倏來則五行之氣我何有哉抱一子曰精如鼓神如聲餘聲如魂魄固矣然則鼓不叩則不生聲精不感則不生神叩鼓以桴桴亡則雖有餘聲終亦不存矣感精以氣氣亡則雖有魂魄終亦不存矣是則五行之氣倏往倏來我本無有而我之所有者叩桴感氣者而已矣或問曰今欲聲聲不絶鼓鼓長存畢竟以何道感之曰請放下手中桴方向汝說關尹子曰夫果之有核必待水火土三者具矣然後相生不窮三者不具如大旱大潦大塊皆不足以生物精水神火意土三者本不交惟人以根合之故能於其中橫見有事猶如術呪能於至無見多有事抱一子曰世之術呪能於無中見多有事如張諧作五里之霧左慈擲梁上之盃是道也無出於精神意三者合而爲之如果之有核必待水火土三者俱而後生三者不交則如大旱大潦大塊不能生物然三者本不能自交惟人以根合之如男女二根交精而生形也然天有天根地有地根人有人根而造化有造化之根人能於造化之根上以起天地之根則能無中生有而知變化之道矣關尹子曰魂者木也木根干冬水而華於夏火故人之魂藏於夜精而見於晝神合乎精故所見我獨盖精未嘗有人合乎神故所見人同盖神未嘗有我抱一子曰此章獨言木喻者發明上章言根之㫖也盖木爲魂爲人也人之所以爲人以魂識晝夜隱見於精神之中而已矣精一也故魂識合精則所見惟我獨神二也故魂識合神則所見與人同如木之根於冬而榮於夏即魂之藏於夜而見於晝也知夫木之根則知魂之根矣知夫魂之根則知天地造化之根矣關尹子曰知夫此身如夢中身隨情所見者可以飛神作我而游太清知夫此物如夢中物隨情所見者可以凝精作物而駕八荒是道也能見精神而乆生能忘精神而超生吸氣以養精如金生水吸風以養神如木生火所以假外以延精神漱水以養精精之所以不窮摩火以養神神之所以不窮所以假内以延精神若夫忘精神而超生者吾嘗言之矣抱一子曰人假精神以有生善養精神者能見精神而乆生陰符經謂天有五賊見之者昌是也能忘精神而超生陰符經謂人知其神而神不知不神之所以神是也世有夢飛神而游太清者亦有夢乗物而駕八荒者此身此物皆如夢如幻夢而能之者靈於神也覺而不能者拘於形也惟能自見精神者覺夢一致可以飛神作我可以凝精作物是皆法之妙用也至於吸氣吸風以益金木於外漱水摩火以養精神於内亦皆足以延精神斯術之租者也若夫忘精神而超生者道也是道也隱然述于此書又在夫人自得之而已矣關尹子曰人勤於禮者神不外馳可以集神人勤于智者精不外移可以攝精仁則陽而明可以輕魂義則陰而㝠可以御魄抱一子曰聖人因人之常心之所固有者立爲五常皆自然而然非有牽强故曰常也人能循此常而行之至可以集神攝精輕魂御魄盖人之五神主此五常猶天之五星主此五事也火星主禮禮主昇火亦昇神屬火人勤於禮者神不外馳可以集神其餘如木星主仁金星主義水星主智而木輕金㝠水降所以能輕魂御魄攝精莫不皆然只言四者四物具則土在其中四常具則信在其中四神具則意在其中四方立則中在其中孟子亦只言四端而不及信與此意同關尹子曰蜣蜋轉丸丸成精思之而有蝡白者存丸中俄去㲉而蟬彼蜣不思彼蝡奚白抱一子曰此章言感化之機能動無情之物也圓本無情而蜣蜋轉而精思之則蝡生圓中俄去㲉而化爲蟬外鑪金丹生於金鼎神室之中神室本虚器全藉守鑪之人神識不昧晝夜精觀而神丹生於虚器之中外丹既熟而内丹亦就化形而仙矣參同契曰萬象憑虚生感化各有類感化者亦蜣精思之意耶關尹子曰庖人羹蠏遺一足几上蠏已羹而遺足尚動是生死者一氣聚散耳不生不死而人横計曰生死抱一子曰人以動物爲有生今釜中之蠏已羹而几上之遺足尚動是則生者一氣之聚死者一氣之散耳彼非氣者何嘗有聚散生死哉人橫計之耳關尹子曰有死立者有死坐者有死卧者有死病者有死藥者等死無甲乙之殊若知道之士不見生故不見死抱一子曰世人不知我本無生而見坐脱立亡者以爲了達見卧死病死者以爲未了達殊不知均一死耳初無甲乙之殊惟知道者未嘗有生故不見其生未嘗有死故不見其死關尹子曰人之厭生死超生死者皆是大患也譬如化人若有厭生死心超生死心止名爲妖不名爲道抱一子曰老子謂專氣致柔能嬰兒今問嬰兒曰汝生乎則不知也汝死乎則不知也然則人之有厭生死心非大患乎有超生死心非妖乎關尹子曰計生死者或曰死已有或曰死已無或曰死已亦有亦無或曰死已不有不無或曰當幸者或曰當懼者或曰當任者或曰當超者愈變情識馳騖不已殊不知我之生死如馬之手如牛之翼本無有復無無譬如火水雖犯火水不能燒之不能溺之抱一子曰以馬之無手牛之無翼以況我之未嘗有生死也以水犯水以火犯火以況我之入生死也然則既曰如馬手牛翼之未嘗有矣又何入哉曰以未嘗有生而入死以未嘗有死而入生是則入亦無入犯亦無犯若夫以謂或有或無或幸或懼或任或超愈變情識而馳鶩愈遠矣安足以知此哉文始眞經言外㫖卷之四
