front:
  text: 文始真經言外㫖卷之五賢十
  hash: sha256:42b7095ac62c88be6761bf41df3bc941b5132d2b3f817e160396122139c8cb25
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0117_HFL_005-001a, image: hfl/0454/0454-034.png}
body:
  text: 抱一子陳顯微述五鑑篇鑑者心也凡二十章關尹子曰心弊一作蔽下同吉凶者靈鬼攝之心弊男女者淫鬼攝之心弊幽憂者沉鬼攝之心弊逐放者狂鬼攝之心弊盟詛者奇鬼攝之心弊藥餌者物鬼攝之如是之鬼或以陰為身或以幽為身或以風為身或以氣為身或以土偶為身或以彩畫為身或以老畜為身或以敗器為身彼以其精此以其精兩精相搏則神應之為鬼所攝者或解奇事或解異事或解瑞事其人傲然不曰鬼于躬惟曰道于躬久之或死木或死金或死繩或死井惟聖人能神神而不神于神役萬神而執其機可以會之可以散之可以禦之日應萬物其心寂然抱一子曰聖人能神神而不神于神衆人神于神而不能神神能神神則日應萬物其心寂然神于神則心蔽事物而為鬼所攝鬼亦神之純陰者也故亦無我而附物身既認物為我身則精存于物物我相搏則神應之故為鬼所攝者或能瑞異或知吉凶其人傲然自謂得道不悟魔攝久致喪身五行賊之隨類死物如釋教楞嚴所述二十五魔一同是說也在周末之時釋教未入中國已先述于是書矣較之釋經理詳而辭簡然則關尹子書豈一曲之士所能測識耶關尹子曰無一心五識並馳心不可一無虛心五行皆具心不可虛無靜心萬化密移心不可靜借能一則二偶之借能虛則實滿之借能靜則動搖之惟聖人能斂萬有於一息無有一物可役吾之明徹散一息於萬有無有一物可間吾之云為抱一子曰聖人之心能斂能散斂則會萬有於一息散則敷一息於萬有初不待一之虛之靜之也苟用功於一則不一矣用功於虛則不虛矣用功於靜則不靜矣惟其不用功於一不用功於虛不用功於靜則此心未嘗二未嘗實未嘗動也雖曰斂散何嘗斂散哉如是則日應萬變吾心寂然無一物可役吾之明徹無一物可間吾之云為聖人以五鑑明心信乎其為鑑矣關尹子曰火千年俄可滅識千年俄可去抱一子曰火本無我自清濁兆分而來天下未嘗有自生之火也必假人力鑽燧擊石而後生列子曰人生火是也夫火本無體故雖燎爇千年而俄頃可滅惟識亦然自胞胎賦形而來此心未嘗先具此識也蓋因根塵取受伊習而後生關尹子曰物交心生識是也夫識本無方雖計認千年而俄頃可去然則滅火易不然難去識易不續難傳曰得道易守道難信哉關尹子曰流者舟也所以流之者是水非舟運者車也所以運之者是牛非車思者心也所以思之者是意非心不知所以然而然惟不知所以然而然故其來無從其往無在其來無從其往無在故能與天地本原不古不今抱一子曰心火也意土也思亦土也故所以思者是意非心也猶舟流因水車運因牛而心思因意也昔人謂車不行打車即是打牛即是今夫心役於思去心即是去意即是三教聖人皆主張無意而不主張無心者㫖必有在也學者當思念之時推求意之所生則不知其所以然而然故其來無從其往無在如是則意未嘗有意意未嘗有意則思未嘗有思念未嘗有念而無思之思無念之念與天地之本原不古不今而長存矣視夫斷思絶念心如土木者異矣關尹子曰知心無物則知物無物知物無物則知道無物知道無物故不尊卓絶之行不驚微妙之言抱一子曰昔人有言曰若云他是聖自己却成狂苟遇卓絶之行而尊之聞微妙之言而駭之則徇蹟而不見道矣蓋道無古今無聖狂無言行前無先達後無作者知乎此則何者為物何者為心哉關尹子曰物我交心生兩木摩火生不可謂之在我不可謂之在彼不可謂之非我不可謂之非彼執而彼我之則愚抱一子曰心火也二也故物我交而後心生兩木摩而後火生彼有執以為心在我或在彼又以執以為火在此或在彼者不然則或以為非我非彼者皆愚人也鳥足以識心哉關尹子曰無恃爾所謂利害是非爾所謂利害是非者果得利害是非之乎聖人方且不識不知而況於爾抱一子曰利害心愈明則親不睦是非心愈明則事不成聖人方且不識不知而況爾所謂利害是非者果得而利害是非之乎關尹子曰夜之所夢或長于夜心無時生於齊者心之所見皆齊國也既而之宋之楚之晋之梁心之所存各異心無方抱一子曰邯鄲之夢終身榮辱不知歷幾寒暑矣既覺則黃粱未熟特片時爾心豈有定時耶楚人之子生長楚國引而置之莊嶽之間數年雖日撻而求其楚不可得矣心豈有定方耶世有執時執方以求心者安足以識心哉關尹子曰善弓者師弓不師𦐒善舟者師舟不師善心者師心不師聖抱一子曰輪扁斷輪之妙父不可傳於子得之心應之手豈可以師傳哉然則逢蒙學射於𦐒盡𦐒之道果盡乎曰使盡𦐒之道則不思天下惟𦐒為愈巳也然學聖人者自以為盡聖人之道者如鼠飲河足猒其量爾今善弓者師弓善舟者師舟以喻善心者師心可謂善喻矣弓則有矢的步力之可師舟則有帆柂風水之可法至於心明則覺昏則而巳孰從而師之哉雖然學者於動靜語默之間向明覺昏昧處通得一線則心之法有餘師矣關尹子曰是非好醜成敗盈虛造物者運矣皆因私識執之而有於是以無遣之猶存以非有非無遣之猶存無曰莫莫爾無曰渾渾爾猶存譬猶昔游再到記憶宛然此不可忘不可遣善去識者變識為智變識為智之說爾知之乎曰想如思鬼心栗思盜心怖曰識如認黍為稷認玉為石皆浮游罔象無所底止譬睹奇物生奇物想生奇物識此想此識根不在我譬如今日今日而已至於來日想試殊未可卜及至來日紛紛相識皆緣有生曰想曰識譬犀望月月形入角特因識生始有月形而彼真月初不在角胸中之天地萬物亦然知此說者外不見物內不見情抱一子曰天地萬物古今萬事在人胸中如月形生於犀牛之角彼犀不望月而想則角無由而生月矣月形既存于角中則盡犀之形不可去也以喻人之胸中萬物萬事忘不得遣不得如昔日曾游之景再游則憶記宛然皆識使然也且如今日見某物某事至於來日所見殊未可卜及乎來日紛紛想識皆緣有生若夫來日未至事物未有之時此想此識根安在哉然則今日想識皆妄想妄識明矣譬如無鬼思鬼無盜思盜本妄想也而能生栗生怖之妄情認黍為稷認玉為石本妄認也而能生真稷真石之妄識然則睹奇物見異事何異夫妄情妄識耶執而有之即於心府可謂不智矣知乎此則知變識為智之說矣變識為智則外不見物內不見情關尹子曰物生于土終變於土事生於意終變於意知夫惟意則俄是之俄非之俄善之俄惡之意有變心無變意有覺心無覺惟一我心則意者塵往來爾事者欻起滅爾吾心存大常者存抱一子曰識生於意意生於心善去識者去其識之所生之母而已矣譬如物生于土則終變於土識生於意終變於意事之是非善惡雖以識分辨之而莫不皆隨意變也意在是非則識隨而在是非意在善惡則識隨而在善惡是則子隨母轉也然意雖有變心未嘗變意雖有覺心未嘗覺知心無變無覺則意如塵之往來事如欻之起滅皆不足以動吾心君而我心惟一蓋有大常者存焉耳關尹子曰情生於心心生於性情波也心流也性水也來干我者如石火頃以性受之則心不生物浮浮然抱一子曰後世言性者皆曰性生於心以心為母性為子謂如五常之性根於一心皆未達夫真性之所以為性三教聖人發明性真如出一口而賢人膠之此其所以未入聖域歟孔子言窮理而後盡性理者心也與孟子言盡其心者知其性知其性則知天意同釋氏言明心然後見性故直指人心見性成佛與今言心生於性皆以性為母心為子也而尚恐學者未明又以水喻之曰性水也心流也情波也則本末次第歷然易辨矣苟事物來干我而以心應之不亦勞乎天下之事物無窮吾心之精神有限以有限對無窮吾心殆矣惟聖人以性受之則心不生而事物浮浮然不能入吾之靈府矣關尹子曰賢愚真僞有識者有不識者彼雖有賢愚彼雖有真僞而謂之賢愚真僞者繫我之識知夫皆識所成故雖真者亦僞之抱一子曰人之賢者可慕可重愚者不必慕不必重事物之真者易留意而難忘事物之僞者不甚著意而易忘而謂彼賢愚真僞者皆我之區識苟知性識則雖賢者亦愚之雖真者亦僞之則變識為智而易忘矣關尹子曰心感物不生心生情物交心不生物生識物尚非真何況於識識尚非真何況於情而彼妄人於至無中執以為有於至變中執以為常一情認之積為萬情萬情認之積為萬物物來無窮我心有際故我之良心受制於情我之本情受制於物可使之去可使之來而彼去來初不在我造化役之固無休息殊不知天地雖大能役有形而不能役無形陰陽雖妙能役有氣而不能役無氣心之所之則氣從之氣之所之則形應之猶如太虛於一氣中變成萬物而彼一氣不名太虛我之一心能變為氣為形而我之心無氣無形知夫我之一心無氣無形則天地陰陽不能役之抱一子曰天地雖大陰陽雖妙能役有形氣者不能役無形氣者而我之一心無形無氣天地陰陽尚不能役反受制於情受役於物何耶於至無中執以為有於至變中執以為常因識生情因情著物物來無窮造化無定使去使來不得自在或者謂我之一心能變為氣為形既為氣矣既為形矣役於五行拘於陰陽盛衰往來初不在我造化役之安能自由哉噫如繪塑師幻像鬼神自生怖畏殊不知我之一心本同太虛太虛於一氣中變成萬物而彼一氣不名大虛昧者直以一氣名為太虛焉能逃天地陰陽之役哉關尹子曰人之平日目忽見非常之物者皆精有所結而使之然人之病日目忽見非常之物者皆心有所歉而使之然苟之吾心能於無中示有則知吾心能於有中示無但不信之自然不神或曰厥識既昏孰能不信我應之曰如捕蛇師心不怖蛇彼雖夢蛇而無畏怖故黃帝曰道無鬼神獨往獨來抱一子曰瞪目發勞勞久精結故忽見非常之物與彼病目見空中花及第二月無以異也又有心有所慊忽見冤尤之形皆無中示有也既見矣孰能不信如捕蛇之師雖夢蛇不畏者習慣如自然也昔有人居山習定而山精現怪異之形變化百種魔撓其人其人閉目不視曰汝之技倆有盡我之不聞不見無窮山精退不復見此即有中示無惟不信之自然不神也若夫即吾心中可作萬物而見嬰兒姹女青龍白虎等物者皆自我作之有無在我與忽見非常之物者異矣然聖人睹此猶且見如不見何哉黃帝不云乎道無鬼神獨往獨來是也關尹子曰我之思慮日變有使之者非我也命也苟知惟命外不見我內不見心抱一子曰人之思慮日日不同莫之致而致也孰使之哉命也既曰命矣則由我乎不由我乎使我命在天則思慮不由我若我命在我則何思何慮故外不見我內不見心關尹子曰譬如兩目能見天地萬物暫時回光一時不見抱一子曰此章當連前章為一章謂人有思慮譬如兩目能見天地萬物若能回光返照則天地萬物一時不見是則何庸思慮哉但世人知此機者鮮矣關尹子曰目視雕琢者明愈傷耳聞交響者聰愈傷心思玄妙者心愈傷抱一子曰此章亦與上章意連謂目不能返照而視雕琢者明愈傷耳不能返聽而聞交響者聰愈傷心不能無念而思玄妙者心愈傷三章相續其義始圓關尹子曰勿以我心揆彼當以彼心揆彼知此說者可以周事可以行德可以貫道可以交人一作立人可以忘我抱一子曰若以我心揆彼則人之識見各各不同人我既分町畦斯判安能周事哉事且不周況交人乎況行德貫道乎惟以彼心揆彼此聖人無我之學也如是則何事不周何人不交何德不行何道不貫哉關尹子曰天下之理小不制而至於大大不制而至於不可制故能制一情者可以成德能忘一情者可以契道抱一子曰學者但知防患於微而不知制情於微能制一情則可以成德能忘一情則可以契道是則德不難成而道不難契也特情之難制耳一情雖微苟不制而必至於大大不制而至於不可制其為害豈勝言哉天下之理莫不皆然文始真經言外㫖卷之五
