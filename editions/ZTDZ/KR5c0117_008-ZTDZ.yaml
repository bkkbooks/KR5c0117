front:
  text: 文始經言外㫖卷之八賢十三
  hash: sha256:5f8f6c8eead6df4d45f4fa1836049c8cd2775d321c9916b1c7dac6964a6eaa4e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0117_SJB_008-140725b, image: sjb/14/140725b.png}
body:
  text: 抱一子陳顯微述八籌篇籌者物也凡六章關尹子曰古之善揲蓍灼龜者能於今中示古古中示今高中示下下中示高小中示大大中示小一中示多多中示一人中示物物中示人我中示彼彼中示我是道也其來無今其往無古其高無蓋其低無載其大無外其小無内其外無物其内無人其近無我其遠無彼不可析不可合不可喻不可思惟其混淪所以爲道抱一子曰易曰探賾索隱鉤深致遠成天下之亹亹者莫大乎蓍龜如是則蓍之與龜可以喻道矣是物也本枯莖朽骨耳靈從何來聖從何起今焉能於今中卜古古中卜今是則其來無今其往無古而彰往察來也能於高中示下下中示高是則其高無蓋其低無載而上下無常也能小中示大大中示小是則其大無外其小無内而齊小大也能一中示多多中示一是則錯綜其數而一致百慮也能人中示物物中示人是則其外無物其内無人而無有遠近幽深遂知來物也能我中示彼彼中示我是則其近無我其遠無彼而以言乎遠則不禦以言乎邇則靜而正也然則枯莖朽骨何其神哉是神也存乎枯莖朽骨之中而不可析不可合不可喻不可思知妙道之存乎人之血肉形體之中而不可析合不可喻思也易不云乎蓍之德圓而神惟其混淪所以爲道關尹子曰水潜故藴爲五精火飛故達爲五臭木茂故華爲五色金堅故實爲五聲土和故滋爲五味其常五其變不可計其物五其雜不可計然則萬物在天地間不可執謂之萬不可執謂之五不可執謂之一不可執謂之非萬不可執謂之非五不可執謂之非一或合之或離之以此必形以此必數以此必氣徒自勞耳物不知我我不知物抱一子曰五行之在天地間其常五其變不可勝計其物五其雜不可勝計總其綱領則水藴爲五精火達爲五臭木華爲五色金實爲五聲土滋爲五味然萬物在天地間不可勝計皆自五行錯雜而生或合之或離之不可執謂之五不可執謂之萬不可執謂之一又不可執謂之非五非萬非一若分别某物必某數必某氣徒自勞耳故曰物不知我我不知物關尹子曰即吾心中可作萬物蓋心有所之則愛從之愛從之則精從之蓋心有所結先凝爲水心慕物涎出心悲物淚出心愧物汗出無暫而不乆無乆而不變水生木木生火火生土土生金金生水相攻相尅不可勝數嬰兒蘂女寳樓絳宫青蚊白虎寳鼎洪鑪皆此物有非此物存者抱一子曰陰符經曰天有五賊見之者昌五賊在心施行於天宇宙在乎手萬化生乎身然則五行之妙用靈哉神哉人患不知其機耳知其機而制之則五賊皆爲吾用而嬰兒蘂女寳樓絳宫青蛟白虎寳鼎洪鑪皆見其形而不能隱故曰見之者昌見之者見吾身之精神魂魄凝於神水結而成象現於黃庭之中也是物也猶在腎感愛而爲精在目感悲而爲淚在鼻感風爲涕在身愧物爲汗一同是皆出於心有所之而神水隨應也如幼年所見景物至壯至老猶能夢見終身不忘者印入於心凝結神水無暫而不乆無乆而不變也但心有所之與心無所之不同耳若夫擒制五賊鍛鍊五行惟一心不動神水自凝然後五賊見形千變萬化矣是道也雖皆此五行之物所化而成然自有非此五行之物者存乎其中而爲之主宰耳關尹子曰鳥獸俄呦呦俄旬旬俄逃逃草木俄茁茁俄亭亭俄蕭蕭天地不能留聖人不能繫有運者存焉耳有之在彼無之在此鼓不桴則不鳴偶之在彼奇之在此桴不手則不繫抱一子曰聖人觀化所以無化化之運於形氣之間也天地不能留聖哲不能繫夫鳥獸呦呦而鳴旬旬而來逃逃而去與夫草木茁茁而芽亭亭而茂簫簫而枯皆俄然爾化可謂速矣然聖人所以無化者如鼓不桴則不鳴有在彼無在我也桴不手則不擊偶在彼奇在我也前篇曰手不觸刃刃不傷人與此同㫖關尹子曰均一物也衆人惑其名見物不見道賢人析其理見道不見物聖人合其天不見道不見物一道皆道不執之即道執之即物抱一子曰萬物盈天地間各具一名各具一理見其名而不見其道者爲物所格衆人也析其理而不見其物者能格於物賢人也聖人則不然不見所謂道不見所謂物合其天而已矣若夫指一物謂之道則物物皆道也惟不執之謂之道則即道也若執之以爲道即物矣關尹子曰知物之僞者不必去物譬如見土牛木馬雖情存牛馬之名而心忘牛馬之實抱一子曰物之眞偽生於識聖人遇物眞者亦偽之去識也眞者且偽之則舉天下之物皆偽矣知天下之物皆偽則何必去物哉如見土木偶形雖有某物之名而心忘某物之實學道之士當對景之時能如是乎文始經言外㫖卷之八
