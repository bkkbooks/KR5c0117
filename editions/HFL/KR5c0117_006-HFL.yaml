front:
  text: 文始眞經言外㫖卷之六賢十一
  hash: sha256:9f7fd9bf8b7e2e1970696e591c18d54ad3aa3238b3a37b1c07019a6f3d5338b3
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0117_HFL_006-001a, image: hfl/0454/0454-062.png}
body:
  text: 抱一子陳顯微述六匕篇匕者食也食者形也凡十六章關尹子曰世之人以我思異彼思彼思異我思分人我者殊不知夢中人亦我思異彼思彼思異我思孰爲我孰爲人世之人以我痛異彼痛彼痛異我痛分人我者殊不知夢中人亦我痛異彼痛彼痛異我痛孰爲我孰爲人爪髪不痛手足不思亦我也豈可以思痛異之世之人以獨見者爲夢同見者爲覺殊不知精之所結亦有一人獨見於晝者神之所合亦有兩人同夢於夜者二者皆我精神孰爲夢孰爲覺世之人以暫見爲夢乆見爲覺殊不知暫之所見者陰陽之氣乆之所見者亦陰陽之氣二者皆我陰陽孰爲夢孰爲覺抱一子曰昔人有不識我而求我者以色求之不得又以聲求之不得又於臭味覺意求之俱不得然後知我之爲我視之不見聽之不聞搏之不得而橫執以爲我者皆妄也安識所謂眞我哉今夫世之人以能思能痛者爲我以不能思不能痛者爲非我兩失之矣能思能痛者果我乎我本無意無念思從何來是則妄有縁塵於中積聚狃習爲思非我眞有是思也我本無相無體痛從何起是則妄有血氣於中假合觸覺爲痛非我眞有是痛也然則不能思不能痛者果非我乎爪髪不痛手足不思亦我也夢中之天地萬物不思夢中之人神鳥獸不痛亦我也豈可以人我異之世之人以獨見暫見者爲夢以同見乆見者爲覺亦兩失之矣獨見暫見者果夢乎我本無夢蓋因陰因夜因寐與識相縁而有是夢也我本無覺蓋因陽因晝因寤與見相縁而有是覺也然則同見乆見者果非夢乎神之所合亦有兩人同夢於夜者陰陽結習亦有天地萬物乆見於夢者豈可以覺夢異之人與我不異覺與夢不殊然後知遍虚空世界天地人物無一物非我之眞無一物是我之已而已矣關尹子曰好仁者多夢松栢桃李好義者多夢兵刀金鐵好禮者多夢簠簋籩豆好智者多夢江湖川澤好信者多夢山嶽原野役於五行未有不然者然夢中或聞某事或思某事夢亦隨變五行不可拘聖人御物以心攝心以性則心同造化五行亦不可拘抱一子曰世人不能逃陰陽五行者以心有所思而役於事物也傳曰寇莫大於陰陽無所逃於天地之間又曰五賊在心施行於天是則五賊生於陰陽而人之所思不著事既著物事物不出於五行所以爲五賊所役而不能逃也是賊也在陽則爲見在陰則爲夢在覺爲事在夢爲物如好仁者多夢松栢之類皆役於五行雖役於五行而夢中忽聞别事忽思他事識見變遷則夢亦隨變五行亦不能拘知夢中之五行不能拘則若事若物皆可以御而役之而不役於事物也不役於事物則陰陽五行鳥能爲寇爲賊哉聖人御事物不以思而以心攝心不以念而以性此其所以心同造化而五行不可拘歟關尹子曰汝見蛇首人身者牛臂魚鱗者鬼形禽翼者汝勿怪此怪不及夢夢怪不及覺有耳有目有手有臂怪尤矣大言不能言大智不能思抱一子曰天不言而曰月運四時行天雖不言而日月運四時行乃大言矣聖人不思而得聖人雖不思而能得乃大智矣今有人見夫未嘗見者如蛇首人身之類必以爲怪矣不思夫形寢神息之時忽有所夢天地人物從何而生從何而見世人習慣不以爲怪細推詳研吾之精神本自清明寧一而化爲是夢豈不甚可怪哉知夢爲怪矣今觀我之形有耳有目有手有臂視聽動止比之夢中所見一一有實豈不尤可怪耶況口之能言心之能思其爲怪有不可勝言者矣或曰吾道與之貌天與之形雖具耳目手足反爲思之不見其爲有也如是則怪可去乎愚答曰道甚麽或者再舉前問愚曰大言不能言大智不能思或者呿然而退關尹子曰有人問於我曰爾族何氏何名何字何衣何食何友何僕何琴何書何古何今我時默然不對一字或人叩之不已我不得已應之曰尚自不見我將何爲我所抱一子曰人有眞我雖聖智未易自見也人惟不能自見故或以色求我或以聲音求我轉不可得而見矣況問我以族氏名字衣食友僕琴書古今哉宜乎聖人默然不對是不對也乃所以深對也或者不喻聖人之意而叩之不已夫叩之不已者疑乎信乎以爲信耶彼之我即我之彼也彼之彼即我之我也彼彼不能相我則我我不能喻彼矣以爲疑耶則我以不我對而不對以我對我以對非對則以不對對又何疑焉而叩之不已耶聖人於是自其妄見而喻之謂彼以見見我不以不見見我以見不見我見我之處不以不見見我不見之所乃應之曰尚自不見我將何爲我所噫是爾第二義矣關尹子曰形可分可合可延可隱一夫一婦可生二子形可分一夫一婦二人成一子形可合食巨勝則壽形可延夜無月火人不見我形可隱以一氣生萬物猶棄髪可换所以分形以一氣合萬物猶破唇可補所以合形以神存氣以氣存形所以延形合形於神合神於無所以隱形汝欲知之乎汝欲爲之乎抱一子曰學道有三品上品者以神爲主中品者以氣爲主下品者以形爲主以神存氣以氣存形所以延形合形於神合神於無所以隱形二者雖有徼妙之分然皆以神爲主上品也以一氣生萬物以一氣合萬物如採祖氣服元氣閉胎息襲氣母之類皆以氣爲主中品也食巨勝則壽無月火則隱如服食金石草木存意形中一處皆以形物爲主下品也然三者之中至清者神至濁者形半清半濁者氣夫以至濁之形猶可合可分可延可隱而況於氣乎而況於神乎學者欲知之欲爲之惟其志而已矣關尹子曰無有一物不可見則無一物非吾之見無有一物不可聞則無一物非吾之聞五物可以養形無一物非吾之形五味可以養氣無一物非吾之氣是故吾之形氣天地萬物抱一子曰五物可以養形五味可以養氣則天地之間無一物非吾之形氣也至於無一物非吾之見無一物非吾之聞則聞與見果何物耶以爲形可聞見乎則死屍胡不能聞見也以爲氣可聞見乎則吁呵胡不能聞見也是則形氣之外别有物焉爲之主張乎是維持乎是然則是物果安在哉經不云乎恍恍忽忽其中有物窈窈㝠㝠其中有精欲識是物精神是也然神無我也即天地萬物之色以見吾神精無人也即天地萬物之聲以聞吾精是故吾之形氣天地萬物吾之精神萬物聲色關尹子曰耕夫習牛則獷獵夫習虎則勇漁夫習水則沉戰夫習馬則健萬物可爲我我之一身内變蟯蛔外烝蝨蚤瘕則龜魚瘻則鼠蟻我可爲萬物抱一子曰人之形本非我有習於物則與物俱化病於氣則與氣俱化昔人有繪虎入神而化爲虎者是習牛則獷之理也昔人有患瘤破之其中皆蝨者是則烝變蟯蛔之類也習則與物俱化病則與氣俱化而世人執有其身妄認爲已有者又豈悟夫天地之委形哉關尹子曰我之爲我如灰中金而不若鑛砂之金破鑛得金淘砂得金揚灰終身無得金者抱一子曰不知我無我而盡智求我者如揚灰求金終身不可得也知無我而不求我則如金藏於鑛砂玉藴於石樸昔人以喻水中鹹味色裏膠清畢竟是有不見其形可謂善喻矣關尹子曰一蜂至微亦能游觀乎天地一蝦至微亦能放肆乎大海抱一子曰蠢動含靈皆具是心皆具是道昔人謂焦㝠蟲向蚊蟲眉睫上建立世界蓋以形觀之則有巨細之分以心論之則無小大之辨故一蜂可游觀天地一蝦可放肆大海豈可以其形微而輕賤之哉關尹子曰土偶之成也有貴有賤有士有女其質土其壤土者人哉抱一子曰人之遇人有男女貴賤之相而起愛惡尊卑之念者分别於識而不照於智也今遇土偶之人亦有男女貴賤之相而不起愛惡尊卑之念者知其質爲土而有偽之之智也故前章有言曰知夫皆識所成故雖眞者亦偽之此變識爲智之妙用也關尹子曰目自觀目無色耳自聽耳無聲舌自嘗舌無味心自揆心無物衆人逐於外賢人執於内聖人皆僞之抱一子曰目逐於色耳逐於聲舌逐於味心逐於物者衆人也目内視自觀耳返聰自聽舌收津自嘗心攝念自揆者賢人也逐於外者固非執於内者亦妄先達有詩云雖然放下外塵勞内又縈心兩何異是以聖人皆偽之關尹子曰我身五行之氣而五行之氣其性一物借如一所可以取火可以取水可以生木可以凝金可以變土其性含攝元無差殊故羽蟲盛者毛蟲不育毛蟲盛者鱗蟲不育知五行互用者可以忘我抱一子曰天地之間鳥獸蟲魚莫不皆具五行之性比之人則有偏盛之禀耳偏於火者爲羽偏於金者爲毛偏於水者爲鱗朱雀在南白虎在西之類是也偏盛於此則不育於彼是知人與萬物各具五行而五行之氣輪環互用迴視我身皆五行之氣假合而成而昧者執有此身豈不惑哉知此說者可以忘我關尹子曰心憶者猶忘飢心忿者猶忘寒心養者猶忘病心激者猶忘痛苟吸氣以養其和孰能飢之存神以滋其暖孰能寒之養五藏以五行則無傷也孰能病之歸五藏於五行則無知也孰能痛之抱一子曰人之飢寒病痛皆出於妄心若夫心憶猶能忘飢之類是則以妄止妄之說也苟知夫我之妄心皆出於五行而以五行勝之則妄心可以消釋矣故吸氣以養和則可以忘飢存神以滋暖可以忘寒是則以金實土以火勝水之術也養五藏以五行可以愈病是則生尅補瀉之法也歸五藏於五行可以忘痛是則形氣無我之道也若夫不吸氣而飽不存神而暖不養五藏以愈病不歸五行以忘痛非天下至精至通之士其孰能與於此關尹子曰人無以無知無爲者爲無我雖有知有爲不害其爲無我譬如火也躁動不停未嘗有我抱一子曰此篇逐章言形食而論無我之說詳矣聖人又慮學者執無我如木石故於卒章重發明無我之妙用以爲譬如火也雖躁動不停未嘗有我若人達此妙用雖終日言行施爲不害其爲無噫莊子所謂深知無心者矣文始眞經言外㫖卷之六
