front:
  text: 文始眞經言外㫖卷之三賢八
  hash: sha256:548357abab7e2bd00ce013f70331b04476beba68d328141f6b549f6b27d95262
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0117_HFL_003-001a, image: hfl/0453/0453-148.png}
body:
  text: 抱一子陳顯微述三極篇極者尊聖人也凡二十七章關尹子曰聖人之治天下不我賢愚故因人之賢而賢之因人之愚而愚之不我是非故因事之是而是之因事之非而非之知古今之大同故或先古或先今知内外之大同故或先内或先外天下之物無得以累之故本之以謙天下之物無得以外之故含之以虛天下之物無得以難之故行之以易天下之物無得以窒之故變之以權以此中天下可以制禮以此和天下可以作樂以此公天下可以理財以此周天下可以禦侮以此因天下可以立法以此觀天下可以制器聖人不以一己治天下而以天下治天下天下歸功於聖人聖人任功於天下所以堯舜禹湯之治天下天下皆曰自然抱一子曰天無爲而萬化成聖人無爲而天下治聖人何心哉人徒見夫制禮作樂理財禦侮立法制器周濟曲成而不遺將謂聖人物物思之事事計之而以一已之智力當天下之事物也殊不知聖人本之以謙含之以虚行之以易變之以權因人之賢而賢之因之愚而愚之因是是之因非非之不以古今而先後其心不以内外而輕重其事而以天下治天下也天下歸功於聖人聖人不自以爲功而任功於天下是道也堯舜禹湯得之故皆曰自然關尹子曰天無不覆有生有殺而天無愛惡日無不照有妍有醜而日無厚薄抱一子曰聖人猶天也物有生殺天無愛惡聖人猶日也物有妍醜而日無厚薄是蓋聖人無爲無心之治也關尹子曰聖人之道天命非聖人能自道聖人之德時符非聖人能自德聖人之事人爲非聖人能自事是以聖人不有道不有德不有事抱一子曰聖人無我故道以天命不自有道也德以時符不自有德也事以人爲不自有事也彼執有道有德有事者庸人爾焉能忘我哉關尹子曰聖人知我無我故同之以仁知事無我故權之以義知心無我故戒之以禮知識無我故照之以智知言無我故守之以信抱一子曰聖人之五常亦猶衆人之五常夫豈異乎人哉特衆人之五常未能忘我而聖人之五常本於無我此其所以異乎人矣仁無我則同天下之我以爲仁義無我則權天下之事以爲義禮無我則戒天下之心以爲禮智無我則照天下之識以爲智信無我則守天下之言以爲信此其所以不可跂及歟關尹子曰聖人之道或以仁爲仁或以義爲仁或以禮以智以信爲仁仁義禮智信各兼五者聖人一之不膠天下名之不得抱一子曰以仁爲仁天下之人能與知而與行至於以義以禮以智以信爲仁則非天下至聖其孰能與此何則舉一常而五常備五换循環各兼五者視賢智之士厚於仁而薄於義智有餘而信不足者大有徑庭也易曰仁者見之謂之仁智者見之謂之智然則聖人之道混混淪淪何可得而名狀哉故曰聖人一之不膠天下名之不得關尹子曰勿以行觀聖人道無蹟勿以言觀聖人道無言勿以能觀聖人道無爲勿以貌觀聖人道無形抱一子曰道無形無蹟無言無爲學者何從而求之哉不已則求諸聖人聖人者道之體也然果可求之於聖人乎求之於聖人者不過言貌行能而已愈失之矣捨言貌行能之外何從而觀聖人哉善觀聖人者觀其心而不觀其迹然則聖人之心果可觀乎果不可觀乎界異於吾心乎果不異於吾心乎前章有言曰不借道於聖此之謂也關尹子曰行雖至卓不離高下言雖至工不離是非能雖至神不離巧拙貌雖至殊不離妍醜聖人假此以示天下天下㝠此乃見聖人抱一子曰聖人本無言貌行能不得已而假此以示天下人徒見聖人言之工貌之殊行之卓能之神而謂道在夫四者之間而有是非妍醜高下巧拙之辯愈不足以識聖人矣學者㝠此而於四者之外觀之斯善學矣關尹子曰聖人師蜂立君臣師踟蛛立網罟師拱鼠制禮師戰螘置兵一作制兵衆人師賢人賢人師聖人聖人師萬物惟聖人同物所以無我抱一子曰衆師賢賢師聖聖師萬物固矣然則聖人果師蜂而立君臣師蛛鼠螘而置網禮兵乎聖人同物置作無我天下之物皆聖人之師也物生自然聖人師其自然而已矣聖人何心哉關尹子曰聖人之於衆人飲食衣服同也屋室舟車同也貴賤貧富同也衆人每同聖人聖人每同衆人彼仰其高侈其大者其然乎其不然乎抱一子曰聖人之處世和其光同其塵惟恐自異於衆人而其起居衣食貧富貴賤何敢異於人哉使人仰其高侈其大者聖人所懼也士成綺見老子而問曰吾觀子非聖人也鼠壤有餘蔬生熟不盡於前而積歛無崖老子漠然不應然則聖人之處世豈容衆人之仰侈哉關尹子曰聖人曰道觀天地人物皆吾道倡和之始終之青黃之卵翼之不愛道不棄物不尊君子不賤小人賢人曰物物物不同旦旦去之旦旦與之短之長之直之方之是爲物易者也殊不知聖人鄙雜厠别分居以爲人不以此爲己抱一子曰聖人道則如絲之紛事則如棊之布聲倡倡之聲和和之事始始之事終終之色青青之色黃黃之物卵卵之物翼翼之無愛道無棄物不尊君子不賤小人此則道如絲棼也至於鄙雜衆物厠别分居或短或長或直或方物物不同旦旦去取井井有條此則事如棊布也聖人志於道無心無我故不爲物易賢人志洛物有心有人故未免爲物所易關尹子曰魚欲異群魚捨水躍岸即死虎欲異群虎捨山入市則擒聖人不異衆人特物不能拘耳抱一子曰莊子謂昔吾聞之大成之人曰自伐者無功功成者堕名成者虧孰能去功與名而還與還人純純常常削迹捐勢無責於人人亦無責焉此聖人不異衆人之說也若夫遊於雕陵而忘其身見異鵲之利而忘其眞虞人逐之以吾爲戮反走而三月不庭此魚捨水躍岸虎捨山入市之謂也雖然聖人處衆雖不自異物豈能拘之哉關尹子曰道無作以道應世者是事非道道無方以道寓物者是物非道聖人竟不能出道以示人抱一子曰道本無爲而以道應世者是事也道本無體而以道寓物者是物也聖人終不能將出此道以示人然則志道之士何從而得之哉昔人謂使道可獻人莫不獻之于其君使道可進則人莫不進之於其親使道可傳人莫不傳之於其子孫惟其不可以出示於人故得之者鮮矣然則聖人終不傳於人乎孔子不云乎吾無隱乎爾善觀聖人者當於事物之外觀之關尹子曰如鍾鍾然如鍾鼓然聖人之言則然如車車然如車舟然聖人之行則然惟莫能名所以退天下之言惟莫能知所以奪天下之智抱一子曰謂鍾爲鍾人皆然之謂鼔爲鍾則人不測其言所以退天下之言也謂車車行人皆然之謂舟車行則人罔測其行所以奪天下之智也是猶犬可以爲羊輪不輾地之辯也其可以言名乎其可以智知乎關尹子曰蝍蛆食虵虵食鼃鼃食蝍蛆互相食也聖人之言亦然言有無之弊又言非有非無之弊又言去非有非無之弊言之如引鋸然惟善聖者不留一言抱一子曰夫大道無說善聖者不言非無說也不可說也不可說而言之則有弊何則言不出乎有無也言有則無言無則有言非有則非無言非無則非有有無相吞互相爲弊猶虵鼃蝍蛆互相吞食如引鋸然去來牽掣是則有言不如無言也然則聖人果不留一言乎聖人之言滿天下學者苟以聖人之言爲言不惟不知言併與聖人失之矣關尹子曰若龍若蛟若蛇若龜若魚若蛤龍皆能之蛟蛟而已不能爲龍亦不能爲蛇爲龜爲魚爲蛤聖人龍之賢人蛟之抱一子曰聖人能大能小能智能愚能垢能淨能貴能賤能壽能夭千變萬化無可無不可賢人則不然能大者不能小能智則不能愚昔孔子見老子歸謂弟子曰吾乃今於是乎見龍龍合而成體散而成章乗乎雲氣而養乎陰陽予口張而不能嗋又何規於老聃哉子貢曰然則人固有尸居而龍見雷聲而淵默發動如天地者乎賜亦可得而觀乎聖人龍之賢人蛟之其是之謂歟關尹子曰在己無居形無自著其動若水其靜若鏡其應若響芒乎若亡寂乎若清同焉者和得焉者失未嘗先人而嘗隨人抱一子曰在己不自居自居則有我矣能無我則形物自著非我分别而著彼形物也此靜也靜極則動而其動也如水之流動已復靜而其靜若鏡之瑩是則雖有動靜而何嘗動靜哉其應物也若響之應聲則吾如虚空虚谷矣芒芴乎若未嘗有寂湛乎徹底純清同乎物而不自異則與物和而不競也驚其得而不自有則與道忘而不失也未嘗先人常後而不先不敢爲天下先也而嘗隨人和而不唱不得已而後動也體用具存權實畢備此聖人之所以爲善聖歟關尹子曰渾乎洋乎游太初乎時金已時玉已時糞已時土已時翔物時逐物時山物時淵物端乎權乎狂乎愚乎抱一子曰老子曰吾游於物之初孔子曰何謂邪曰心困焉而不能知口辟焉而不能言始終相反乎無端而莫知乎其所窮謂之渾乎洋乎游太初乎豈不信然至於如金在鑛如玉藴石則時金時玉也道在瓦礫道在屎溺則時糞時土也鶉居而鷇食鳥行而無影則時翔物也呼我馬而謂之馬呼我牛而謂之牛則時逐物也塊然如石槁然如木則時山物也如鱗之潜如魚之泳則時淵物也然則皆聖人之正行也皆聖人之權變乎大聖若狂大智若愚夫豈眞狂眞愚也哉關尹子曰人之善琴者有悲心則聲淒淒然有思心則聲遲遲然有怨心則聲回回然有慕心則聲裴裴一作奕奕然所謂悲思怨慕者非手非竹非絲非桐得之心符之手得之手符之物人之有道者莫不中道抱一子曰人之善琴者得之心而符之手得之手而符之物而悲思怨慕之心猶足以感絲桐而聲爲之變而況有道之人動止周旋無不中道寜不感天動地康時豐物哉昔庚桑楚得老子之道居畏壘之山三年而畏壘大穰其是之謂乎關尹子曰聖人有言有爲有思者所以同乎人未嘗言未嘗爲未嘗思者所以異乎人抱一子曰聖人終日言而未嘗言終日爲而未嘗爲終日思而未嘗思特人不能測識耳何以異於人哉關尹子曰利害心愈明則親不睦賢愚心愈明則友不交是非心愈明則事不成好醜心愈明則物不契是以聖人渾之抱一子曰衆人昭昭而我獨昏昏衆人察察而我獨悶悶昭昭察察則利害賢愚是非好醜之心愈明矣愈明則於親友事物愈難睦交成契矣惟聖人以無心渾之則利自利害自害賢自賢愚自愚是自是非自非好自好醜自醜如是則親無不睦友無不交事無不成物無不契聖人初何容心哉關尹子曰世人愚拙者妄援聖人之愚拙自解殊不知聖人時愚時明時拙時巧抱一子曰聖人有大巧而若拙有大智而若愚世之愚拙者妄援聖人以自解則愚者愈見其愚而拙者愈露其拙豈能自解哉關尹子曰以聖師聖者賢人以賢師聖者聖人蓋以聖師聖者徇蹟而忘道以賢師聖者返蹟而合道抱一子曰有聖有賢之分者跡也未嘗有聖有賢之分者道也視聖人爲聖人豈可跂及哉是則徇蹟而忘道也惟不知其爲聖而以賢師資之則智齊於師庶乎忘其蹟而得其道矣而古人猶謂智與師齊减師半德學者須負過師之智則幾矣關尹子曰賢人趨上而不見下衆人趨下而不見上聖人通乎上下惟其宜之豈曰離賢人衆人别有聖人也哉抱一子曰中人以上可以語上故賢人趨上中人以下不可以語上故衆人不見上皆偏也聖人渾通上下無所不趨無所不見在賢亦宜在衆亦宜和光同塵所以異於賢人遠矣關尹子曰天下之理夫者唱婦者隨牡者馳牝者逐雄者鳴雌者應是以聖人制言行而賢人拘之抱一子曰聖人言滿天下無口過行滿天下無怨惡何則任物理之自然而君臣上下父子兄弟貴賤尊卑之間感應貫通出於口而行於身譬如夫唱婦隨牡馳牝逐雄鳴雌應莫不順其自然之理也聖人初何容心哉賢人制禮法以防人心故不得不拘之至有言行樞機榮辱之戒善惡千里違順之幾故學者不得不謹言行也關尹子曰聖人道雖虎變事則鼈行道雖絲棼事則棊布抱一子曰前云聖人龍之如易之乾卦有大人飛龍之象今云虎變如易之章卦有大人虎變之象龍則言聖人之體變化無常飛潜莫測虎則喻聖人之道焕乎有文章之可觀凛乎有威風之可畏及乎行聖人之事則愚夫愚婦亦可行之而歩履方拙如鼈初無甚高難行之舉也道則絲芬事則棊布者以言其道若渾而難理其事則有條而不紊也關尹子曰所謂聖人之道者胡然孑孑爾胡然徹徹爾胡然唐唐一作堂堂爾胡然臧臧一作藏藏爾惟其能徧偶萬物而無一物能偶之故能貴萬物抱一子曰聖人之道如太虚孑孑然無與爲偶徹徹然無不洞貫唐唐然充滿乾坤臧臧然不容視聽惟其能遍偶萬物而無一物能偶之所以貴於萬物老子曰有物渾成先天地生巍巍尊高其是之謂乎關尹子曰雲之卷舒禽之飛翔皆在虛空中所以變化不窮聖人之道則然抱一子曰聖人之道如雲在太虚而卷舒不定如禽在太空而飛翔無窮使無此虚空以容之則雲禽之變化飛翔窒矣使聖人之道不得無方之神無體之玄以運之則聖人之變化窮矣文始眞經言外㫖卷之三
