front:
  text: 文始眞經言外㫖卷之七賢十二
  hash: sha256:0a21dcdbd0da71125fa1fadd32943045258469b176ef5c3cac930483345b3937
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0117_HFL_007-001a, image: hfl/0454/0454-084.png}
body:
  text: 抱一子陳顯微述七釜篇釜化也凡三章關尹子曰道本至無以事歸道者得之一息事本至有以道運事者周之百爲得道之尊者可以輔世得道之獨者可以立我知道非時之所能拘者能以一日爲百年能以百年爲一日知道非方之所能礙者能以一里爲百里能以百里爲一里知道無氣能運有氣者可以召風雨知道無形能變有形者可以易鳥獸得道之清者物莫能累身輕矣可以騎鳳鶴得道之渾者物莫能溺身㝠矣可以席蚊鯨有即無無即有知此道者可以制鬼神實即虛虛即實知此道者可以入金石上即下下即上知此道者可以侍星辰古即今今即古知此道者可以卜龜筮人即我我即人知此道者可以窺他人之肺肝物即我我即物知此道者可以成腹中之龍虎知象由心變以此觀心可以成女嬰知氣由心生以此吸神可以成鑪冶以此勝物虎豹可伏以此同物水火可入惟有道之士能爲之亦能能之而不爲之抱一子曰易曰知變化之道者其知神之所爲乎孟子曰聖而不可知之謂神今天下之學者去聖逾遠望道而未之見覬其庶幾聖人者絶代無聞焉而況不可知之神故言神者例以孔子不語怪力亂神絶之故知道之士絶口不言至於生死之說亦祕而不傳矣且孔子果不言神乎果不言生死乎如曰知死生之說如曰陰陽不測之謂神鼓之舞之以盡神皆孔子之言也今聖人於七釜一篇備言變化之道盖釜者資水火以變物之器也後世學者觀之不驚其言者鮮矣或者指爲異端偽書宜哉莊子有言曰瞽者無以與乎文章之觀聾者無以與乎鍾鼓之聲豈唯形骸有聾瞽哉夫知亦有之其是之謂歟易不云乎天下之動眞夫一者也即以事歸道者得之一息之理也以道運事者周之百爲即能成天下之務一致而百慮也得道之尊獨者可以輔世立我即輔相天地之宜聖人之大寳曰位也道非時之所能拘非方之所能礙即通乎晝夜之道而知不疾而速不行而至之謂也可以召風雨侍星辰則風以散之雨以潤之可謂祐神之謂也可以易鳥獸騎鳳鶴席蛟鯨制鬼神則精氣爲物游魂爲變知鬼神之情狀之謂也可以入金石即兊爲金艮爲石山澤通氣然後能變化成萬物之謂也可以卜龜筮即卜筮尚占受命如響之謂也學者能知乾坤一闔一闢謂之變則知坎離交遇水火相射山澤通氣雷風相薄之機然後知我之震兊即他人之肺肝能入震兊之神則可以窺他人之肺肝矣我之魂魄即龍虎之精英能凝魂魄之氣則可以化腹中之龍虎矣坎之中有嬰兒離之中有姹女能取坎中之實以點離中之虚則女嬰相見各現其形是道也因運神火照入坎中驅逐陰中之陽飛騰而上至神火本位遇陽中之陰擒制交結如金烏搦兔磁石吸針二氣紐結而生變化或現女嬰之像或呈龍虎之形變化萬端飛走不定往來騰躍不出鼎鑪當是時則當鼔動巽風助吾離火猛烹極煆鍊成眞丹凝成至寳道也其中有觀心吸神二用皆助火候之力者釋氏之觀法觀心似是而非方士之服氣嚥津棄本逐末安識運神火以觀眞心鼔巽風以吸眞神之妙用哉丹成之後自然可以伏虎豹可以入水火是皆性命之祕間有形於易書者易不云乎非天下至神至精至變至通其孰能與於此苟非其人道不虚行故曰惟有道之士能爲之聖人欲顯諸仁藏諸用以盡内聖外王之道故曰亦能能之而不爲之關尹子曰人之力有可以奪天地造化者如冬起雷夏造冰死屍能行枯木能華豆中攝鬼杯中釣魚畫門可開土鬼可語皆純氣所爲故能化萬物今之情情不停亦氣所爲而氣之爲物有合有散我之所以行氣者本未嘗合亦未嘗散有合者生有散者死彼未嘗合未嘗散者無生無死客有去來郵常自若抱一子曰列子問至人潜行不窒蹈火不熱行乎萬物之上而不慄何以至此關尹答曰是純氣之守也非智巧果敢之列夫人拘於形則不能變化若夫鍊形爲氣使形盡化氣則聚成形而散爲氣矣故能化萬物今觀雲之變化則知氣之變化也且蜃之爲物不靈於人而猶積氣之乆可以化樓閣人物以爲海市至於鷹化爲鳩豹變爲虎蜣化爲蟬魚化爲龍鳥獸蟲魚尚能奪天地之造化人反不若何耶以六欲七情内賊其天眞五行六塵外鑠其神氣雖間有知道者能制精葆神鍊形化氣而作輟不常十寒一曝求其純乎化氣雖億兆人中而求一人不可得矣是道也賢愚貴賤皆可爲之其道不遠今之情情不停皆此物也蓋有非此物者存乎其中學者知乎此則知吾之所以行氣者知所以行氣則知所以鍊氣知所以鍊氣則知所以化氣成醇矣是寳也不隨氣合不隨氣散不逐形生不逐形死故曰客有去來郵常自若關尹子曰有誦呪者有事神者有墨字者有變指者皆可以役神御氣變化萬物惟不誠之人難以自信而易於信物故假此爲之苟知爲誠有不待彼而然者抱一子曰誠者可以動天地感鬼神故或誦呪事神或墨字變指皆可役神御氣變化萬物不誠之人不自信其虚而易於信外物故聖人假此變化以啓其信心使其苟知其爲誠則不待彼爲之而自能爲之矣關尹子曰人一呼一吸日行四十萬里化可謂速矣惟聖人不存不變抱一子曰天地之大不可以程度計今云一呼一吸日行四十萬里則人一晝一夜凡一萬三千五百息日行五十四億里爲一周天昔人以表影長短驗日之行度遠近亦以世之尋文爲準既可以尋文計則可以歩里計矣愚妄以謂日行四十萬里豈得無奇是蓋總其大數耳若果有奇則恐滿五千五億里之數則與易之天地之數五十有五合矣日月五星離合順逆聖人皆能測而爲曆而昧者莫不見莫能知也故陰符經曰天下莫不見莫能知者是也夫速莫速於大化昔人謂揭天地以趨新負山嶽以捨故造化無斯須不移也萬物無暫忽不變也山川目更矣而世人以爲如昨時世日新矣而世人以爲如故今交一臂而失之者皆在㝠中去矣故向者之我非復今我今日之我非復故吾矣是則我與今俱往矣而昧者不知橫謂今日所遇可係而存安知一息之頃而大化已行四十萬里哉惟聖人不逆化而存亦不順化而變故曰不存不變億者謂萬萬爲億關尹子曰青鸞子千歲而千歲化桃子五仕而心五化聖人賔事去物豈不欲建立於世哉有形數者懼化之不可知也抱一子曰有形有數者必化在聖人不欲苟免也何則既謂之形必有數焉非我所有也天地之委蛻也天地且不能停化而形豈能違化哉雖然聖人假衆物以游世對五行以寓形應萬事不敢爲天下先故不爲主而爲賔也御萬物而不爲萬物所役故立於獨而無待也爲賔則如寄謂來去自如耳無待則無耦謂存亡不二耳如是則若形若數豈能拘哉而聖人猶不欲乆立於世者示此形軀爲吾大患懼化之不可知也青鸞子古之得道之士也住世千歲而千歲化即此意也若夫桃子五仕而心五化者如孔子行年六十而六十化曾子再仕而心再化意同關尹子曰萬物變遷雖互隱見氣一而已惟聖人知一而不化抱一子曰此章意連上章謂有形之物雖互隱見而一氣在天地間未嘗化也一氣猶且不化況吾之非氣者哉何謂非氣氣之所自生者前篇已詳述之矣聖人此章明吾之靈眞若寓於形則雖千年亦化寓於氣則一而不化也關尹子曰爪之生髪之長榮衛之行無頃刻止衆人能見之于著不能見之於微聖人任化所以無化抱一子曰衆人徒見天地日月化行之速此著而易見者也而不知吾之榮衛晝夜之間行陰二十五度行陽二十五度凡一萬三十五百息脉絡之循環運轉無頃刻止故爪之生髪之長無暫忽停此微而難見者也孰能逃之哉惟聖人不存不變任彼自化所以無化關尹子曰室中有常見聞矣既而之門之之里之黨既而之郊之山之川見聞各異好惡隨之和競從之得失成之是以聖人動止有戒抱一子曰聖人之聞見未嘗異於衆人衆人之聞見隨處變異而生好惡和競得夫之心使聖人異於衆人而隨處不生好惡和競得失之心則有心矣有我矣此賢人不動心之學望聖人而未至者也若夫聖人則出門同人隨人好惡從人和競成人得失如老子之人號亦號人笑亦笑孔子之耳順縱心列子從師三年心不敢念是非口不敢言利害從師五年心更念是非口更言利害此皆聖人不異衆人衆人不異聖人之說也何嘗以聞見自異哉聖人之所謹者不妄出户庭而無咎不妄同人于莽而弗克攻不妄同人于郊而志未得危邦不入亂邦不居特以動止爲戒而已矣關尹子曰譬如大海能變化億萬蛟魚水一而已我之與物蓊然蔚然在大化中性一而已知夫性一者無人無我無死無生抱一子曰昔人有言曰魚龍不知水爲命猶人在空中不識空我之與物林然在大化之中性一而已猶蛟魚生於大海之中水一而已知大海爲一水則蛟魚相忘矣知太虚惟一性則人我相忘矣何者爲死何者爲生關尹子曰天下之理是或化爲非非或化爲是恩或化爲讎讎或化爲恩是以聖人居常慮變抱一子曰天下無有不變之事亦無有不變之理聖狂之相去奚啻天淵生死之不齊奚啻冰炭而聖罔念則化作狂狂克念則化作聖而生極則化爲殺殺極則化爲生而況是非恩讎之間疑似反復豈不易變哉昧者執其自是如山之不可移恃其有恩如海之流不竭未幾是化爲非恩化爲讎而前日自是之我山俄化而爲衆非之海恃恩之人海俄化而爲積怨之山如高岸爲谷深谷爲陵不期變而變也吁可畏哉惟聖人不執是不辨非不恃恩不念讎平我山夷人海居天下之常慮事物之變未嘗先人而嘗隨人其要無咎而已矣關尹子曰人之少也當佩乎父兄之教人之壯也當達乎朋友之箴人之老也當警乎少壯之說萬化雖移不能厄我抱一子曰人之處世未免有立身行己應事接物之爲苟有我而自用則一動之頃吉凶悔吝隨之惟有一吉之利而凶悔吝三者厄我矣惟聖人捨己從人當少時即佩父母之教及其壯也達乎朋友之箴至於老也警其少壯之說是則自少至老未嘗有我萬化雖移安能厄我哉關尹子曰天下之理輕者易化重者難化譬如風雲須臾變滅金玉之性歷乆不渝人之輕明者能與造化俱化而不留殆有未嘗化者存抱一子曰輕者人之魂也明者人之神也魂爲木所以輕也神爲火所以明也日出於卯而魂旺日中於午而神旺日晡於申而䰟絶日没於亥而神絶是則一日之間而吾之魂神與造化俱化而不留矣惟精與魄重而且暗可以歷乆故能胎䰟胎神至於來日輕明魂神復自精魄因明因寤而復生復旺矣是則輕而明者假重而暗者爲之母也使魂神絶於申亥之間而精魄壞而不存則來日之䰟神無自而生矣知道之士知乎此故鍊精鍊魄爲金爲玉使歷乆不渝則吾之䰟神可以永乆乗負得其所託而生長矣參同契曰吉人相乗負安穩可長生是則鍊精魄爲金玉則吾身爲大吉之身而乗負吾之魂神矣所以太乙火符修鍊金丹只念二物者鍊精與魄也並土爲三物耳參同契謂其三遂不入火二與之俱者木三之魂與火二之神不須鍛鍊不入鑪鼎而在鑪鼎之外周天運火者乃神與魂也魂三神二合之成五所以能周天運火而不昧精水之一與魄金之四亦合之成五所以能化金液以成丹如是四物俱能成五者實假中宫土五以成變化張悟眞謂只縁彼此懐眞土遂使金丹有返還者此也又曰東三南二同成五北一西方四共之戊已自居本生位三家相見結嬰兒知此理然後知吾身殆有未嘗化者存關尹子曰二幼相好及其壯也相遇則不相識二壯相好及其老也相遇則不相識如雀蛤鷹鳩之化無昔無今抱一子曰人之形體亦天地間一物耳無傾刻不與造物俱化者也幼時顔貌至壯則異壯時顔貌至老則殊如雀蛤鷹鳩隨四時陰陽之氣變化形體不得自如也安有今昔之同哉然則吾之形容與今俱往矣與物俱化矣可不覺乎文始經言外㫖卷之七
