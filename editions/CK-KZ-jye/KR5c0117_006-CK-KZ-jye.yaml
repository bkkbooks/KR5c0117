body:
  text: 六匕篇匕者食也食者形也凡十六章世之人以我思異彼思彼思異我思分人我者殊不知夢中人亦我思異彼思彼思異我思孰爲我孰爲人世之人以我痛異彼痛彼痛異我痛分人我者殊不知夢中人亦我痛異彼痛彼痛異我痛孰爲我孰爲人爪髮不痛手足不思亦我也豈可以思痛異之世之人以獨見者爲夢同見者爲覺殊不知精之所結亦有一人獨見於晝者神之所合亦有兩人同夢於夜者二者皆我精神孰爲夢孰爲覺世之人以暫見者爲夢久見者爲覺殊不知暫之所見者陰陽之炁久之所見者亦陰陽之炁二者皆我陰陽孰爲夢孰爲覺昔人有不識我而求我者以色求之不得又以聲求之不得又於臭味覺意求之俱不得然後知我之爲我視之不見聽之不聞搏之不得而橫執以爲我者皆妄也安識所謂眞我哉今夫世之人以能思能痛者爲我以不能思不能痛者爲非我兩失之矣能思能痛者果我乎我本無意無念思從何來是則妄有縁塵於中積聚狃習爲思非我眞有是思也我本無相無體痛從何起是則妄有血氣於中假合觸覺爲痛非我眞有是痛也然則不能思不能痛者果非我乎爪髮不痛手足不思亦我也夢中之天地萬物不思夢中之人神鳥獸不痛亦我也豈可以人我異之世之人以獨見暫見者爲夢以同見久見者爲覺亦兩失之矣獨見暫見者果夢乎我本無夢蓋因陰因夜因寐與識相縁而有是夢也我本無覺蓋因陽因晝因寤與見相縁而有是覺也然則同見久見者果非夢乎神之所合亦有兩人同夢於夜者陰陽結習亦有天地萬物久見於夢者豈可以覺夢異之人與我不異覺與夢不殊然後知遍虛空世界天地人物無一物非我之眞無一物是我之已而已矣好仁者多夢松柏桃李好義者多夢兵刀金鐵好禮者多夢簠簋籩豆好智者多夢江湖川澤好信者多夢山岳原野役於五行未有不然者然夢中或聞某事或思某事夢亦隨變五行不可拘聖人御物以心攝心以性則心同造化五行亦不可拘世人不能逃陰陽五行者以心有所思而役於事物也傳曰冦莫大於陰陽無所逃於天地之間又曰五賊在心施行于天是則五賊生於陰陽而人之所思不着事卽着物事物不出於五行所以爲五賊所役而不能逃也是賊也在陽則爲覺在陰則爲夢在覺爲事在夢爲物如好仁者多夢松栢之類皆役於五行也雖役於五行而夢中忽聞别事忽思他事識見變遷則夢亦隨變五行亦不能拘知夢中之五行不能拘則若事若物皆可以御而役之而不役於事物也不役於事物則陰陽五行烏能爲寇爲賊哉聖人御事物不以思而以心攝心不以念而以性此其所以心同造化而五行不可拘歟汝見蛇首人身者牛臂魚鱗者鬼形禽翼者汝勿怪此怪不及夢夢怪不及覺有耳有目有手有臂怪尤矣大言不能言大智不能思天不言而日月運四時行天雖不言而日月運四時行乃大言矣聖人不思而得聖人雖不思而能得乃大智矣今有人見夫未嘗見者如蛇首人身之類必以爲怪矣不思夫形寢神息之時忽有所夢天地人物從何而生從何而見世人習慣不以爲怪細推詳研吾之精神本自清明甯一而化爲是夢豈不甚可怪哉知夢爲怪矣今觀我之形有耳有目有手有臂視聽動止比之夢中所見一一有實豈不尤可怪耶况口之能言心之能思其爲怪有不可勝言者矣或曰吾道與之貌天與之形雖具耳目手足反而思之不見其爲有也如是則怪可去乎愚答曰道甚麼或人再舉前問愚曰大言不能言大智不能思或者呿然而退有人問於我曰爾族何氏何名何字何食何衣何友何僕何琴何書何古何今我時默然不對一字或人扣之不已我不得已而應之曰尙自不見我將何爲我所人有眞我雖聖智未易自見也人惟不能自見故或以色求我或以聲音求我轉不可得而見矣况問我以氏族名字衣食友僕琴書古今哉宜乎聖人嘿然不對是不對也乃所以深對也或者不喻聖人之意而扣之不已夫扣之不已者疑乎信乎以爲信耶彼之我卽我之彼也彼之彼卽我之我也彼彼不能相我則我我不能喻彼矣以爲疑耶則我以不我對而不對以我對我以對非對則以不對對又何疑焉而扣之不已耶聖人於是自其妄見而喻之謂彼以見見我不以不見見我以見不見我見我之處不以不見見我不見之所乃應之曰我尙不見我將何爲我所噫是亦第二義矣形可分可合可延可隱二夫一婦可生二子形可分一夫一婦二人成一子形可合食巨勝則夀形可延夜無月火人不見我形可隱以一炁生萬物猶棄髮可換所以分形以一炁合萬物猶破唇可補所以合形以神存炁以炁存形所以延形合形於神合神於炁所以隱形汝欲知之乎汝欲爲之乎學道有三品上品者以神爲主中品者以炁爲主下品者以形爲主以神存炁以炁存形所以延形合形於神合神於炁所以隱形二者雖有徼妙之方然皆以神爲主上品也以一炁生萬物以一炁合萬物如採祖炁服元炁閉胎息襲氣母之類皆以氣爲主中品也食巨勝則夀無月火則隱如服食金石草木存意形中一處皆以形物爲主下品也然三者之中至清者神至濁者形半清半濁者氣夫以至濁之形猶可合可分可延可隱而况於炁乎而况於神乎學者欲知之欲爲之惟其志而已矣無有一物不可見則無一物非吾之見無有一物不可聞則無一物非吾之聞五物可以養形無一物非吾之形五味可以養氣無一物非吾之氣是故吾之形氣天地萬物五物可以養形五味可以養氣則天地之間無一物非吾之形氣也至於無一物非吾之見無一物非吾之聞則聞與見果何物耶以爲形可聞見乎則死屍胡不能聞見也以爲氣可聞見乎則噓呵胡不能聞見也是則形氣之外别有物焉爲之主張乎是維持乎是然則是物果安在哉經不云乎恍恍惚惚其中有物杳杳冥冥其中有精欲識是物精神是也然神無我也卽天地萬物之色以見吾神精無人也卽天地萬物之聲以聞吾精是故吾之形氣天地萬物吾之精神萬物聲色耕夫習牛則獷獵夫習虎則勇漁夫習水則沉戰夫習馬則健萬物可爲我我之一身内變蟯蛔外烝蝨蚤瘕則龜魚瘻則鼠螘我可爲萬物人之形本非我有習於物則與物俱化病於氣則與氣俱化昔人有繪虎入神化爲虎者是習牛則獷之意也昔人有患瘤破之其中皆蝨者是外蒸變蟯蛔之類也習則與物俱化病則與氣俱化而世人執有其身妄認爲已有者又豈悟夫天地之委形哉我之爲我如灰中金而不若礦砂之金破礦得金淘砂得金揚灰終身無得金者不知我無我而盡智求我者如揚灰求金終身不可得也知無我而不求我則如金藏於礦砂玉藴於石璞昔人以喻水中鹹味色裏膠青畢竟是有不見其形可謂善喻矣一蜂至微亦能游觀乎天地一鰕至微亦能放肆乎大海蠢動含靈皆具是心皆具是道昔人謂焦冥蟲向蚊蟲眉睫上建立世界蓋以形觀之則有巨細之分以心論之則無小大之辯故一蜂可游觀天地一鰕可放肆大海豈可以形微而輕賤之哉土偶之成也有貴有賤有士有女其質土其壞土人哉是豈等于人而貴之賤之哉人之遇人有貴賤男女之相而起愛惡尊卑之念者分别於識而不照於智也今遇土偶之人亦有貴賤男女之相而不起愛惡尊卑之念者知其質爲土而有僞之之智也前章有言曰知夫皆識所成故雖眞者亦僞之此變識爲智之妙用也目自觀目無色耳自聽耳無聲舌自嚐舌無味心自揆心無物眾人逐於外賢人執於内聖人皆僞之目逐於色耳逐於聲舌逐於味心逐於物者眾人也目内視自觀耳反聰自聽舌收津自嚐心攝念自揆賢人也逐於外者固非執於内者亦妄先達有詩云雖然放下外塵勞内又縈心兩何異是以聖人皆僞之我身五行之氣而五行之炁其性一物借如一所可以取水可以取火可以生木可以凝金可以變土其性含攝元無差殊故羽蟲盛者毛蟲不育毛蟲盛者鱗蟲不育知五行互用者可以忘我人一身之中具五行之炁所主所應歧之則五其互相含攝元一性也如金鎔之得水擊之得火木絞之得水鑽之得火是也至於鳥獸蟲魚莫不皆然比之人則有偏盛之禀爾偏於火者爲羽偏於金者爲毛偏於水者爲鱗朱雀在南白虎在西之類是也偏盛於此則不育於彼是知人與萬物各具五行而五行之炁輪環互用回視我身皆五行之炁假合而成而昧者執有此身豈不惑哉知此說者可以忘我枯龜無我能見大知磁石無我能見大力鐘鼓無我能見天音舟車無我能見遠行故我一身雖有智有力有行有音未嘗有我枯龜磁石鐘鼓舟車皆物也焉能有爲乎所以見大知大力大音大行者物感之故也人於事物未行之時無思無爲寂然何有一旦物感而動事激而發則智力言行見矣智力言行雖見實事物也於我何有哉故曰未嘗有我蜮射影能斃我知夫無知者亦我則溥天之下我無不在通天地之間一氣爾豈有無虛實能間之哉世人執六尺之軀以痒疴覺觸者爲我之有且爪與髮我之實有也何割之而不痛影非我之實有也何蜮射之而斃我世人見之於著不見之於微知乎此則知無知者亦我也故曰溥天之下我無不在心憶者猶忘饑心忿者猶忘寒心養者猶忘病心激者猶忘痛苟吸炁以養其和孰能饑之存神以滋其暖孰能寒之養五藏以五行則無傷也孰能病之歸五藏於五行則無知也孰能痛之人之饑寒病痛皆出於妄心若夫心憶猶能忘饑之類是則以妄止妄之説也苟知夫我之妄心皆出於五行而以五行勝之則妄心可以消釋矣故吸炁以養和則可以忘饑存神以滋暖可以忘寒是則以金實土以火勝水之術也養五藏以五行可以愈病是則生尅補瀉之法也歸五藏於五行可以忘病是則形氣無我之道也若夫不吸炁而飽不存神而暖不養五藏以愈病不歸五行以忘痛非天下至精至通之士其孰能與於此人無以無知無爲者爲無我雖有知有爲不害其爲無我譬如火也躁動不停未嘗有我此章逐章言形食而論無我之説詳矣聖人又慮學者執無我如木石故於卒章重發明無我之妙用以爲譬如火也雖躁動不停未嘗有我若人達此妙用雖終日言行施爲不害其爲無我噫莊子所謂深知無心者矣朱象先曰匕者何食也食者何形也五味可以養氣五物可以養形無一物非吾之炁卽無一物非吾之形也然則形果一乎非也我思異彼思我痛異彼痛彼之不可爲我猶夢之不可爲覺也然則形果歧乎亦非也異地而同夢千里而一揆孰爲我孰爲人不惟是也習牛則獷習馬則健萬物一我也瘕則魚之瘻則鼠之我一萬物也夫我與萬物則必有分矣而不免與物俱化者何也知我之我而不知無我之我也且所謂無我之我者又非不目而觀不耳而聽不舌而嚐不心而揆之謂也執我爲我猶揚灰而求金執無我爲我亦因噎而廢食也惟聖人能卽我而忘我卽我而忘我故不以見見我并不以不見見我雖謂耳目手臂之我非我而蛇首人身鬼形禽翼之我是我可也雖謂智力行音之我非我而枯龜磁石鐘鼓舟車之我是我可也不我而我故無物非我我而不我故無物是我故曰我與物不異夢與覺不殊箋六匕
