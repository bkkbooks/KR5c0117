body:
  text: 不停者乎而不見夫一呼一吸日行四十萬里者乎如輕風掣雲倐忽萬狀而太虛不動也如客有去來郵常自若也故曰聖人任化所以不化不化者何知一而不化也一者何性也性一者無人無我無死無生化而有未嘗化者也易曰知變化之道者其知神之所爲乎神莫神於化而不化之釜矣箋七釜八籌篇籌者物也凡六章古之善揲蓍灼龜者能於今中示古古中示今高中示下下中示高小中示大大中示小一中示多多中示一人中示物物中示人我中示彼彼中示我是道也其來無今其往無古其高無蓋其低無載其大無外其小無内其外無物其内無人其近無我其遠無彼不可析不可合不可喻不可思惟其渾淪所以爲道郭本有其本無一其末無多在其小無内之下易曰探賾索隱鉤深致遠成天下之亹亹者莫大乎蓍龜如是則蓍之與龜可以喻道矣是物也本枯莖朽骨爾靈從何來聖從何起今焉能於今中示古古中示今是則其來無今其往無古而彰往察來也能於高中示下下中示高是則其高無蓋其低無載而上下無常也能小中示大大中示小是則其大無外其小無内而齊小大也能一中示多多中示一是則錯綜其數一致百慮也能人中示物物中示人是則其外無物其内無人而無有遠近幽深遂知來物也能我中示彼彼中示我是則其近無我其遠無彼而以言乎遠則不禦以言乎邇則靜而正也然則枯莖朽骨何其神哉是神也存乎枯莖朽骨之中不可析不可合不可喻不可思如妙道之存乎人之血肉形體之中而不可析合不可喻思也易不云乎蓍之德圓而神惟其渾淪所以爲道水潛故藴爲五精火飛故達爲五臭木茂故華爲五色金堅故實爲五聲土和故滋爲五味其常五其變不可計其物五其雜不可計然則萬物在天地間不可執謂之萬不可執謂之五不可執謂之一不可執謂之非萬不可執謂之非五不可執謂之非一或合之或離之以此必形以此必數以此必氣徒自勞爾物不知我我不知物五行之在天地間其常五其變不可勝計其物五其雜不可勝計總其綱領則水藴爲五精火達爲五臭木華爲五色金實爲五聲土滋爲五味然萬物在天地間不可勝計皆自五行錯雜而生或合之或離之不可執謂之五不可執謂之萬不可執謂之一又不可執謂之非五非萬非一若分别某物必某數必某氣徒自勞爾故曰物不知我我不知物卽吾心中可作萬物蓋心有所之則愛從之愛從之則精從之蓋心有所結先凝爲水心慕物涎出心悲物淚淚又作血出心愧物汗出無暫而不久無久而不變水生木木生火火生土土生金金生水相攻相尅不可勝數嬰兒蘂女金金又作寶樓絳宫靑蛟白虎寶鼎紅爐皆此物有非此物者存陰符經曰天有五賊見之者昌五賊在心施行於天宇宙在乎手萬物生乎身然則五行之妙用靈哉神哉人患不知其機爾知其機而制之則五賊皆爲吾用而嬰兒蘂女金樓絳宫青蛟白虎寶鼎紅鑪皆見其形而不能隱故曰見之者昌見之者見吾身之精神魂魄凝於神水結而成象現於黃庭之中也是物也猶在腎感愛而爲精在目感悲而爲淚在鼻感風而爲涕在身媿物而爲汗一同是理皆出於心有所之而神水隨應也如幼年所見景物至壯至老猶能夢見終身不忘者卽入於心凝結神水無暫而不久無久而不變也但心有所之與心無所之不同爾若夫擒制五賊鍛鍊五行惟一心不動神水自凝然後五賊見形千變萬化矣是道也雖皆五行之物所化而滅然目有非此五行之物者存乎其中爲之主宰爾鳥獸俄呦呦俄旬旬俄逃逃草木俄茁茁俄停停俄蕭蕭天地不能留聖人不能繫有運者存焉爾有之在彼無之在此鼓不桴則不鳴偶之在彼奇之在此桴不手則不擊聖人觀化所以無化化之運於形氣之間也天地不能留聖哲不能繫今觀夫鳥獸呦呦而鳴旬旬而來逃逃而去與夫草木茁茁而芽停停而茂蕭蕭而枯皆俄然爾化可謂速矣然聖人所以無化者如鼓不桴則不鳴有在彼無在我也桴不手則不擊偶在彼奇在此也前篇曰手不觸刃刃不傷人與此同旨均一物也眾人惑其名見物不見道賢人析其理見道不見物聖人合其天不見道不見物一物皆道不執之卽道執之卽物萬物盈天地間各具一名各具一理見其名而不見其道者爲物所格眾人也析其理而不見其物者能格於物賢人也聖人則不然不見所謂道不見所謂物合其天而已矣若夫指一物謂之道則餘物非道也惟不執之謂之道則物物皆道也若執之以爲道卽物矣知物之僞者不必去物譬如見土牛木馬雖情存牛馬之名而心忘牛馬之實物之眞僞生於識聖人遇物眞者亦僞之去識也眞者且僞之則舉天下之物皆僞矣知天下之物皆僞則何必去物哉如見土木偶形雖有某物之形而心忘某物之實學道之士當對景之時能如是乎朱象先曰籌者何物也籌有形有數有奇有偶故名也繫以八者何剛柔相摩盪爲八卦而變化生焉引而伸之觸類而長之而萬物之差數覩矣故無以觀其妙不可喻也不可思也渾渾爾淪淪爾有以觀其徼則凡五色五聲五臭五氣五味其變不可勝計而不見夫呦呦旬旬逃逃者乎而不見夫茁茁停停蕭蕭者乎而不見夫嬰兒咤女金樓絳宫青蛟白虎寶鼎紅鑪者乎不執之皆道也在彼不在此也執之皆賊也金丹卽毒藥也聖人知其然是以去識而合其天不必見
