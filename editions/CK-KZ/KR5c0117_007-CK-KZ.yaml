body:
  text: 龜磁石鐘鼓舟車之我是我可也不我而我故無物非我我而不我故無物是我故曰我與物不異夢與覺不殊箋六匕七釜篇釜者化也凡十三章道本至無以事歸道者得之一息事本至有以道運事者周之百爲得道之尊者可以輔世得道之獨者可以立我知道非時之所能拘者能以一日爲百年能以百年爲一日知道非方之所能礙者能以一里爲百里能以百里爲一里知道無氣能運有氣者可以召風雨知道無形能變有形者可以易鳥獸得道之清者物莫能累身輕矣可以騎鳳鶴得道之渾者物莫能溺身冥矣可以席蛟鯨有卽無無卽有知此道者可以制鬼神實卽虛虛卽實知此道者可以入金石上卽下下卽上知此道者可以待星辰古卽今今卽古知此道者可以卜龜筮人卽我我卽人知此道者可以窺他人之肺肝物卽我我卽物知此道者可以成腹中之龍虎知象由心變以此觀心可以成女嬰知炁由心生以此吸神可以成爐冶以此勝物虎豹可伏以此同物水火可入惟有道之士能爲之亦能能之而不爲之易曰知變化之道者其知神之所爲乎孟子曰聖而不可知之謂神今天下之學者去聖逾遠望道而未之見覬其庶幾聖人者絶代無聞焉而况不可知之神故言神者例以孔子不語怪力亂神絶之故知道之士絶口不言至於生死之説亦秘而不傳矣且孔子果不言神乎果不言生死乎如曰知死生之説如曰陰陽不測之謂神鼓之舞之以盡神皆孔子之言也今聖人於七釜一篇備言變化之道蓋釜者資水火以變物之器也後世學者觀之不驚其言者鮮矣或者指爲異端僞書宜哉莊子有言曰瞽者無以與乎文章之觀聾者無以與乎鐘鼓之聲豈惟形骸有聾瞽哉夫知亦有之其是之謂歟易不云乎天下之動貞夫一者也卽以事歸道者得之一息之理也以道運事者周之百爲卽能成天下之務一致而百慮也得道之尊獨者可以輔世立我卽輔相天地之宜聖人之大寶曰位也道非時之所能拘非方之所能礙卽通乎晝夜之道而知不疾而速不行而至之謂也可以召風雨侍星辰卽風以散之雨以潤之可與佑神之謂也可以易鳥獸騎鳳鶴席蛟鯨制鬼神則精氣爲物游魂爲變知鬼神之情狀之謂也可以入金石卽兌爲金艮爲石山澤通氣然後能變化成萬物之謂也可以卜龜筮卽卜筮尙占受命如響之謂也學者能知乾坤一闔一闢謂之變則知坎離交遇水火相射山澤通氣雷風相搏之機然後知我之震兌卽他人之肺肝能入震兌之神則可以窺他人之肺肝矣我之魂魄卽龍虎之精英能凝魂魄之氣則可以化腹中之龍虎矣坎之中有嬰兒離之中有姹女能取坎中之實以點離中之虛則女嬰相見各現其形是道也因運神火照入坎中驅逐陰中之陽飛騰而上至神火本位遇陽中之陰擒制交結如金烏搦兎磁石吸針二氣紐結而生變化或現女嬰之象或呈龍虎之形變化萬端飛走不定往來騰躍不出鼎爐當是時則當鼓動巽風助吾離火猛烹極鍛鍊成眞丹凝成至寶是道也其中有觀心吸神二用皆助火候之力者釋氏觀法觀心似是而非方士之服炁嚥津棄本逐末安識運神火以觀眞心鼓巽風以吸眞神之妙用哉丹成之後自然可以伏虎豹可以入水火是皆性命之秘間有形於易書者易不云乎非天下至神至精至變至通其孰能與於此苟非其人道不虛行故曰惟有道之士能爲之聖人欲顯諸仁藏諸用以盡内聖外王之道故曰亦能能之而不爲之人之力有可以奪天地造化者如冬起雷夏造冰死屍能行枯木能華豆中攝鬼杯中釣魚畫門可開土鬼可語皆純氣所爲故能化萬物今之情情不停亦炁所爲而炁之爲物有合有散我之所以行炁者本未嘗合亦未嘗散有合者生有散者死彼未嘗合未嘗散者無生無死客有去來郵常自若列子問至人潛行不窒蹈火不熱行乎萬物之上而不慄何以至此關尹答曰是純炁之守也非智巧果敢之列夫人拘於形則不能變化若夫鍊形爲炁使形盡化炁則聚成形散爲炁矣故能化萬物今觀雲之變化則知炁之變化也且蜃之爲物不靈於人而猶積氣之久可以化樓閣人物以爲海市至於鷹化爲鳩豹變爲虎蜣化爲蟬魚化爲龍鳥獸蟲魚尙能奪天地之造化人反不若何耶以六欲七情内賊其天眞五行六塵外鑠其神氣雖間有知道者能制精葆神鍊形化炁而作輟不常十寒一曝求其純乎化炁雖億兆人中而求一人不可得矣是道也賢愚貴賤皆可爲之其道不遠今之情情不停皆此物也蓋有非此物者存乎其中學者知乎此則知吾之所以行炁者知所以行炁則知所以鍊炁知所以鍊炁則知所以化炁成醕矣是寶也不隨炁合不隨炁散不逐形生不逐形死故曰客有去來郵常自若有誦呪者有事神者有墨字者有變指者皆可以役神御炁變化萬物惟不誠之人難於自信而易於信物故假此爲之苟知惟誠有不待彼而然者人之精神何所不至哉惟昧者不自知爾世有誦呪事神墨字變指之類人以爲神靈蓋信於物而不自信也殊不知彼之神者靈者皆我之至精至誠役之御之而能靈也化書云神猶母也氣猶子也以神召氣如母召子孰敢不至此亦役神御氣之道也苟知爲我之精誠豈區區信於物也哉人之一呼一吸日行四十萬里化可謂速矣惟聖人不存不變天地之大不可以程度計今云一呼一吸日行四十萬里則人一晝一夜凡一萬三千五百息日行五千五日兆里爲一周天昔人以表影長短驗日之行度遠近亦以世之尋丈爲凖旣可以尋丈計則可以步里計矣愚妄以謂日行四十萬里豈得無奇是蓋總其大數爾若果有奇則恐滿五千五百兆里之數則與易之天地之數五十有五合矣日月五星離合順逆聖人皆能測而爲厯而昧者莫不見莫能知也故陰符經云天下莫不見莫能知者是也夫速莫速於大化昔人謂揭天地以趨新負山嶽以舍故造化無斯須不移也萬物無暫忽不變也山川日更矣而世人以爲如昨時世日新矣而世人以爲如故今交一臂而失之者皆在冥中去矣故向者之我非復今我今日之我非復故吾矣是則我與今俱往矣而昧者不知橫謂今日所遇可係而存安知一息之頃而大化已行四十萬里哉惟聖人不逆化而存亦不順化而變故曰不存不變青鸞子千𡻕而千𡻕化桃子五仕而心五化聖人賓事去物豈不欲建立於世哉有形數者懼化之不可知也有形有數者必化在聖人不欲苟免也何則旣謂之形必有數焉非我所有也天地之委蛻也天地且不能停化而形豈能違化哉雖然聖人假眾物以游世對五行以寓形應萬事不敢爲天下先故不爲主而爲賓也御萬物而不爲萬物所役故立於獨而無待也爲賓則如寄寓來去自如爾無待則無耦謂存亡不二爾如是則若形若數豈能拘哉而聖人猶不欲久立於世者視此形軀爲吾大患懼化之不可知也青鸞子古之得道之士也住世千𡻕而千𡻕化卽此意也若夫桃子五仕而心五化者如孔子行年六十而六十化曾子再仕而心再化意同萬物變遷雖互隱見炁一而已惟聖人知一而不化此章意連上章謂有形之物雖互隱見而一炁在天地間未嘗化也一炁猶且不化况吾之非炁者乎何謂非炁炁之所自生者前篇已詳述之矣聖人此章明吾之眞靈若寓於形則雖千年亦化寓於炁則一而不化也爪之生髮之長榮衞之行無頃刻止眾人皆一作能見之於著不能見之於微郭本於此有賢人見之於微而不能任化惟十二字聖人任化所以不化眾人徒見天地日月化行之速此著而易見者也而不知吾之榮衞晝夜之間行陰二十五度行陽二十五度凡一萬三千五百息脈絡之循環運轉無頃刻止故爪之生髮之長無暫忽停此微而難見者也孰能逃之哉惟聖人不存不變在彼自化所以無化室中有常見聞矣旣而之門之鄰之里之黨旣而之郊之山之川見聞各異好惡隨之和競從之得失成之是以聖人動止有戒聖人之聞見未嘗異於眾人眾人之聞見隨處變異而生好惡和競得失之心使聖人異於眾人而隨處不生好惡和競得失之心則有心矣有我矣此賢人不動心之學望聖人而未至者也若夫聖人則出門同人隨人好惡從人和競成人得失如老子之人號亦號人笑亦笑孔子之耳順從心列子從師三年心不敢念是非口不敢言利害從師五年心更言是非口更言利害此皆聖人不異眾人眾人不異聖人之説也何嘗以聞見自異哉聖人之所謹者不妄出戸庭而無咎不妄同人於莽而弗克攻不妄同人於郊而志未得危邦不入亂邦不居特以動止爲戒而已矣譬如大海變化億萬蛟魚水一而已我之與物蓊然蔚然在大化中性一而已知夫性一者無人無我無死無生昔人有言曰魚龍不知水爲命猶人在空中不識空我之與物林然在大化之中性一而已猶蛟魚生於大海之中水一而已知大海爲一水則蛟魚相忘矣知太虛爲一性則人我相忘矣何者爲死何者爲生天下之理是或化爲非非或化爲是恩或化爲讐讐或化爲恩是以聖人居常慮變天下無有不變之事亦無有不變之理聖狂之相去奚啻天淵生死之不齊奚啻氷炭而聖罔念則化作狂狂克念則化作聖生極則化爲殺殺極則化爲生而况是非恩讐之間疑似反覆豈不易變哉昧者執其自是如山之不可移恃其有恩如海之流不竭未幾是化爲非恩化爲讐而前日自是之我山俄而化爲眾非之海恃恩之人海俄而化爲積怨之山如高㟁爲谷深谷爲陵不期變而變也吁可畏哉聖人不執是不辯非不恃恩不念讐平我山夷人海居天下之常慮事物之變未嘗先人而嘗隨人其要無咎而巳矣人之少也當佩乎父兄之教人之壯也當達乎朋友之箴人之老也當警乎少壯之説萬化雖移不能厄我人之處世未免有立身行已應事接物之爲苟有我而自用則一動之頃吉凶悔吝隨之惟有一吉之利而凶悔吝三者厄我矣惟聖人捨已從人當少時卽佩父母之教及其壯也達乎朋友之箴至於老也警其少壯之説是則自少至老未嘗有我萬物雖移安能厄我哉天下之理輕者易化重者難化譬如風雲須臾變滅金玉之性厯久不渝人之輕明者能與造化俱化而不留殆有未嘗化者存輕者人之魂也明者人之神也魂爲木所以輕也神爲火所以明也日出於卯而魂旺日中於午而神旺日晡於申而魂絶日没於亥而神絶是則一日之間而吾之魂神與造化俱化而不留矣惟精與魄重而且暗可以厯久故能胎魂胎神至於來日輕明魂神復自精魄因明因窹而復生復旺矣是則輕而明者假重而暗者爲之母也使魂神絶於申亥之間而精魂壞而不存則來日之魂神無自而生矣知道之士知乎此故鍊精鍊魄爲金爲玉使厯久不渝則吾之魂神可以永久乘負得其所託而長生矣參同契吉人相乘負安穩可長生是則鍊精魄爲金玉則吾身爲大吉之身而乘負吾之魂神矣所以太一火符修鍊金丹只鍊二物者鍊精與魄也并上爲三物爾參同契謂其木三遂不入火二與之俱者木三之魂與火二之神不須鍛鍊不入爐鼎而在爐鼎之外周天運火者乃神與魂也魂三神二合之成五所以能周天運火而不昧精水之一與魄金之四亦合之成五所以能化金液以成丹如是四物俱能成五者實假中宫土五以成變化張悟眞謂只縁彼此懷眞土遂使金丹有返還者此也又曰東三南二同成五北一西方四共之戊已自居本生位三家相見結嬰兒知此理然後知吾身殆有未嘗化者存二幼相好及其壯也相遇則不相識二壯相好及其老也相遇則不相識如雀鴿鷹鳩之化無昔無今人之形體亦天地間一物爾無頃刻不與造化俱化者也幼時之顏貌至壯則異壯時顏貌至老則殊如雀鴿鷹鳩隨四時陰陽之氣變化形體不得自如也安有今昔之同哉然則吾之形容與今俱往矣與物俱化矣可不覺乎朱象先曰釜者何化也變化萬物之器也夫旣謂之物矣曷爲乎化也以同乎物者化之旣同乎物矣烏能化之以異乎物者化之旣異乎物矣烏能化物乎且又烏知夫化物者之不與物俱化乎自其化者而觀之爪之生也髮之長也是或化爲非而恩或化爲仇也不化于形則化於情者也如是卽謂之不化可也聖人知其然是以不逆化而存不順化而變二幼不相識化于壯也而吾之不與壯俱化者不變二壯不相識化于老也而吾之不與老俱化者不變而不見夫情情
