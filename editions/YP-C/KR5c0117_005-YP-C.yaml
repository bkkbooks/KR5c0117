body:
  text: 坎巳土居離天五土爲一五戊巳合則金木會金木會則虎龍交虎龍交則三五合一一者何也太極也造化之根也五行合而爲一則復爲混沌而生生不窮矣由是則萬水可合爲一水萬火可合爲一火萬金可合爲一金萬木可合爲一木可以見精神而久生可以忘精神而超生故曰無人無我無首無尾與天地冥箋四符重刋道藏輯要文始眞經周文始眞人關令尹喜著宋抱一子陳顯微解五鑑篇心蔽一作弊下同吉凶者靈鬼攝之心蔽男女者淫鬼攝之心蔽幽憂者沉鬼攝之心蔽放逸又作逐放者狂鬼攝之心蔽盟詛者奇鬼攝之心蔽藥餌者物鬼攝之如是之鬼或以陰爲身或以幽爲身或以風爲身或以氣爲身或以土偶爲身或以彩畫爲身或以老畜爲身或以敗器爲身彼以其精此以其精兩精相搏則神應之爲鬼所攝者或解奇事或解異事或解瑞事其人傲然不曰鬼于躬惟曰道于躬久之或死木或死金或死繩或死井惟聖人能神神而不神于神役萬物而執其機可以會之可以散之可以禦之日應萬物其心寂然聖人能神神而不神于神眾人神於神而不能神神能神神則曰應萬物其心寂然神于神則心蔽事物而爲鬼所攝鬼亦神之純陰者也故亦無我而附物爲身旣認物爲我身則精存於物物我相搏則神應之故爲鬼所攝者或能瑞異或知吉凶其人傲然自謂得道不悟魔攝久致喪身五行賊之隨類死物如釋教楞嚴所述二十五魔一同是說也在周末之時釋教未入中國已先述於是書矣較之釋經理詳而辭簡然則關尹子書豈一曲之士所能測識邪無一心五識並馳心不可一無虛心五行皆具心不可虛無靜心萬化密移心不可靜借能一則二偶之借能虛則實滿之借能靜則動搖之惟聖人能斂萬有於一息無有一物可役吾之明徹散一息於萬有無有一物可間吾之云爲聖人之心能斂能散斂則會萬有於一息散則敷一息於萬有初不待一之虛之靜之也苟用工於一則不一矣用工於虛則不虛矣用工於靜則不靜矣惟其不用工於一不用工於虛不用工於靜則此心未嘗二未嘗實未嘗動也雖曰斂散何嘗斂散哉如是則日應萬變吾心寂然無一物可役吾之明徹無一物可間吾之云爲聖人以五鑑明心信乎其爲鑑矣火千年俄可滅識千年俄可去火本無我自清濁兆分而來天下未嘗有自生之火也必假人力鑽燧擊石而後生列子曰人生火是也夫火本無體雖燎爇千年而俄頃可滅惟識亦然自胞胎賦形而來此心未嘗先具此識也蓋因根塵取受狃習而後生關尹子曰物交心生識是也夫識本無方雖記認千年而俄頃可去然則滅火易不然難去識易不續難傳曰得道易守道難信哉流者舟也所以流之者是水非舟運者車也所以運之者是牛非車思者心也所以思之者是意非心不知所以然而然惟不知所以然而然故其來無從其往無在其來無從其往無在故能與天地本原不古不今心火也意土也思亦土也故所以思之者是意非心也猶舟流因水車運因牛而心思因意也昔人謂車不行打車卽是打牛卽是今夫心役於思去心卽是去意卽是三教聖人皆主張無意而不主張無心者旨必有在也學者當思念之時推求意之所生則不知其所以然而然故其來無從其往無在如是則意未嘗有意意未嘗有意則思未嘗有思念未嘗有念而無思之思無念之念與天地之本原不古不今而長存矣視夫絶思斷念心如土木者異矣知心無物則知物無物知物無物則知道無物知道無物故不尊卓絶之行不驚微妙之言昔人有言曰若云他是聖自已卻成狂苟遇卓絶之行而尊之聞微妙之言而駭之則循迹而不見道矣蓋道無古今無聖狂無言行前無先達後無作者知乎此則何者爲物何者爲心哉物我交心生兩木摩火生不可謂之在我不可謂之在彼不可謂之非我不可謂之非彼執而彼我之則愚心火也二也故物我交而後心生兩木摩而後火生彼有執以爲心在我或在彼又執以爲火在此或在彼者不然則或以爲非我非彼者皆愚人也烏足以識心哉無恃爾所謂利害是非爾所謂利害是非者果得利害是非之乎聖人方且不識不知而况於爾利害心愈明則親不睦是非心愈明則事不成聖人方且不識不知而况爾所謂利害是非者果得而利害是非之乎夜之所夢或長於夜心無時生於齊者心之所見皆齊國也旣而之宋之魏之梁之晉心之所存各異心無方邯鄲之夢終身榮辱不知厯幾寒暑矣旣覺則黃梁未熟特片時爾心豈有定時耶楚人之子生長楚國引而置之莊獄之問數年雖日撻而求其楚不可得矣心豈有定方耶世有執時執方以求心者安足以識心哉善弓者師弓不師羿善舟者師舟不師奡善心者師心不師聖輪扁斵輪之妙父不可傳於子得之心應之手豈可以師傳哉然則逢學䝉射於羿盡羿之道果盡乎曰使盡羿之道則不思天下惟羿爲愈己也然學聖人者自以爲盡聖人之道者如鼠飮河足厭其量爾今善弓者師弓善舟者師舟以喻善心者師心可謂善喻矣弓則有矢的步力之可師舟則有帆舵風水之可法至於心明則覺昏則昧而已孰從而師之哉雖然學者於動靜語默之間向明覺昏昧處通得一線則心之法有餘師矣是非好醜成敗盈虛造物者運矣皆因私識執之而有於是以無遣之猶存以非有非無遣之猶存無曰莫莫爾無曰渾渾爾猶存譬猶昔游再到記憶宛然此不可忘不可遣善去識者變識爲智變識爲智之説汝知之乎曰想如思鬼心慄思盜心怖曰識如認黍爲稷認玉爲石皆浮游罔象無所底止譬覩奇物生奇物想生奇物識此想此識根不在我譬如今日今日而巳至於來日想識殊未可卜及至來日紛紛想識皆緣有生曰想曰識譬犀望月月形入角特因識生始有月形而彼眞月初不在角胸中之天地萬物亦然知此説者外不見物内不見情天地萬物古今萬事在人胸中如月形生於犀牛之角彼犀不望月而想則角無由而生月矣月形旣存於角中則盡犀之形不可去也以喻人之胷中萬物萬事忘不得遣不得如昔日曾游之景再游則記憶宛然皆識使然也且如今日見某事某物至於來曰所見殊未可卜及乎來曰紛紛想識皆緣有生若夫來日未至事物未有之時此想此識根安在哉然則今日想識皆妄想妄識明矣譬如無鬼思鬼無盜思盜本妄想也而能生慄生怖之妄情認黍爲稷認玉爲石本妄認也而能生眞稷眞石之妄識然則覩奇物見奇事何異夫妄情妄識耶執而有之印於心府可謂不智矣知乎此則知變識爲智之説矣變識爲智則外不見物内不見情物生於土終變於土事生於意終變於意知夫惟意則俄是之俄非之俄善之俄惡之意有變心無變意有覺心無覺惟一我心則意者塵往來爾事者欻起滅爾吾心有大常者存識生於意意生於心善去識者去其識之所生之母而已矣譬如物生於土則終變於土識生於意終變於意事之是非善惡雖以識分辨之而莫不皆隨意變也意在是非則識隨而在是非意在善惡則識隨而在善惡是則子隨母轉也然意雖有變心未嘗變意雖有覺心未嘗覺知心無變無覺則意如塵之往來事如欻之起滅皆不足以動吾心君而我心惟一蓋有大常者存焉爾情生於心心生於性情波也心流也性水也來干我者如石火頃以性受之則心不生物浮浮然後世言性者皆曰性生於心以心爲母性爲子謂如五常之性根于一心皆未達夫眞性之所以爲性三教聖人發明性眞如出一口而賢人膠之爲其所以未入聖域歟孔子言窮理而後盡性理者心也與孟子言盡其心者知其性知其性則知天意同釋氏言明心然後見性故直指人心見性成佛與今言心生於性皆以性爲母心爲子也而尙恐學者未明又以水喻之曰性水也心流也情波也則本末次第厯然易辯矣苟事物來干我而以心應之不亦勞乎天下之事物無窮吾心之精神有限以有限對無窮吾心殆矣惟聖人以性受之則心不生而事物浮浮然不能入吾之靈府矣賢愚眞僞有識者有不識者彼雖有賢愚彼雖有眞僞而謂之賢愚眞僞者繫我之識知夫皆識所成故雖眞者亦僞之人之賢者可慕可重愚者不必慕不必重事物之眞者易留意而難忘事物之僞者不甚着意而易忘所以區別賢愚眞僞者皆識情使然也苟知識情所使則雖賢者亦愚之眞者亦僞之則變識爲智而忘之矣心感物不生心生情物交心不生物生識物尙非眞何况於識識尙非眞何况於情而彼妄人於至無中執以爲有於至變中執以爲常一情認之積爲萬情萬情認之積爲萬物物來無窮我心有際故我之良心受制於情我之本情受制於物可使之去可使之來而彼去來初不在我造化役之固無休息殊不知天地雖大能役有形而不能役無形陰陽雖妙能役有氣而不能役無氣心之所之則氣從之氣之所之則形應之猶如太虛於一炁中變成萬物而彼一炁不名太虛我之一心能變爲氣能變爲形而我之心無氣無形知夫我之一心無氣無形則天地陰陽不能役之郭本有於至無中變成炁八字在猶如太虛之下天地雖大陰陽雖妙能役有形氣者不能役無形氣者而我之一心無形無氣天地陰陽尙不能役而反受制於情受役於物何耶於至無中執以爲有於至變中執以爲常因識生情因情着物物來無窮造化無定使去使來不得自在或者謂我之一心能變爲氣能變爲形旣爲氣矣旣爲形矣役於五行拘於陰陽盛衰往來初不在我造化役之安能自由哉噫如繪塑師幻像鬼神自生怖畏殊不知我之一心本固太虛於一炁中變成萬物而彼一炁不名太虛昧者直以一炁名爲太虛焉能逃天地陰陽之役哉人之平日目忽見非常之物者皆精有所結而使之然人之病日目忽見非常之物者皆心有所歉而使之然苟知吾心能於無中示有則知吾心能於有中示無但不信之自然不神或曰厥識旣昏孰能不信我應之曰如捕蛇師心不怖蛇彼雖夢蛇而不怖畏故黃帝曰道無鬼神獨往獨來瞪目發勞勞久精結故忽見非常之物與彼病目見空中花及第二月無以異也又有心有所歉忽見𡨚尤之形皆無中示有也旣見矣孰能不信如捕蛇之師雖夢蛇不畏者習慣如自然也昔有人居山習定而山精現怪異之形變化百種魔撓其人其人瞑目不視曰汝之伎倆有盡我之不聞不見無窮山精退不復見此卽有中示無惟不信之自然不神也若夫卽吾心中可作萬物而見嬰兒姹女青龍白虎等物者皆自我作之有無在我與忽見非常之物者異矣然聖人覩此猶且見如不見何哉黃帝不云乎道無鬼神獨往獨來是也我之思慮日變有使之者非我也命也苟知惟命外不見我内不見心人之思慮日日不同莫之致而致也孰使之哉命也旣曰命矣則由我乎不由我乎使我命在天則思慮不由我若我命在我則何思何慮故外不見我内不見心譬如兩目能見天地萬物暫時回光一時不見此章當連前章爲一章謂人有思慮譬如兩目能見天地萬物若能目光反照則天地萬物一時不見是則何庸思慮哉但世人知此機者鮮矣目視彫琢者明愈傷耳聞交響者聰愈傷心思玄妙者心愈傷此章亦與上章意連謂目不能反照而視雕琢者明愈傷耳不能反聽而聞交響者聰愈傷心不能無念而思玄妙者心愈傷三章相續其義始圓勿以我心揆彼當以彼心揆彼知此說者可以周事可以行德可以貫道可以交人可以忘我若以我心揆彼則人之識見各各不同人我旣分町畦斯判安能周事哉事且不周况交人乎况行德貫道乎惟以彼心揆彼此聖人無我之學也如是則何事不周何人不交何德不行何道不貫哉天下之理小不制而至於大大不制而至於不可制故能制一情者可以成德能忘一情者可以契道天下之事無不起於小而至於大學者但知防患於微而不知制情於微能制一情可以成德能忘一情可以契道制一情者謂情始萌卽制伏之使不致於爲惡故可成德忘一情者情未萌也情旣未萌則不待忘而忘之矣情忘心空故可契道也朱象先曰心蔽於物則物物足以役心而五行賊之隨類死物非死於物也死於心也惟聖人能神神而不神於神是以日應萬物其心寂然易曰寂然不動感而遂通謂惟寂而後能應也茲何以隨應而隨寂哉以能一心應之二而不寂以能虛心應之實而不寂以能靜心應之動而不寂夫寂者心體也卽物體也凡有應而不能寂者非心也非物也識也有彼我識而是非利害之意生有聖凡識而師羿師奡之意生有常變識而無中示有有中示無往來起滅之意生識生意意復生識如水之流舟如牛之運車又如犀牛之意在月而月形之入角者不能除故曰欲去千年之識者亦去其俄頃
