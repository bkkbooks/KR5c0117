body:
  text: 葛稚川愛之誦之藏之拜之哉有宋寶祐二年𡻕在甲寅重陽日抱一子陳顯微字道焚香再拜謹序序右新書著定關尹子九篇護左都水使者光祿大夫臣劉向言所校中秘書關尹子九篇臣向校讐太常存七篇臣向本九篇臣向輙除錯不可考增闕斷續者九篇成皆殺青可繕寫關尹子名喜號關尹子或曰關令子隱德行人易之嘗請老子著道德經上下篇列禦寇莊周皆稱道家書篇皆寓名有章章首皆關尹子曰四字篇篇序異章章義異其旨同辭與老列莊異其歸同渾質崖戾汪洋大肆然有式則使人冷冷輕輕不使人狂蓋公授曹相國參曹相國薨書葬至孝武皇帝時有方士來以七篇上上以仙處之淮南王安好道聚書有此不出臣向父德因治淮南王事得之臣向幼妤焉寂士清人能重愛黃老清靜不可闕臣向昧死上永始二年八月庚子護左都水使者光祿大夫臣向謹進上序洪體存蒿艾之質偶好喬松之夀知道之士雖微賤必親也雖夷狄必貴也後遇鄭君思遠鄭君多玉笈瓊笥之書服餌開我以至道之良藥呼吸洗我以紫清之上味後屬洪以尹眞人文始經九篇洪愛之誦之藏之拜之宇者道也柱者建天地也極者尊聖人也符者精神魂魄也鑑者心也匕者食也釡者化也籌者物也藥者雜治也洪每味之冷冷然若躡飛葉而遊乎天地之混溟茫茫乎若履橫杖而浮乎大海之渺漠超若處金碧琳琅之居森若握鬼魅神姦之印倏若飄鸞鶴怒若鬬虎兕清若浴碧慘若夢紅擒縱大道渾淪至理方士不能到先儒未嘗言可仰而不可攀可玩而不可執可鑒而不可思可符而不可言其忘物遺世者之所言乎其絕跡去智者之所言乎其同陰陽而冥彼此者之所言乎何如此之尊高何如此之廣大又何如此之簡易也洪親受之咸和二年五月朔丹陽葛洪稚川序總序抱一子曰宇者盡四方上下之稱也故以一宇冠篇首謂無是宇則無安身立命之地道則遍四方上下無不在焉無是道則天地造化或幾乎廢矣故一宇者道也宇旣立不可無柱故以二柱次之柱者建天地也天地定位聖人居中聖人者道之體也聖人建中立極故以三極次之三才旣立四象位焉故以四符次之符者契神之物故爲精神魂魄五居數之中心居人之中故以五鑑居中以明眞心能照也然無形則心無所寓故以六七次之七者食也食以養形故形食一體形久則化故以七釡次之釡者變化萬物之器也釡中不可無物故以八籌次之籌者物也物物可爲藥藥可以雜治故以九藥終之九者出列子究也盡也物至於爲藥功用極矣然藥之功復能活人有復生之理以明萬物皆具是氣是性可以生物不逐形盡也故以藥終焉凡九篇共一百七十章
