body:
  text: 可言故無可示是以學道者貴於冥情而無爲有情有爲所以之人也以言行學識求道者也捨源求流捨本求末是射御琴弈之類也事也非道也無情無爲所以之天也因彼而行我不自行因彼而守我不自守無人無我無得無失契同實忘異名謂之知天盡神可也謂之致命造玄亦可也是眞可以一日死者也又何所歉而借於聖又何所恃而賈於愚哉箋一宇二柱篇柱者建天地也凡十一章若椀若盂若瓶若壺若甕若盎皆能建天地兆龜數蓍破瓦文石皆能告吉凶是知天地萬物成理一物包焉物物皆包之各不相借以我之精合彼之精兩精相摶而神應之一雌一雄卵生一牡一牝胎生形者彼之精理者彼之神愛者我之精觀者我之神愛爲水觀爲火愛執而觀因之爲木觀存而愛攝之爲金先想乎一元之氣具乎一物執愛之以合彼之形冥觀之以合彼之理則象存焉一運之象周乎太空自中而升爲天自中而降爲地無有升而不降無有降而不升升者爲火降者爲水欲升而不能升者爲木欲降而不能降者爲金木之爲物鑽之得火絞之得水金之爲物擊之得火鎔之得水金木者水火之交也水爲精爲天火爲神爲地木爲魂爲人金爲魄爲物運而不已者爲時包而有在者爲方惟土終始之有解之者有示之者天地者萬物父母也萬物生於天地而各具天地之體而微也具是體則具是理雖椀盂瓶盎皆有天地龜蓍瓦石皆存吉凶物之無情者尙爾況氣血有情者乎況人爲萬物之靈者乎精神摶應形理愛觀執存因攝而生生不窮矣非天下之至遠其孰能與於此人徒知神爲天而精爲地而不知神火自地升精水自天降欲升不升者爲木爲人欲降不降者爲金爲物金木者水火之交故各具水火之性運而不已四時生焉包而有在四方立焉四時旣生四方旣立則大中成焉大中成則土爲尊矣故始之終之解而分之示而顯之皆中土之功也自夫大中之氣周乎太空則天自中而升地自中而降而天地之形分矣無有升而不降無有降而不升自上下下自下上上之精神也故人之髮根在首而四肢垂下魂神自天而降也草木之根茹在下而枝莖向上精魄自地而升也禽獸橫生則根亦在尾矣故雖具血氣之情而雜金木之性五行交雜則蠢動蟲蟲異禀異根有不可勝窮者矣天下之人蓋不可以億兆計人人之夢各異夜夜之夢各異有天有地有人有物皆思成之蓋不可以塵計安知今之天地非有思者乎夢中天地人物與覺時天地人物有以異乎無以異乎皆思成之乎非思成之乎嬰兒未解思念之時彼見天地人物亦不知爲天地人物也謂之天地人物者係乎識爾嬰兒未識之時能夢天地人物乎彼初見之恐亦未識久而後凝心水印之夢斯著矣猶如玉石鱗角之中有山川星月凝而結秀則形狀具存也然則鱗角有思乎玉石有思乎知鱗角玉石之思則知天地之思矣心應棗肝應榆我通天地將陰夢水將晴夢火天地通我我與天地似契似離純純各歸天地形之大者也人身形之小者也自形觀之則有小大之辯自神觀之則無離契之分天之日月明暗卽人之精神盛衰豈特陰夢水晴夢火哉地之五味藥石卽人之五藏好惡豈特心應棗肝應榆哉我與天地一乎二乎同歸乎各歸乎天地雖大有色有形有數有方吾有非色非形非數非方而天天地地者存生生者未嘗生死死者未嘗死是則天天者非天地地者非地也人徒見有形色數方者謂之天而不知非形色數方者能天天能地地能生生能死死也學者識認得眞體會得實然後知不可以名言不可以形似昔人謂非心非物離性離相寒山子謂之天中之天亦强名也何可云謂哉死胎中者死卵中者亦人亦物天地雖大彼固不知計天地者皆我區識譬如手不觸刃刃不傷人識識易去識難稚年一見皓首不忘識之粘縳於人如此可畏哉彼死胎中死卵中者不見天地固矣然在胎在卵之時有識性乎無識性乎苟無識性則胡爲而在胎在卵然則在胎在卵之中果有天地乎果無天地乎釋氏以識爲五陰之最微者以其難忘也使無識則不生矣不生則不中胎卵溼化之陰矣今日計有天地者皆我區識自計之天地何嘗期人之識哉故曰手不觸刃刃不傷人夢中鑑中水中皆有天地存焉欲去夢天地者寢不寐欲去鑑天地者形不照欲去水天地者盎不汲彼之有無在此不在彼是以聖人不去天地去識天地有大恩於人亦有大盜於人知其盗則不爲其所盗矣天地本不盜人而人自盜之何則胸中之天地萬物始如夢見中如鑑照終凝於神水至死不能忘其爲盜豈勝言哉然夢因寐鑑因照水因汲汲者取也夢生於視視生於取取生於識故曰不去天地去識言天地則萬物在其中矣天非自天有爲天者地非自地有爲地者譬如屋宇舟車待人而成彼不自成知彼有待知此無待上不見天下不見地内不見我外不見人天不自天所以天長地不自地所以地久使人不自人我不自我則可以同天地之長久矣天地果待人而成乎待人而成者成夫人之胸中之天地爾待固在彼成不成在我故不爲天地者上不見天下不見地内不見我外不見人有時者氣彼非氣者未嘗有晝夜有方者形彼非形者未嘗有南北何謂非氣氣之所自生者如搖箑得風彼未搖時非風之氣彼巳搖時卽名爲氣何謂非形形之所自生者如鑽木得火彼未鑽時非火之形彼巳鑽時卽名爲形氣不能生氣生氣者非氣也形不能生形生形者非形也或曰氣不能生氣則不問敢問形不能生形則人與萬物以形生形非乎曰枯木死屍亦形也能生形乎今人與萬物以形生形者蓋有非形者存乎其中雖金石草木莫不皆然故聖人獨以火而喻之以明形之最精者猶若是況形之麄者哉非氣者搖動則生氣非形者鑽磨則生形氣者天也有時也有晝夜也形者地也有方也有南北也世有剋時日擇方嚮以求生氣生形者焉知時在天地未判之先方乃自然南嚮之位也歟寒暑温涼之變如瓦石之類置之火卽𤍠置之水卽寒呵之卽温吸之卽涼特因外物有去有來而彼瓦石實無去來譬如水中之影有去有來所謂水者實無去來愚解參同契嘗曰天地不能晝夜也以日月往來而爲晝夜天地不能寒暑也以日月遠近而爲寒暑也此言寒暑之常也若夫盛夏寒風三冬暴鬱此不正之氣非時之風倏往忽來非天地有爲也客氣往來爾故曰如水中影有去有來所謂水者實無去來衣搖空得風氣噓物得水水注水卽鳴石擊石卽光知此說者風雨雷電皆可爲之蓋風雨雷電皆緣氣而生而氣緣心生猶如内想大火久之覺𤍠内想大水久之覺寒知此說者天地之德皆可同之人之精神魂魄猶天之風雨雷電風雨雷電出於天而人且能爲之而自已之精神魂魄豈不能自生自養自葆自鍊乎知搖空得風則鼓吾槖籥可以生氣知噓物得水則胎吾之氣可以化精知注水則鳴則鍊吾之精可以制魄知擊石卽光則鍛吾之魄可以益神是則觀天之道執天之行而陰符之制在氣而氣之制在心想火則𤍠想水則寒潛天而天潛地而地千變萬化無不可爲矣德同天地信哉五雲之變可以卜當年之豐歉八風之朝可以卜當時之吉凶是知休咎災祥一氣之運耳渾人我同天地而彼私智認而巳之五雲八風有災有祥皆人氣之運而預見休咎於天地者也炁之爲炁神矣哉靈矣哉而昧者不知也一人感之而五雲爲之變八風爲之遷蓋有至靈至神者存乎其中如是則曰人曰我曰天曰地莫不貫通而私智認爲已有安知虛徹靈通大同之道哉天地寓萬物寓我寓道寓苟離於寓道亦不立寓者在巳無居之謂也昔人謂人生天地間如白駒之過隙忽然而已非寓而何我寓則天地寓天地非自成待我天天地地而成也故我寓則天地寓天地寓則萬物寓我與天地萬物皆寓矣而道獨不寓而長存焉則我與道爲二矣道何立哉其人存則其道存其人亡則其道息故曰苟離於寓道亦不立朱象先曰天地一形氣也若椀若盂若瓶皆天地也胎中卵中夢中鏡中水中皆天地也有所以天天地地者非形非氣而寓於形氣非色非數而寓於色數無上無下而寓於上下無内無外而寓於内外無人無我而寓於人我無去無來而寓於去來故必冥思去識似契似離而後可以渾人我同天地箋二柱三極篇極者尊聖人也凡二十七章聖人之治天下不我賢愚故因人之賢而賢之因人之愚而愚之不我是非故因事之是而是之因事之非而非之知古今之大同故或先古或先今知内外之大同故或先内或先外天下之物無得以累之故本之以謙天下之物無得以外之故含之以虛天下之物無得以難之故行之以易天下之物無得以窒之故變之以權以此中天下可以制禮以此和天下可以作樂以此公天下可以理財以此周天下可以禦侮以此因天下可以立法以此觀天下可以制器聖人不以一已治天下而以天下治天下天下歸功於聖人聖人任功於天下所以堯舜禹湯之治天下天下皆曰自然老子曰功成事遂百姓皆謂我自然此去我字更微天無爲而萬化成聖人無爲而天下治聖人何心哉人徒見夫制禮作樂理財禦侮立法制器周濟曲成而不遺將謂聖人物物思之事事計之而以一已之智力當天下之事物也殊不知聖人本之以謙含之以虛行之以易變之以權因人之賢而賢之因人之愚而愚之因是是之因非非之不以古今而先後其心不以内外而輕重其事而以天下治天下也天下歸功於聖人聖人不自以爲功而任功於天下是道也堯舜禹湯得之故皆曰自然天無不覆有生有殺而天無愛惡日無不照有妍有醜而日無厚薄聖人猶天也物有生殺天無愛惡聖人猶日也物有妍醜日無厚薄是蓋聖人無爲無心之治也聖人之道天命非聖人能自道聖人之德時符非聖人能自德聖人之事無爲非聖人能自事是以聖人不有道不有德不有事聖人無我故道以天命不自有道也德以時符不自有德也事以人爲不自有事也彼執有道有德有事者庸人爾焉能忘我哉聖人知我無我故同之以仁知事無我故權之以義知心無我故戒之以禮知識無我故照之以智知言無我故守之以信聖人之五常亦猶眾人之五常夫豈異於人哉特眾人之五常未能忘我而聖人之五常本於無我此其所以異乎人矣仁無我則同天下之我以爲仁義無我則權天下之事以爲義禮無我則戒天下之心以爲禮智無我則照天下之識以爲智信無我則守天下之言以爲信此其所以不可跂及歟聖人之道或以仁爲仁或以義爲仁或以禮以智以信爲仁仁義禮智信各兼五者聖人一之不膠天下名之不得以仁爲仁天下之人能與知而與行至於以義以禮以智以信爲仁則非天下之至聖其孰能與於此何則舉一常而五常備互換循環各兼五者視賢哲之士厚於仁而薄於義智有餘而信不足者大有徑庭也易曰仁者見之謂之仁智者見之謂之智然則聖人之道渾渾淪淪何可得而名狀哉故曰聖人一之不膠天下名之不得勿以行觀聖人道無蹟勿以言觀聖人道無言勿以能觀聖人道無爲勿以貌觀聖人道無形道無形無跡無言無爲學者何從而求之哉不巳則求諸聖人聖人者道之體也然果可求之於聖人乎求之於聖人者不過言貌行能而已愈失之矣捨言貌行能之外何從而求觀聖人哉善觀聖人者觀其心而不觀其跡然則聖人之心果可觀乎果不可觀乎果異於吾心乎果不異於吾心乎前章有言曰不借道於聖此之謂也行雖至卓不離高下言雖至公不離是非能雖至神不離巧拙貌雖至殊不離妍醜聖人假此以示天下天下冥此乃見聖人聖人本無言行貌能不得已而假此以示天下人徒見聖人言之工貌之殊行之卓能之神而謂道在夫四者之間而有是非妍醜高下巧拙之辨愈不足以識聖人矣學者冥此而於四者之外而觀之斯善學矣聖人師蜂立君臣師蜘蛛立網罟師拱鼠制禮師戰蟻置兵眾人師賢人賢人師聖人聖人師萬物惟聖人同物所以無我眾師賢賢師聖聖師萬物固矣然則聖人果師蜂立君臣師蛛鼠蟻而置網禮兵乎聖人同物置作無我天下之物皆聖人之師也物生自然聖人師其自然而已矣聖人何心哉聖人曰道觀天地人物皆吾道倡和之始終之青黃之卵翼之不愛道不棄物不尊君子不賤小人賢人曰物物物不同旦旦去之旦旦與之短之長之直之方之是爲物易也殊不知聖人鄙雜厠別分居所以爲人不以此爲已聖人道則如之紛事則如碁之布聲倡倡之聲和和之事始始之事終終之色青青之色黃黃之物卵卵之物翼翼之無愛道無棄物不尊君子不賤小人此則道如紛也至於
