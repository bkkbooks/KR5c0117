body:
  text: 物而物不隱也不必去物而物不留也如桴鼓鼓鳴桴停鼓寂手桴桴擊手止桴懸近無我也遠無彼也往無古也來無今也合萬爲五合五爲一合一爲虛窈窈冥冥仍歸渾淪釜且不立籌於何有箋八籌九藥篇藥者雜治也凡三十一章勿輕小事小隙沈舟勿輕小物小蟲毒身勿輕小人小人賊國能周小事然後能成大事能積小物然後能成大物能善小人然後能契大人天旣無可必者人人又無能必者事惟去事離人則我在我惟可卽可未有當繁簡可當戒忍可當勤惰可勤惰又作動靜此一篇皆藥石之言所以謂之雜治也蓋人之處世未能去事離人則應事接物之際一動一止有吉凶悔吝存焉聖人欲人避凶就吉免悔吝之虞故垂藥石之訓使人服膺而對治之非大聖大智其孰能如是哉且夫天旣無可必者人人又無能必者事其敢輕小人輕小物輕小事哉孔子曰人心險於山川難於知天天猶有春秋冬夏旦暮之期人者厚貌深性其就義若渴者其去義若熱者豈可測哉世之輕小人易小物忽小事而至於敗國亡家喪身失命者多矣故聖人謂能善小人然後能契大人能積小物然後能成大物能周小事然後能成大事無非自小以至大自微以至著而不敢以其小物小人小事而輕忽之也聖人之待小者且加之謹况其大者乎天下之理未有當繁之事可以簡能了者亦未有當戒之事可以强忍爲之者亦未有當勤之事可以慵惰成之者故於人於世惟可則可惟不可則不可故於事無可無不可初何固必哉是則聖人雖日應萬物而不着事不着物而我在我矣智之極者知智果不足以周物故愚辯之極者知辯果不足以喻物故訥勇之極者知勇果不足以勝物故怯天下之理爭之則不足遜之則有餘聖人之大智若愚大辯若訥大勇若怯者豈姑爲是僞行哉蓋知夫智果不足以周物故愚辯果不足以喻物故訥勇果不足以勝物故怯爾傳曰其愚不可及則智不如愚十語九中不如一默則辯不如訥柔能制剛弱能勝强則勇不如怯天地萬物無一物是吾之物物非我物不得不應我非我我不得不養雖應物未嘗有物雖養我未嘗有我勿曰外物然後外我勿曰外形然後外心道一而已不可序進善應物者無物善養我者無我有物則不能應物有我則不能養我何則物非我物我非我我纔外物便是外我纔外我便是外心若作内觀其心外觀其形遠觀其物則分心我物爲三未免序進也道一而已直下便見不勞分别一空總空何必序進哉諦毫末者不見天地之大審小音者不聞雷霆之聲見大者亦不見小見邇者亦不見遠聞大者亦不聞小聞邇者亦不聞遠聖人無所見故能無不見無所聞故能無不聞人有所見則有所不見有所聞則有所不聞非神有所限而精有所量也用吾精神不得其道爾殊不知凡天地萬物之妙者皆吾之神凡天地萬物之有者皆吾之精夫如是則聖人無所見乃能無所不見無所聞乃能無所不聞學者知之乎目之所見不知其幾何或愛金或愛玉是執一色爲目也耳之所聞不知其幾何或愛鐘或愛鼓是執一聲爲耳也惟聖人不慕之不拒之不處之是章義連前章之旨聖人慮學者不知無所見無所聞爲大也姑以所聞所見喻之如目之所見不知其幾何色而視某物者執某色以拘其見耳之所聞不知其幾何聲而聽某響者執某聲以拘其聞惟聖人不慕彼之聲色不拒彼之形響不處吾之見聞則吾之見聞大矣善今者可以行古善末者可以立本學者欲行古道必善今俗欲返本源須知末務苟生於今之世而違今之俗則害生矣只知有本源而不知有末務則難立矣故聖人和光同塵以善今泛應曲當以善末者乃所以爲行古道立本源之地也歟狡勝賊能捕賊勇能虎能捕虎能克己乃能成己能勝物乃能利物能忘道乃能有道賊以狡勝虎以勇勝固矣然則已以何克哉已者我身也克者能勝也知我身本何物則知所以克之之道矣學者當觀我本無已因七情六欲縁合而生欲克我身先克情欲前章不云乎能制一情可以成德能忘一情者可以契道此聖人成已之學也旣能成已矣然後能利物茍有一物存乎吾前則爲物勝矣焉能利物哉旣能成已又能利物可以造道矣然則道可忘矣道未能忘焉能有道函堅則物必毁之剛斯折矣刀利則物必摧之銳斯挫矣威鳳以難見爲神是以聖人以深爲根走麝以遺香不捕是以聖人以約爲紀堅則毁矣銳則挫矣以深爲根以約爲紀皆老子之言而關尹子復以函刀鳳麝以發明老子之言使學者盡守柔取虛韜光無藏之理以曲全免咎而已豈非藥石之言乎瓶有二竅以水實之倒瀉閉一則水不下蓋不升則不降井雖千仞汲之水上蓋不降則不升是以聖人不先物夫滿水於瓶閉一竅而倒瀉不下者何哉蓋水之氣不宣達而上升則水亦不能下降矣與夫井之水俯而汲之水可上出不汲則亦不升矣聖人懷道抱德人能升進上求則必俯而接之不求則無由與之矣此不升則不降也聖人懷經濟之心雖才超伊吕非侯王屈己降志亦無由而强化矣此不降則不升也瓶以升而後降井以降而後升也聖人取物爲則迫而後動感而後起此聖人不爲天下先乃所以爲天下先也人之有失雖己受害於已失之後久之竊議於未失之前惟其不恃已聰明而兼人之聰明惟其無我而兼天下之我終身行之可以不失使睿智聰明如虞舜猶不自恃而捨已從人况餘人乎世人於旣失受害之後平心自思公言自議所以受禍之端皆恃一已之聰明罔人忽理而致之也旣知旣悔聰明何恃焉往者不可以追矣而來者猶可爲也惟屈己持謙以貴下賤不恃己能不執我見納天下之聰收天下之明兼天下之我用天下之智終身行之故無再失如勾踐保國於會稽受辱之後秦穆納言於崤函敗師之年皆其類也古今之俗不同東西南北之俗又不同至於一家一身之善又不同吾豈執一豫格後世哉惟隨時同俗先機後事捐忿塞慾簡物恕人權其輕重而爲之自然合神不測契道無方隨時同俗先機後事捐忿塞慾簡物恕人是數者與孔子翼易隨時同人知幾成務懲忿窒慾易簡恕忠之言頗同而學者不知謂道家之學獨尙無爲是則將謂聖人執一豫格後世聖人何心哉古今四方一家一身俗尙雖各不同而聖人權其輕重而爲之制可從先進則從先進可拜下則拜下惟其無可無不可所以合神不測契道無方也孔子不云乎竊比於我老彭然則孔老之道其可以異觀乎有道交者有德交者有事交者道交者父子也出於是非賢愚之外故久德交者則有是非賢愚矣故或合或離事交者合則離道交者聖人也德交者君子也事交者眾人也聖人之交抱道德之至純故天下和同譬如父子天親不得以是非賢愚而離間也若夫賢人君子之交必以德義相合聲氣相同故賢則親愚則疎是則合非則離不出乎賢愚是非之域矣小人之交非勢利不交也有故而合有故而離莊子曰以利合者迫窮禍患害相棄也其斯之謂歟勿以拙陋曰道之質當樂敏㨗勿以愚暗曰道之晦當樂輕明勿以傲易曰道之高當樂和同勿以汗漫曰道之廣當樂急要勿以幽憂曰道之寂當樂悅豫古人之言學之多弊不可不救古人之言教不止一端在當時有禽滑釐宋缾尹文彭䝉田駢愼到墨翟諸家之學今其言不傳至孟子之時止有楊墨二家之言則知禽宋尹彭田愼之言至關尹仲尼之時已拒絶之矣敏㨗者如今之禪學問答所以尙口㨗給也輕明者如今之騰身踴躍習觀之類也和同者如西域教之六羣和合也要急者如今之參一句話頭以求頓悟也悅豫者如今之放逸曠達逍遙自在也是數者雖非當時古人之教而其事大率相類學之多弊亦不可不救也不可非世是已不可卑人尊已不可以輕忽道已不可以訕謗德已不可以鄙猥才已非世者世亦非之禍也卑人者人亦卑之辱也遇輕忽而能忍自以爲已有道淺也遇訕謗而不辯自以爲已有德驕也至於逢鄙猥之人自以爲已有才繆也是五者皆學者之病也宜自藥之困天下之智者不在智而在愚窮天下之辯者不在辯而在訥郭本章末有伏天下之勇者不在勇而在怯二句人之多智多辯者病也人之能愚能訥者藥也智不能困天下之智辨不能窮天下之辯以智攻智以辯敵辯如以火止火以水止水爾奚益哉昔南唐選博學辯給之使使本朝我太祖選不識字至愚至訥武夫對之使辯博之使技無所施卽此道也天不能冬蓮春菊是以聖人不違時地不能洛橘汶貉是以聖人不違俗聖人不能使手步足握是以聖人不違我所長聖人不能使魚飛鳥馳是以聖人不違人所長夫如是者可動可止可晦可明惟不可拘所以爲道天下道術或尙晦或尙明或尙動或尙止皆自然之理也聖人觀天之道以時吾神之晦明察地之利以宜吾形之動止近取諸身旣如是則遠示之人亦莫不然是則神宜明則明之神宜晦則晦之形宜動則動之形宜靜則靜之爾吾之手不能步足不能握猶魚不能飛禽不能馳也天猶不可使冬蓮春菊地猶不可使洛橘汶貉而况違我所長乎而况違人所長乎苟違其形神之所長而强爲之斯害也已道安在哉少言者不爲人所忌少行者不爲人所短少智者不爲人所勞少能者不爲人所役多言則爲人所忌多行則爲人所短多智則爲人所勞多能則爲人所役皆悔吝也可不謹哉操之以誠行之以簡待之以恕應之以默吾道不窮應事接物不可不誠不誠則喪德故於誠則操而存之不可不簡不簡則勞神故於簡則行而宜之不可不恕不恕則忿不懲不可不默不默則機不密盡是四者吾道何窮哉謀之於事斷之於理作之於人成之於天事師於今理師於古事同於人道獨於已謀今之事當以今之事爲師如善弓者師弓不師羿善舟者師舟不師奡其式則不遠也斷事之理當以古人爲師古人聖人揆理曲盡非今人所及也事作於人不得不與人同其好惡也旣謂之事矣作之於人成之於天在我何敢固必哉若夫道則在我獨行而已矣金玉難捐土石易捨學道之士遇微言妙行愼勿執之是可爲而不可執若執之則腹心之疾無藥可療學者得一善言聞一善行則拳拳服膺而毋失可謂好學矣殊不知此可以成德不可以入道道則靈臺皎潔一物不留庶可晞覬若遇微言妙行執之於心是爲腹心之疾無藥可療何則土石易捨金玉難捐微言妙行入人心府終身不忘昔人謂一句合頭語萬劫繫驢椿信哉人不明於急務而從事於多務他務奇務者窮困災厄及之殊不知道無不在不可捨此就彼心外别無道道外別無心是道也散在萬物而聚見於人心是心也昭昭於日用之間起居食息無不在也故心爲學者之急務古人修心無剪爪甲工夫蓋時不待人不容緩也苟得其修大而化之而爲聖苟不得其修則流之於卵胎濕化舉諸世事復有大於此者乎世之學者賤常貴異急於所緩緩於所急貪多尙奇而從事於外務縱使得之遇窮困災厄且不能免况度世乎南華有言以隨侯之珠彈千仞之雀其捨此就彼棄重就輕倒置如是悲夫天下之理捨親就疎捨本就末捨賢就愚捨近就遠可暫而已久則害生此章又重發明上章之旨謂學者亦有捨親就疎捨本就末捨賢就愚捨近就遠而於道有所得者可暫而已久則害生昔之論道者或曰凝寂或曰邃深或曰澄澈或曰空同或曰晦冥愼勿遇此而生怖退天下至理竟非言意茍知非言非意在彼微言妙意之上乃契吾說自古聖賢立言垂訓所尙不同同歸於道有言凝然寂默者有言澄湛虛徹者有言空無太同者有言晦冥息滅者學者遇此勿生退怖道不在言意言意豈能盡道耶在彼微言妙意之上乃契聖人之說聖人大言金玉小言桔梗芣苢用之當桔梗芣苢生之不當金玉斃之聖人之言精者如金如玉麤者如梗如苢昔人謂細語及粗言皆歸無上道有因粗言而悟道者有言細語而不悟者如用藥之當服草木生之不當服金玉斃之安取乎藥之貴賤哉惟其當而已矣言某事者甲言利乙言害丙言或利或害丁言俱利俱害必居一於此矣喻道者不言道與事不同事則有利有害故言事則有某言中利某言中害之理至於言道則終無某言中道某言不中道之理故善喻道者不言事有在事言有理道無在道言無理知言無理則言言皆道不知言無理雖執至言爲梗爲翳道與事相反如水火晝夜之不侔也學者言道如言事則誤矣言事則事有所在故事之言有理也言道則無在無不在則道之言安有所謂理哉若知夫道無理可言則言言皆道不然則雖執至言爲梗爲翳而已不信愚人易不信賢人難不信賢人易不信聖人難不信一聖人易不信千聖人難夫不信千聖人者外不見人内不見我上不見道下不見事學道自信門入信苟不篤道無由而入矣然而信聖賢易信狂愚難信至狂愚則吾之信可謂篤矣然吾之所謂信者非世人之所謂信也世人之所謂信者信之信也吾之所謂信者不信之信也若夫不信狂愚之人則世人皆能信吾之不信也至於不信賢人則世人未必信吾之不信也况乎至於不信聖人則豈世人信其不信者乎又况乎至於不信千萬聖人此則世人尤其難信之法也惟能信吾不信千萬聖人者其信可謂眞信矣斯人也其亦外不見人内不見我上不見道下不見事者也聖人言䝉䝉所以使人聾聖人言冥冥所以使人盲聖人言沈沈所以使人瘖唯聾則不聞聲唯盲則不見色唯瘖則不音言不聞聲者不聞道不聞事不聞我不見色者不見道不見事不見我不音言者不言道不言事不言我昔有學者問於其師曰有一人負盲聾瘖三者之病來見於師師何以發藥師曰汝近前來學者近前而立師以掌示之曰此何物曰掌師叱曰汝非三種病人矣噫是人聞師語而近前則不聾矣能見掌則不盲矣曰掌則不瘖矣然其人始發問端似知此理及乎被師一勘則本情露矣參同契曰耳目口三寶塞固勿發通陰符經云九竅之邪在乎三要可以動靜與此同旨嗚呼安得不聞聲不見色不音言者與之默會哉人徒知僞得之中有眞失殊不知眞得之中有眞失徒知僞是之中有眞非殊不知眞是之中有眞非天下學者皆知僞得之中有眞失僞是之中有眞非故求眞得以爲得眞是以爲是也殊不知道無得失無是非纔有得失有是非則是事也非道也如人學道而忽遇異景異物而橫執以爲眞得眞是者往往多遭魔攝而不悟其爲眞失眞非矣言道者如言夢夫言夢者曰如此金玉如此器皿如此禽獸言者能言之不能取而與之聽者能聞之不能受而得之惟善聽者不泥不辯此一喻最善與人說道誠如說夢說者曰吾夢極富貴聽者曰吾且不見吾且不知説者曰吾眞有是夢不可不信聽者曰吾旣不見不知何以生信説者不能取而示之則曰聽者不智聽者不能得而見之則曰説者不實如是則説者言之不如不言聽者聽之不如不辯昔人謂知道易不言難聞道易默會難故善聽者不於言下求道惟默會其言外之旨可也茍泥其言而辯其實烏足以爲善聽善學者哉關尹子特於篇末垂此章爲訓者蓋欲學者觀此玄言不泥不辯惟領會其言外之旨而已矣圓爾道方爾德平爾行銳爾事道不圓則不神德不方則不正行不平則不常事不銳則不利關尹子述微言妙義旣終又慮學者或志於道而忘德或立德而遺行或積行而廢事是則知務本而不知務末未有不因末而害本者也世固有因事之失而虧行者亦有因行之虧而損德者亦有因德之損而妨道者學者豈可只知從事於道而不資德行以相扶助哉又豈可只知積德累行而遇事不加謹哉世亦有志於道而闡提德行與夫失業廢事者安知聖人立言垂訓體用畢備本末具陳如此詳悉耶噫關尹子大聖人慈憐後世之心至矣盡矣不可思議矣學者可不勉旃朱象先曰藥者何瀹也治也九者何究也盡也陽盡於九而陰可復也藥盡於九而生無窮也雖然物物而治之不勝藥矣物物而藥之不勝治矣又何以合神不測而契道無方乎聖人曰道本無藥也凡宇宙間物我之相與夫是非得失智愚勇怯之數執之皆病不執之皆藥也是以下藥藥物中藥藥我上藥藥心何以明其然也執一聲爲耳病不在耳也執一色爲目病不在目也是舍本而就末者也聖人於是乎有不先物之藥藥今而以古也藥同而以獨也藥人而以天也若是足以明我乎未也微言非言也妙意非意也泥微言妙行而眞得之眞是之猶執夢中之言而器皿之禽獸之也故曰雖應物未嘗有物雖養我未嘗有我夫旣外不見物内不見我矣方圓與平銳均也庸愚與聖賢等也金玉與芣苢一也何也執之皆病不執之皆藥也古人曰藥藥元無藥知無藥之藥則知無物之物矣卽不言治可矣箋九藥出世紀道行乎教非文不宣蓋將以詔眾而傳遠也故教託文顯道因教明三者相須而不可偏廢也然文有隱見教實與焉所以關乎道之興替也孔子著六經以鳴道天下宗之教已行矣秦皇出而儒書焚文旣隱而教遂熄漢出屋壁而列之文旣彰而道乃行是知文之隱見卽道之晦明也故夫子有斯文未喪之嘆一皆推之於天信非人之智力所能及也我玄元道祖當周室之衰將有事乎西征而關令尹望雲氣知天眞至於是預期齋戒以俟應兆旣至乃延而師之受道德五千之言及乎得其道乃祖玄述妙致大盡精而著爲是經將以擴明其教也按劉向言關尹子隱德行人易之蓋當時潛德不耀而教不大行今以莊列二書攷之列子則見而師之故多請問之辭莊子則聞風悅之遂稱之爲古之博大眞人以二子之高致而推尊如是其道蓋可知矣逮秦漢之交有蓋公者方異之人曹參嘗師事之事見於史以是書授參參旣用其道及薨與書俱葬孝武復得於方士又爲劉安匿之吁玄聖之書何鬱多而通鮮邪豈得之者懼夫漏神洩道寶秘而爲獨善之計邪自劉向表進之後獨見於葛稚川之序自茲以後是書遂秘由晉而來修文輔教如陶寇王尹李吳馬杜諸大師德所著子集見於藏室者不啻千餘卷終未有一言及於是書有宋碧虛先生教法中博贍者也其註老莊引證百家無所不至爲道德纂微序乃曰今之西升經卽關尹子書也又莊列所引之句是也或有之而亡也緣世亡其書道藏失載故斯億度也徽皇御極大弘玄教政和中雕鏤藏經凡兩詔天下蒐訪道門隱書甚至督責郡縣入進者加以賞所獲雖眾而此書竟不出金源大定初重陽祖師自秦抵海倡起全眞追三代之湻風續無爲之古教長春嗣教詔赴龍庭陳先王之道德慈儉好生之諫切切而進妙沃聖心大加開納繇是清淨之化雷動風行化洽華夷玄門大啟長春上仙之後清和典教名師高德輔玄翼德者珠聯玉耀於一時通都大邑宫觀相望星弁肩摩霞裾武接以至深山巖谷十百爲居草衣木食怡然有巢許之風雖髽童樵汲者亦皆進德業談道性無妄語一時教風之盛自三代而下未有如此時也𡻕癸巳有羽客張仲才南游回詣寶玄堂求見於宗師炷禮畢笈出一書將獻之眾師目之題籖曰關尹子書眾猶率然不爲意取讀之義奥文古詞徑閟澀猶車行螘蛭觸途皆硋乃相與鉤索漸得所指類推不已義大昭彰意至聖而言至希輕輕然冷冷然使人如登虛無之景遊廣漠之世不知心迹之俱超也眾師驚喜曰然則古有是書何絶世無聞今何從而出詰之則曰遊之楚得於采山之人蓋如李筌行陰符於石室也眾乃拜于宗師訴以得經之由宗師漠然久之曰時哉時哉斯文之出其天意乎是書不行於世蓋千年矣今天元啟瑞道化興行而此書出世者是其時也在吾門者宜自幸自慶生斯時值聖教探討服行以致其妙則聖人雖千古之遠遇之猶旦暮也嗚呼盛哉非天所𢌿其孰能與於此是經之出其異者蓋有三全眞之教千百世間然一出也此經秘絶亦千年矣今眞教方隆秘經隨出不先不後同時相值是一異也清和典教蓋三傳矣不出於前師如有所俟正清和典教之年翻然而出是二異也旣出張君卽得之自楚之燕踰二千里都無迂墜直獻于師如有所使者是三異也噫以千載之前之尹書付千載之後之尹氏惠然自至如芥投針以三斯者而驗焉蒼蒼之意不遠矣昔者河出圖洛出書六經出於壞壁故先王之道明聖門恃之爲龜鑑今聖書出於道隆之世其萬世玄門之龜鑑乎繼而披雲天師刋鏤藏經卽補入藏室稱爲文始眞經遵太上之命號也眞常眞人開置玄學才俊聚焉朝講夕演多及是經然其詞旨敻異自成一家略無莊列寓言駕辯乘風夢蝶傲世等語自宇至藥分次篇目極有奥旨章章義異皆不失篇題自有書契以來未有如此書之淵奥也通玄而致命知天而盡神剖五常百行之精微超六籍名言之迹演四句百非之要義異聱牙詰曲之辭窮益深測益遠若履橫杖浮大海躡飛葉游大虛葛翁模象之語仿佛遇之屢有時彥探微索隱作爲箋解然跋前㚄後反爲書玷抱一子謂咸備天神至聖四者之道如女嬰龍虎之語丹道之妙也鐘鼓舟車之語禪者之機也精水神火之語造化之秘也小隙小蟲之語人事之詳也我寓道寓之語無言之言也後學知其一者不知其二達其常者不達其變明乎空宗或昧於鍊養有無俱燭復疎於治文故解之者未免有管中窺豹之誚也象先昨游浙右得抱一先生所著言外經旨其道眼高明學問富贍註文不爲正經文字所束鼓舞變化指妙意於詞章之外而不失本旨故曰言外經旨所謂四者之道皆盡之矣其跌宕超詣出神入天亦足以起關尹於千載之下是註也惟曉於上智非訓詁之設也夫是經大教中不可闕者也抱一之註又是經中不可闕者也經旨旣明則使玄聖之旨昭昭乎如天日在上有眼目者俱得瞻依所謂教託文顯道因教明豈不信歟終南山樓觀宗聖宫卽眞人受經結草樓之地也人世雖更山川良是象先來瞻靈境心醉聖風游之詠之不知在數千年之外也因結夏是宫就出抱一之註札而傳之冀乎若道若俗若智若庸因經悟道因道度世是亦不辜大聖慈惠天下後世之心矣復慮得之者昧知其來不知尊敬故序出世之詳使知爲希有之遇而不自棄也凡我同志其朂之哉時至元十八異𡻕在辛巳重陽節日茆山道人朱象先誌
