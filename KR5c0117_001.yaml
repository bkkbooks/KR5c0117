front:
  text: 文始真經言外㫖卷之一
  hash: sha256:854ae4edc5bb29504bfdc1990bce0646cb6273b84741f2e0386855ed6c3c9ec4
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0117_HFL_001-001a, image: hfl/0453/0453-092.png}
body:
  text: 抱一子陳顯微述一宇篇宇者道也凡二十八章關尹子曰非有道不可言不可言即道非有道不可思不可思即道天物怒流人事錯錯然若若乎回也戛戛乎鬥也勿勿乎似而非也而爭之而介之而哯之而嘖之而去之而要之言之如吹影思之如鏤塵聖智造迷鬼神不識惟不可為不可致不可測不可分故曰天曰命曰神曰玄合曰道抱一子曰老子曰道可道非常道名可名非常名世之學者罕見關尹子書而多以百家之言及臆說解之愈不能明老子之㫖關尹謂使有道不可言則道與言為二惟不可言即道則言與道為一學者驟觀非有道不可言多誤認為有道可言若有道可言則當云有道非不可言不曰非有道不可言也今曰非有道不可言不可言即道是則翻老子之言以明老子言外之㫖也此言翻之則曰非有道不可道不可道即道既翻出不可道即道則翻出道可道非道矣道可道非道即是老子道可道非常道也或者猶疑可道為口道之道愚又翻經言以曉之曰如曰空可空非真空使其可空即是有物窒而不空之處豈謂之真空乎知空可空非真空則知道可道非常道矣或者喻曰如心心如性性皆可用功以人為而道獨不可以人為故不可以道道也向非翻言外之言吾終世不能明老子之經㫖矣世人又多被常字轉了將謂老子有非常之道然老子立此常字者政恐世人疑吾所謂道有異乎人也殊不知此乃通天下之常道爾猶强名曰道者通天下之常名爾是道也通天徹地亘古亘今無往而不在才開口言則去道遠矣故曰二也才指此强名之名為可名則非名矣惟不可名故假常名强名之猶曰非有名不可名不可名即名也是則不可言即道不可名即名即老子可道則非常道可名則非常名之意也然則老子大聖人也其言如天之不言之言非有大聖人如關尹子者疇能復以不言之言發明其言外之㫖哉然關尹子既發明不可名言之㫖矣又恐世人謂道不可名言則可以思而得之故又曰非有道不可思不可思即道與上意同噫可言可思皆人也不可言不可思皆天也然則人與天果可以異觀乎曰人皆可曰天然則人與天果可以同觀乎曰天物怒流人事錯錯然有相若而回者有相戛而鬥者有相勿而似而非者或爭而目以心鬥或介而不交於物或哯而呵叱之或嘖而呼唤之或去而離之或要而合之天物人事不齊如此豈可以同觀哉今欲以人之言思及之譬如吹影鏤塵徒勞心耳是道也聖智造之猶迷鬼神測之不識惟其不可為故曰天不可致故曰命不可測故曰神不可分故曰玄合是四者强名曰道關尹子曰無一物非天無一物非命無一物非神無一物非玄物既如此人豈不然人皆可曰天人皆可曰神人皆可致命通玄不可彼天此非天彼神此非神彼命此非命彼玄此非玄是以善吾道者即一物中知天盡神致命造玄學之徇異名析同實得之契同實忘異名抱一子曰老子言道繼之以常無欲以觀其妙常有欲以觀其徼同謂之玄玄之又玄衆妙之門關尹子恐學者徇異名析同實而並以天命神玄四者異觀之故於此章重言即一物中可以知天盡神致命造玄物物皆然人人本具不可彼天此非天彼神此非神彼命此非命彼玄此非玄也是則或曰妙或曰徼或曰玄亦物物皆然人人本具惟得之者契其同有之實忘其異謂之名至於玄之又玄可以入道矣關尹子曰觀道者如觀水以觀沼為未足則之河之江之海曰水至也殊不知我之津液涎淚皆水抱一子曰觀道如觀水則我與水為二矣所觀愈大所岐愈遠返照回光則吾身自有沼河江海也今之津液涎淚皆水非吾身中之沼河江海之發見者乎昧者不知耳關尹子曰道無人聖人不見甲是道乙非道道無我聖人不見已進道已退道以不有道故不無道以不得道故不失道抱一子曰有人則我與人為二有我則我與道為二我不可有道可有乎我不可得道可得乎惟不有我者然後能不無我惟不得我者然後能不失我不有不無不得不失豈如事物之有成壞得喪哉彼自執有所得者烏足以語此關尹子曰不知道妄意卜者如射覆盂高之者曰存金存玉中之者曰存角存羽卑之者曰存瓦存石是乎是非乎惟置物者知之抱一子曰使置物者不置物於覆盂之下則徒勞射覆者卜度矣是則甲置物而乙射覆為兩人矣今焉甲自置之而甲自覆之而不知所置何物何耶以物欲為盂以識陰為覆雖有大智力亦不能射此覆盂悟其置也何則併與置之時忘之矣自疑以為他人置之而我射之卜度終身而不能得一旦揭去物欲之盂破除識陰之覆而見其所置之物方悟置之者非他人而前日存金存玉存角存羽存瓦存石之想皆妄意也噫覆盂之下果何物乎學者毋以為未嘗置而昧之關尹子曰一陶能作萬器終無有一器能作陶者能害陶者一道能作萬物終無有一物能作道者能害道者抱一子曰謂之器矣焉能作陶焉能害陶謂之物矣焉能作道焉能害道然器不作陶謂之非陶則不可物不作道謂之非道則不可況器不能害陶而害陶者必器物不能害道而害道者必物然器存則陶存物在則道在去是器則陶安在哉亡是物則道安在哉果能去是器乎器成無盡果能亡是物乎物生無窮惟不器器謂之善陶惟不物物謂之善道善陶者陶乎陶善道者道乎道陶乎陶者不知其陶道乎道者不知其道不知其陶者無器可作不知其道者無物可成器乎物乎陶乎道乎關尹子曰道茫茫而無知乎心儻儻而無羈乎物迭迭而無非乎電之逸乎沙之飛乎聖人以知心一物一道一三者又合為一不以一格不一不以不一害一抱一子曰見物便見心無物心不現見心便見道無心道不現或曰先達以無心是道其說非乎又曰無心猶隔一重關其說信乎曰見物便見心時汝領會否曰會曰無物心不現時心安在哉或者茫然自失他日復問曰心可見乎曰心不可見孰可見曰道可見乎曰汝以為道與心一乎二乎曰心與道可一矣物可與道與心一乎曰汝欲以不一者害一乎或者唯唯而退關尹子曰以盆為沼以石為島魚環游之不知幾千萬里而不窮也夫何故水無源無歸聖人之道本無首末無尾所以應物不窮抱一子曰有首有尾者應物易窮無本無末者應物不窮傳曰如循環之無端孰能窮之哉嘗疑夫太素之先有太始太始之先有太初是則道未嘗無本末也太素者質之始太始者形之始太初者氣之始人能及本還源自太素以至太初如上百尺竿頭至矣盡矣不可以復上矣殊不知太初之外更有所謂太易焉太易者未見氣也是猶向百尺竿頭更進一步方見太易無首無尾無源無歸莫知所終莫知所始者矣雖然學者向百尺竿頭如何進步關尹子曰無愛道愛者水也無觀道觀者火也無逐道逐者木也無言道言者金也無思道思者土也惟聖人不離本情而登大道心既未萌道亦假之抱一子曰愛觀逐言思五者出於心心生則五者皆生心冥則五者皆泯經曰五賊在心施行於天世人有執一端以求道者或以愛或以觀或以逐或以言或以思起心動念去道愈遙惟聖人非不愛也愛未嘗愛非不觀也觀未嘗觀以至非不逐言思而未嘗逐言思故不離本情而登大道聖人本情豈異於人哉特心未嘗萌爾關尹子曰重雲蔽天江湖黯然游魚茫然忽望波明食動幸賜于天即而就之漁釣斃焉不知我無我而逐道者亦然抱一子曰逐者木也心已萌也有心逐道或遇異景異物異祥異氣異光異明異見異趣異靈異通橫執為道是猶魚望波明食動即而就之也惟知我無我則心無心矣安事逐哉或曰進修亦逐也精進亦逐也皆非也曰為學日益故須精進退修以成其德為道則日損損之又損以至於無為無為無不為是名真精進關尹子曰方術一作方士之在天下多矣或尚晦或尚明或尚弱或尚强執之皆是不執之皆道抱一子曰修真練性圓通覺輪所尚不同或觀音聲而尚晦或定光耀而尚明或運動而尚强或寂靜而尚弱是數者皆可以入道然執之則非道也事也苟不執之皆可以入道執不執之間相去遠哉關尹子曰道終不可得彼可得者名德不名道道終不可行彼可行者名行不名道聖人以可得可行者所以善吾生以不可得不可行者所以善吾死抱一子曰道不可須臾離也可離非道也若夫可得可行則可失可止可失可止則有時而離矣惟不可得不可行故須臾不可離須臾不可離則我在是道在是矣易曰顯道神德行道固自我以顯矣而德行尤不可不神也然聖人於道有所得者皆德也於道有所行者皆行也所以積德而不敢失德纍行而不敢失行功滿三千大羅為仙行滿八百大羅為客此皆以可得可行者善吾生也若夫不可得不可行者安有所謂生安有所謂死哉此所以善吾死也關尹子曰聞道之後有所為有所執者所以之人無所為無所執者所以之天為者必敗執者必失故聞道於朝可死於夕抱一子曰道果可聞乎聞於心而不聞於耳道果可傳乎傳於天而不傳於人天其可有所執乎故為者必敗執者必失皆人也以是知朝不聞道於天則人不真死於夕關尹子曰一情冥為聖人一情善為賢人一情惡為小人一情冥者自有之無不可得而示一情善惡者自無起有不可得而祕一情善惡為有知惟動物有之一情冥為無知溥天之下道無不在抱一子曰文王之不識不知孔子之無知老子之能無知乎皆聖人之冥情也自有之無蕩蕩乎不可名狀豈可得而示哉若夫顔孟之仁善桀跖之暴惡皆自無起有昭昭乎不可得而祕也一情善惡為有知動物皆然一情之冥為無知無知則與太虛同體矣故曰溥天之下道無不在關尹子曰勿以聖人力行不怠即曰道以勤成勿以聖人堅守不易即曰道以執得聖人力行猶之發矢因彼而行我不自行聖人堅守猶之握矢因彼而守我不自守抱一子曰時行則行時止則止聖人初何固必哉時乎用九則聖人自强不息非勤也因時而動不容息也時乎用六則聖人利永貞非執也因時而靜不容動也易曰動靜不失其時其道光明故學道有時節因緣聖人初何所容心於動靜哉善觀聖人者觀其時而己矣關尹子曰若以言行學識求道互相展轉無有得時知言如泉鳴知行如禽飛知學如擷影知識如計夢一息不存道將來契抱一子曰言行學識可以進德修業不可以求道捨言行學識四者之外孰從而求之哉善求道者不即四者亦不離四者知言如泉鳴無是非之可辨知行如禽飛無善惡之可思知學如擷影無得失可驗知識如計夢無事理之可尋是則有言忘言有行忘行有學忘學有識忘識則幾於道矣曰然則道可求乎曰求則非求也不求則真求也故曰一息不存道將來契關尹子曰以事建物即難以道棄物即易天下之物無不成之難壞之易抱一子曰以事建物天下之人爭趨之而不憚其難蓋有為之功有可把捉成之甚難而為之甚易也以道棄物天下之人咸畏之而不知其易蓋無為之功無可把捉成之甚易為之甚難也大而建立世界次而建邦立國以至成家立身莫不積德纍功目將月就或經歲或纍年或終身或積世不憚勞苦庶可晞冀信不易也至于一行之差一念之失一動之非一事之悮則隳壞世界喪覆邦國破家亡身可立而待故曰成之難而壞之易也至於懸崖撒手自肯承當不假修為立地成道至易也非天下至剛至健之大丈夫孰能與於此關尹子曰一灼之火能燒萬物物亡而火何存一息之道能冥萬物物亡而道何在抱一子曰天下之物皆有形有形則有我若夫有形而無我者惟火而然何也火不自立附物而現無我也使不附于草木金石火可安在哉是則天下無復存火矣然擊之金石鑽之竹木則火不期至而至矣火果有乎火果無乎聖人以火喻道噫善喻哉關尹子曰人生在世有生一日死者有生十年百年死者一日死者如一息得道十年百年死者如歷久得道彼未死者雖動作昭智止名為生不名為死彼未契道者雖動作昭智止名為事不名為道抱一子曰昔人謂方生方死方死方生蓋方生方死者生非真生方生方死者死非真死今有生一日死者生果真生乎死果真死乎以至十年百年莫不皆然何以知其真死曰動作昭智者是也曰孰不動作昭智曰未死者止名為生未契道者止名為事而已噫安得真死者而與之語道哉關尹子曰不知吾道無言無行而即有言有行者求道忽遇異物橫執為道殊不知捨源求流無時得源捨本求末無時得本抱一子曰言行可以進德不可以進道以言行求道不惟不可得道併與德失之矣何則彼求道者過於求德則過用其心以善言善行為不足為必求奇言異行以為跨德入道之蹊必有異事契其異言異物感其異行學者不悟橫執為道未有不遭魔境如道經佛書之所云者豈止無時得源無時得本而已哉其害有不可勝言者矣關尹子曰習射習御習琴習樂一作習奕終無一事可以一息得者惟道無形無方故可得之一息抱一子曰世事有為用力甚難而人樂為大道無為用力甚易而人不為何則世事如射如御如琴如棊有物有則可師可息故可漸為之非積歲纍時不能臻其妙大道無色無形無數無方不可師不可習不可漸造之有一彈指頃立地成道者或積歲纍時不得或一彈指頃得之相去遠矣此無他有為之功與無為之功不同也關尹子曰兩人射相遇則工拙見兩人奕相遇則勝負見兩人道相遇則無可示者無工無拙無勝無負抱一子曰孔子見溫伯雪子於魯目擊而道存無可示者無可言者世有主賔相見勘辨正邪以較高下淺深之學者兩俱失之矣安得兩眼對兩眼者與之相視而笑哉關尹子曰吾道如海有億萬金投之不見有億萬石投之不見有億萬汙穢投之不見能運小蝦小魚能運大鯤大鯨合衆水而受之不為有餘散衆水而分之不為不足抱一子曰以海喻道可謂善喻矣言其體則金石汗穢蝦魚鯤鯨無所不納言其用則合受分散善利善藏無所不周大哉海乎大哉道乎雖然使海知有一物存留其中知有一滴合散其中則海之為海殆矣問海知乎哉問道知乎哉關尹子曰吾道如處暗夫處明者不見暗中一物而處暗者能見明中區事抱一子曰處暗則不見我而見物不見我則亡我而身隱矣見物則昭智而不昧矣能亡我而昭智不昧聖人之功也若夫處明則見我見我則見明見明則不見暗中一物是則衆人熙熙如春登臺我形俱顯寵辱皆驚昧於倚伏而不覺不知者矣奚取哉關尹子曰小人之權歸于惡君子之權歸于善聖人之權歸于無所得惟無所得所以為道抱一子曰人皆有是權顧所歸如何耳權者謂無一定之稱也夫小人豈一定為惡耶能遷就為善則君子矣君子豈一定為善耶苟造次為惡則小人矣惟聖人權如虛空歸無所得學者於不思善不思惡之際而求其權之所歸亦幾矣關尹子曰吾道如劍以刃割物即利以手握刃即傷抱一子曰人患不達道達道之人斷天下事無難無易莫不迎刃而解蓋精神剛明智慧照徹物來自明事至自判不知其所以然而然也豈容一毫人力於其間哉若夫揆吾精神察吾智慧何剛何明何照何徹是猶以手握刃不自傷者鮮矣關尹子曰籩不問豆豆不答籩瓦不問石石不答瓦道亦不失作識問與答與一氣往來道何在抱一子曰道無問問無應是則人與人居道與道會有問有答一氣往來耳胡不觀諸籩豆瓦石乎籩與豆終日講禮而昧者不睹瓦與石終日談道而聾者不聽然則籩之與豆瓦之與石有問有答乎一氣往來乎關尹子曰仰道者跂如道者駸皆知道之事不知道之道是以聖人不望道而歉不恃道而豐不借道于聖不賈道于愚抱一子曰道不可求也求之者不得道不可道也逐之者不及道不可恃也恃之者不尊道不可衒也衒之者不貴世之學者未造道也仰而跂之望而慊然與夫師而資之如而駸之皆求之逐之者也既造道矣恃之而自豐衒之而賈愚皆不尊不貴者也是則知道之事不知道之道耳於道何有哉若夫聖人則不師而得不逐而及不恃而有不衒而貴前無聖人後無愚者獨往獨來知我者稀我者貴矣文始真經言外㫖卷之一
